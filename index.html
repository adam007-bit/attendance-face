<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartClass Pro - Advanced Analytics Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.02);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif; background: var(--bg); color: var(--text-primary); }
        
        .header { background: var(--card-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 99; box-shadow: var(--shadow); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; border-radius: 12px; }
        .header-left h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-left p { font-size: 0.7rem; color: var(--text-secondary); }
        .live-clock { background: var(--bg); padding: 8px 16px; border-radius: 40px; font-family: monospace; font-weight: 600; font-size: 0.85rem; color: var(--primary); }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 60px; display: flex; justify-content: space-around; padding: 8px 16px; z-index: 100; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 0.7rem; font-weight: 500; }
        .nav-item i { width: 22px; height: 22px; }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .main-content { padding: 20px 16px 100px; max-width: 600px; margin: 0 auto; }
        
        /* Hero Stats */
        .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .hero-card { background: var(--card-bg); border-radius: 20px; padding: 16px 12px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .hero-card .icon { width: 40px; height: 40px; margin: 0 auto 8px; background: rgba(99,102,241,0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        .hero-card .value { font-size: 24px; font-weight: 700; }
        .hero-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border-radius: 24px; padding: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.2s; cursor: pointer; }
        .stat-card:active { transform: scale(0.98); }
        .stat-info h4 { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; }
        .stat-number { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-icon { width: 48px; height: 48px; background: rgba(99,102,241,0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        
        /* Chart Cards */
        .chart-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .chart-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        canvas { max-height: 200px; width: 100% !important; }
        
        /* Data Table */
        .data-table { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .data-table h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); font-size: 0.75rem; }
        .badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-hadir { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-lewat { background: rgba(245,158,11,0.15); color: #f59e0b; }
        
        .class-selector { margin-bottom: 16px; }
        .class-selector select { width: 100%; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.85rem; font-weight: 500; }
        
        .info-box { background: rgba(99,102,241,0.08); border-radius: 16px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 0.8rem; }
        
        .trend-up { color: var(--success); }
        .trend-down { color: var(--danger); }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 56px; padding: 40px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border); }
        .login-card input { width: 100%; padding: 16px 20px; margin: 12px 0; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 1rem; }
        .btn { padding: 14px 20px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .action-buttons { display: flex; gap: 8px; }
        .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 20px; }
        .edit-btn { color: var(--primary); }
        .delete-btn { color: var(--danger); }
        .face-preview { width: 40px; height: 40px; border-radius: 20px; object-fit: cover; background: var(--bg); border: 2px solid var(--primary); cursor: pointer; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.8rem; }
        .btn-small { padding: 8px 16px; font-size: 0.75rem; width: auto; }
        .date-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .date-filter input { flex: 1; padding: 10px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .page-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; }
        
        .select-all { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .user-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .bulk-delete-bar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--danger); color: white; padding: 12px 24px; border-radius: 60px; display: flex; gap: 16px; z-index: 200; box-shadow: var(--shadow-lg); }
        
        .camera-section { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .camera-container { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 4/3; }
        #securityVideo, #registerVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; }
        .detection-indicator { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 20px; font-size: 10px; color: white; z-index: 10; }
        .camera-status { text-align: center; margin-top: 12px; font-size: 12px; padding: 8px; border-radius: 12px; }
        .status-active { background: rgba(16,185,129,0.15); color: #10b981; }
        .camera-selector { margin-bottom: 12px; }
        .camera-selector select { width: 100%; padding: 10px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); }
        .step-indicator { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .step-number { width: 36px; height: 36px; border-radius: 36px; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .step.active .step-number { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; }
        .step.completed .step-number { background: var(--success); color: white; }
        .register-form input, .register-form select { width: 100%; padding: 14px; border-radius: 60px; border: 1px solid var(--border); margin-bottom: 12px; font-size: 0.9rem; background: var(--card-bg); }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo" style="margin: 0 auto 20px; width: 70px; height: 70px;"><i data-lucide="brain" style="width: 36px; height: 36px;"></i></div>
            <h2>SmartClass Pro</h2>
            <p style="margin-bottom: 24px;">Advanced Analytics Dashboard</p>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn btn-primary" id="loginBtn">Login</button>
            <p style="margin-top: 15px; font-size: 12px;">Demo: admin / admin123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left">
            <div class="logo"><i data-lucide="brain"></i></div>
            <div><h1>SmartClass Pro</h1><p>Advanced Analytics • AI Face Recognition</p></div>
        </div>
        <div class="live-clock"><span id="currentTime">--:--:--</span></div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>

    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Home</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="camera"></i><span>Camera</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Register</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Records</span></div>
        <div class="nav-item" data-page="users"><i data-lucide="users"></i><span>Users</span></div>
    </div>

    <div id="bulkDeleteBar" class="bulk-delete-bar" style="display: none;">
        <span id="selectedCount">0 selected</span>
        <button class="btn-small" id="confirmBulkDelete" style="background: white; color: var(--danger);">Delete Selected</button>
        <button class="btn-small" id="cancelBulkDelete" style="background: rgba(255,255,255,0.3);">Cancel</button>
    </div>

    <script>
        // ==================== DATA STORAGE ====================
        let currentUser = null;
        const validUsers = [{ username: "admin", password: "admin123", role: "admin", name: "Admin" }];
        
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A","5B","5C","4A","4B","4C","3A","3B","2A","2B","1A","1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null, weeklyChart = null, classChart = null;
        let registerStep = 1;
        let pendingRegistration = null;
        let currentPageNum = 1, itemsPerPage = 10, searchQuery = "", startDate = "", endDate = "";
        let selectedUsers = new Set();
        
        // Camera
        let securityStream = null, registerStream = null, securityInterval = null, isSecurityActive = false, currentCameraId = 'user';
        let modelsLoaded = false, faceMatcher = null;
        let audioCtx = null, lastStrangerAlertTime = 0, lastAttendanceTime = {};
        let registerFaceDetected = false, registerDescriptor = null, registerInterval = null;
        let captureTimer = null, countdown = 3, isCountingDown = false;
        let capturedFaceImage = null;
        
        const DETECTION_INTERVAL = 200;
        const INPUT_SIZE = 320;
        
        // Helper Functions
        function loadLocalData() {
            const savedUsers = localStorage.getItem('smart_users');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            const savedAttendance = localStorage.getItem('smart_attendance');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            const savedAlerts = localStorage.getItem('smart_strangers');
            if (savedAlerts) strangerAlerts = JSON.parse(savedAlerts);
            const savedClass = localStorage.getItem('smart_class');
            if (savedClass) selectedClass = savedClass;
            const savedDescriptors = localStorage.getItem('smart_descriptors');
            if (savedDescriptors) {
                const desc = JSON.parse(savedDescriptors);
                registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; });
            }
        }
        
        function saveLocalData() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className, faceImage: u.faceImage }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {};
            registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
            localStorage.setItem('smart_class', selectedClass);
        }
        
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }
        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
        
        async function showSuccess(title, msg) { await Swal.fire({ title, text: msg, icon: 'success', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        async function showError(title, msg) { await Swal.fire({ title, text: msg, icon: 'error', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        async function showWarning(title, msg) { await Swal.fire({ title, text: msg, icon: 'warning', confirmButtonColor: '#f59e0b', borderRadius: '24px' }); }
        
        function playBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); setTimeout(() => o.stop(), 200); } catch(e) {} }
        function playAlertBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < 3; i++) { setTimeout(() => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15); setTimeout(() => o.stop(), 150); }, i * 200); } } catch(e) {} if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); }
        async function captureImageFromVideo(video) { if (!video || !video.videoWidth) return null; const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0); return c.toDataURL('image/jpeg', 0.8); }
        function updateUI() { if (currentPage === 'dashboard') renderDashboard(); if (currentPage === 'records') renderRecordsPage(); if (currentPage === 'users') renderUsersPage(); }
        
        // Face Recognition
        async function loadFaceModels() {
            const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(url), faceapi.nets.faceLandmark68Net.loadFromUri(url), faceapi.nets.faceRecognitionNet.loadFromUri(url)]);
            modelsLoaded = true;
            buildMatcher();
        }
        
        function buildMatcher() {
            const labeled = [];
            for (const u of registeredUsers) if (u.descriptor) labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
            if (labeled.length) faceMatcher = new faceapi.FaceMatcher(labeled, 0.55);
        }
        
        // Security Camera
        async function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentCameraId, width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE }, frameRate: { ideal: 30 } } });
                securityStream = stream;
                const videoEl = document.getElementById('securityVideo');
                if (videoEl) videoEl.srcObject = stream;
                isSecurityActive = true;
                if (!modelsLoaded) await loadFaceModels();
                if (securityInterval) clearInterval(securityInterval);
                securityInterval = setInterval(detectFaces, DETECTION_INTERVAL);
                const statusEl = document.getElementById('securityStatus');
                if (statusEl) { statusEl.innerHTML = '✅ Camera Active'; statusEl.className = 'camera-status status-active'; }
            } catch(e) { console.error(e); showError('Camera Error', 'Please allow camera access'); }
        }
        
        function stopSecurityCamera() { if (securityStream) { securityStream.getTracks().forEach(t => t.stop()); securityStream = null; } if (securityInterval) clearInterval(securityInterval); isSecurityActive = false; }
        
        async function detectFaces() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptors();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let recognized = [], stranger = false;
            for (const d of detections) {
                let best = null;
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(d.descriptor);
                    if (result.label !== 'unknown') best = registeredUsers.find(u => u.id === result.label);
                }
                const box = d.detection.box;
                ctx.beginPath(); ctx.rect(box.x, box.y, box.width, box.height);
                if (best) {
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui';
                    ctx.fillText(best.name, box.x, box.y - 5);
                    recognized.push(best.name);
                    await autoMarkAttendance(best);
                } else {
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ STRANGER', box.x, box.y - 5);
                    stranger = true;
                }
            }
            const detectEl = document.getElementById('detectCount');
            if (detectEl) detectEl.innerHTML = detections.length ? `👤 ${detections.length} face(s)` : '👤 No face';
            const recognizedEl = document.getElementById('recognizedNames');
            if (recognizedEl) recognizedEl.innerHTML = recognized.length ? `✅ Recognized: ${recognized.join(', ')}` : '✅ Waiting...';
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) { lastStrangerAlertTime = Date.now(); const img = await captureImageFromVideo(video); await reportStranger(img); }
        }
        
        async function autoMarkAttendance(user) {
            const today = getTodayDate();
            const session = getCurrentSession();
            const key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            const already = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!already) {
                lastAttendanceTime[key] = Date.now();
                const tv = new Date().getHours() * 60 + new Date().getMinutes();
                let status = "Hadir";
                if (session === 'pagi' && tv > 510) status = "Lewat";
                if (session === 'petang' && tv > 810) status = "Lewat";
                attendanceRecords.push({ id: user.id, name: user.name, role: user.role, className: user.className, status, session, sessionName: session === 'pagi' ? 'Morning' : 'Afternoon', time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto' });
                saveLocalData();
                playBeep();
                updateUI();
            }
        }
        
        async function reportStranger(img) {
            const alert = { id: Date.now(), className: selectedClass === "Semua Kelas" ? "Unknown" : selectedClass, time: getCurrentTime(), date: getTodayDate(), session: getCurrentSession(), imageData: img };
            strangerAlerts.push(alert);
            saveLocalData();
            playAlertBeep();
            await Swal.fire({ title: '⚠️ SECURITY ALERT!', html: `<img src="${img}" style="width:150px;border-radius:16px;margin:10px 0;"><br><strong>Stranger detected!</strong><br>Class: ${alert.className}<br>Time: ${alert.time}`, icon: 'warning', confirmButtonColor: '#ef4444' });
            updateUI();
        }
        
        // Register Face
        function startRegisterCamera() {
            if (registerStream) stopRegisterCamera();
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE } } })
                .then(s => { registerStream = s; const videoEl = document.getElementById('registerVideo'); if (videoEl) videoEl.srcObject = s; if (registerInterval) clearInterval(registerInterval); registerInterval = setInterval(checkRegisterFace, 150); }).catch(e => console.error(e));
        }
        
        function stopRegisterCamera() { if (registerStream) { registerStream.getTracks().forEach(t => t.stop()); registerStream = null; } if (registerInterval) clearInterval(registerInterval); if (captureTimer) clearTimeout(captureTimer); isCountingDown = false; }
        
        async function checkRegisterFace() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath(); ctx.rect(cx, cy, w, h);
            if (detection) {
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Face Detected!', cx, cy - 5);
                if (!registerFaceDetected) { registerFaceDetected = true; registerDescriptor = Array.from(detection.descriptor); capturedFaceImage = await captureImageFromVideo(video); startCountdown(); }
            } else {
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 14px system-ui';
                ctx.fillText('Place your face here', cx, cy - 5);
                registerFaceDetected = false;
                if (captureTimer) clearTimeout(captureTimer);
                isCountingDown = false;
                const statusEl = document.getElementById('regCameraStatus');
                if (statusEl) statusEl.innerHTML = '● Position your face';
            }
        }
        
        function startCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;
            countdown = 3;
            const showCount = () => {
                if (!registerFaceDetected) { isCountingDown = false; return; }
                const statusEl = document.getElementById('regCameraStatus');
                if (statusEl) statusEl.innerHTML = `🎯 Capturing in ${countdown}...`;
                if (countdown === 0) { isCountingDown = false; autoRegister(); }
                else { countdown--; setTimeout(showCount, 1000); }
            };
            showCount();
        }

            const newUser = { id: Date.now().toString(), ...pendingRegistration, descriptor: registerDescriptor, faceImage: capturedFaceImage, registeredAt: new Date().toISOString() };
            registeredUsers.push(newUser);

                <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search..." value="${escapeHtml(searchQuery)}"><button class="btn-small btn-primary" id="searchBtn">Search</button></div>
                <div class="date-filter"><input type="date" id="startDateInput" value="${startDate}"><input type="date" id="endDateInput" value="${endDate}"><button class="btn-small btn-primary" id="filterBtn">Filter</button><button class="btn-small btn-secondary" id="resetBtn">Reset</button></div>
                <div class="data-table"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h3>⚠️ Stranger Alerts (${todayStrangers.length})</h3><button class="btn-small btn-primary" id="exportBtn">📊 Export CSV</button></div><div id="strangerList"></div></div>
                <div class="data-table"><h3>📋 Attendance Records (${filtered.length})</h3><div class="table-container"><table><thead><tr><th>Name</th><th>Class</th><th>Session</th><th>Status</th><th>Date</th><th>Time</th></tr></thead><tbody>${paginated.map(r => `<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${escapeHtml(r.className)}</td><td>${r.sessionName}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="6">No records</td></tr>'}</tbody></table></div>${renderPagination(filtered.length)}</div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            const strangerContainer = document.getElementById('strangerList');
            if (strangerContainer) strangerContainer.innerHTML = todayStrangers.length ? todayStrangers.map(a => `<div class="danger-banner"><div>${a.imageData ? `<img src="${a.imageData}" class="stranger-image" onclick="viewStrangerImage('${a.imageData}')">` : '📷'}</div><div><strong>⚠️ Stranger!</strong><br>Class: ${a.className} | Time: ${a.time}</div><button class="btn-small btn-primary" onclick="downloadImage('${a.imageData}',${a.id})">💾 Save</button></div>`).join('') : '<p>✅ No stranger alerts</p>';
            const recordFilter = document.getElementById('recordClassFilter'); if (recordFilter) recordFilter.onchange = (e) => { selectedClass = e.target.value; saveLocalData(); currentPageNum = 1; renderRecordsPage(); };
            const searchBtn = document.getElementById('searchBtn'); if (searchBtn) searchBtn.onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            const filterBtn = document.getElementById('filterBtn'); if (filterBtn) filterBtn.onclick = () => { startDate = document.getElementById('startDateInput').value; endDate = document.getElementById('endDateInput').value; currentPageNum = 1; renderRecordsPage(); };
            const resetBtn = document.getElementById('resetBtn'); if (resetBtn) resetBtn.onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            const exportBtn = document.getElementById('exportBtn'); if (exportBtn) exportBtn.onclick = exportToCSV;
        }
        
        window.viewStrangerImage = (img) => { Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#6366f1', borderRadius: '24px' }); };
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera(); stopRegisterCamera();
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
            else if (page === 'users') renderUsersPage();
        }
        
        // Login
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                loadLocalData(); buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels();
            } else { showError('Login Failed', 'Invalid username or password'); }
        }
        
        function logout() { localStorage.removeItem('loggedInUser'); location.reload(); }
        
        // Initialize
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
        window.navigateTo = navigateTo;
        setInterval(() => { const timeEl = document.getElementById('currentTime'); if (timeEl) timeEl.innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
        
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            loadLocalData(); buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels();
        }
    </script>
</body>
</html>
