<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SmartClass Pro - Fast Face Detection</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.5);
            --shadow-lg: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.5);
        }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text-primary); transition: all 0.3s; }
        
        .header { position: sticky; top: 0; z-index: 100; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; }
        .header-left h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-left p { font-size: 0.7rem; color: var(--text-secondary); }
        .header-right { display: flex; gap: 12px; align-items: center; }
        .user-badge { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 16px; border-radius: 40px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: none; cursor: pointer; color: var(--text-primary); }
        .logout-btn { background: rgba(239,68,68,0.15); color: var(--danger); border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .live-clock { background: var(--bg); padding: 8px 16px; border-radius: 40px; font-family: monospace; font-weight: 600; font-size: 0.85rem; }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 60px; display: flex; justify-content: space-around; padding: 8px 16px; z-index: 100; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 0.7rem; font-weight: 500; }
        .nav-item i { width: 22px; height: 22px; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .main-content { padding: 20px 16px 100px; max-width: 600px; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; padding: 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .stat-card:active { transform: scale(0.97); }
        .stat-info h3 { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-number { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-icon { width: 48px; height: 48px; background: rgba(99,102,241,0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        
        .camera-section { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 20px; }
        .camera-container { position: relative; background: #000; border-radius: 24px; overflow: hidden; aspect-ratio: 4/3; }
        #securityVideo, #registerVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .detection-indicator { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 30px; font-size: 11px; color: white; z-index: 10; font-family: monospace; }
        .light-indicator { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 30px; font-size: 10px; color: white; z-index: 10; }
        .torch-btn { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border: none; border-radius: 40px; padding: 8px 16px; color: white; font-size: 11px; display: flex; align-items: center; gap: 6px; cursor: pointer; z-index: 10; }
        .camera-status { text-align: center; margin-top: 14px; font-size: 0.8rem; padding: 10px; border-radius: 20px; font-weight: 500; }
        .status-active { background: rgba(16,185,129,0.15); color: var(--success); }
        .status-detecting { background: rgba(99,102,241,0.15); color: var(--primary); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .qr-container { background: #000; border-radius: 24px; overflow: hidden; aspect-ratio: 1; max-width: 300px; margin: 0 auto; }
        #qr-reader { width: 100%; height: 100%; }
        
        .data-table { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 20px; }
        .data-table h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); }
        .badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-hadir { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-lewat { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-teacher { background: rgba(99,102,241,0.15); color: var(--primary); }
        .badge-student { background: rgba(139,92,246,0.15); color: var(--purple); }
        
        .register-form input, .register-form select { width: 100%; padding: 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); margin-bottom: 12px; font-size: 0.9rem; color: var(--text-primary); }
        .btn { padding: 14px 20px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--text-secondary); color: white; }
        .btn:active { transform: scale(0.97); }
        .btn-small { padding: 8px 16px; font-size: 0.75rem; width: auto; }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-bar input { flex: 1; padding: 12px 18px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.8rem; }
        .date-filter { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .date-filter input { flex: 1; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-btn { padding: 8px 14px; border-radius: 30px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; }
        
        .danger-banner { background: rgba(239,68,68,0.1); border-left: 4px solid var(--danger); border-radius: 16px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; animation: shake 0.3s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .stranger-image { width: 55px; height: 55px; border-radius: 16px; object-fit: cover; border: 2px solid var(--danger); cursor: pointer; }
        
        .action-buttons { display: flex; gap: 8px; }
        .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 20px; }
        .edit-btn { color: var(--primary); }
        .delete-btn { color: var(--danger); }
        
        .step-indicator { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .step-number { width: 44px; height: 44px; border-radius: 44px; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: var(--text-secondary); }
        .step.active .step-number { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; }
        .step.completed .step-number { background: var(--success); color: white; }
        .step-label { font-size: 0.7rem; font-weight: 500; color: var(--text-secondary); }
        .step.active .step-label { color: var(--primary); font-weight: 600; }
        
        .chart-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 20px; }
        canvas { max-height: 200px; }
        
        .class-selector, .camera-selector { margin-bottom: 16px; }
        .class-selector select, .camera-selector select { width: 100%; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.85rem; }
        
        .countdown-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: rgba(0,0,0,0.85); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: bold; color: white; z-index: 20; animation: pop 0.2s ease; border: 3px solid var(--success); }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 56px; padding: 40px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border); animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .login-card input { width: 100%; padding: 16px 20px; margin: 12px 0; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 1rem; }
        .info-box { background: rgba(99,102,241,0.1); border-radius: 20px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 0.8rem; }
        
        .fps-counter { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 4px 8px; border-radius: 20px; font-size: 9px; color: #0f0; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo" style="margin: 0 auto 20px; width: 70px; height: 70px;"><i data-lucide="brain" style="width: 36px; height: 36px;"></i></div>
            <h2>SmartClass Pro</h2>
            <p style="margin-bottom: 24px;">Fast Face Detection | 10x per second</p>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn btn-primary" id="loginBtn">Login</button>
            <p style="margin-top: 20px; font-size: 12px;">Demo: admin / admin123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left"><div class="logo"><i data-lucide="brain"></i></div><div><h1>SmartClass Pro</h1><p>Fast Detection • 10x/sec • Auto Flash</p></div></div>
        <div class="header-right"><div class="user-badge"><i data-lucide="user"></i><span id="userName">Admin</span></div><button class="icon-btn" id="darkModeToggle"><i data-lucide="moon"></i></button><button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i></button><div class="live-clock"><span id="currentTime">--:--:--</span></div></div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="shield-check"></i><span>Security</span></div>
        <div class="nav-item" data-page="qrcode"><i data-lucide="qr-code"></i><span>QR Scan</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Register</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Records</span></div>
    </div>

    <script>
        // ==================== FAST DETECTION OPTIMIZED ====================
        // Optimasi kelajuan detection - 10x per saat
        const DETECTION_INTERVAL = 100; // 10 kali sesaat (paling cepat!)
        const INPUT_SIZE = 320;
        const MIN_CONFIDENCE = 0.2; // Rendahkan untuk lebih sensitif
        const SIMILARITY_THRESHOLD = 0.6;
        
        // Voice Greeting
        function speakGreeting(name, role, status) {
            const utterance = new SpeechSynthesisUtterance(`Welcome ${name}. ${role === 'teacher' ? 'Teacher' : 'Student'}. ${status}.`);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        // Login System
        let currentUser = null;
        const validUsers = [{ username: "admin", password: "admin123", role: "admin", name: "Admin" }];
        
        // Data Storage
        let registeredUsers = [], attendanceRecords = [], strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let registerStep = 1;
        let pendingRegistration = null;
        let currentPageNum = 1, itemsPerPage = 10, searchQuery = "", startDate = "", endDate = "";
        
        // Camera & Flash
        let securityStream = null, registerStream = null, securityInterval = null, isSecurityActive = false, currentCameraId = 'user';
        let torchEnabled = false, videoTrack = null;
        let frameCount = 0, lastFpsUpdate = 0;
        
        // Auto Capture Timer
        let captureTimer = null;
        let countdownValue = 3;
        let isCountingDown = false;
        
        // Face Recognition
        let modelsLoaded = false, faceMatcher = null;
        let html5QrCode = null, isScanning = false;
        let audioCtx = null, lastStrangerAlertTime = 0, lastAttendanceTime = {};
        let registerFaceDetected = false, registerDescriptor = null, registerInterval = null;
        
        // Firebase
        const firebaseConfig = { apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io", authDomain: "secuirityschool.firebaseapp.com", projectId: "secuirityschool", storageBucket: "secuirityschool.firebasestorage.app", messagingSenderId: "321431921421", appId: "1:321431921421:web:265abf74d07deb917bc644" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Helpers
        function loadLocal() {
            const u = localStorage.getItem('smart_users'); if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('smart_attendance'); if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('smart_strangers'); if (s) strangerAlerts = JSON.parse(s);
            const d = localStorage.getItem('smart_descriptors');
            if (d) { const desc = JSON.parse(d); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
        }
        function saveLocal() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {}; registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
        }
        async function syncToFirebase() { try { for (const u of registeredUsers) { const data = { ...u }; delete data.descriptor; await db.collection('users').doc(u.id).set(data, { merge: true }); } for (const a of attendanceRecords) await db.collection('attendance').doc(`${a.id}_${a.date}_${a.session}`).set(a, { merge: true }); } catch(e) {} }
        async function loadFromFirebase() { try { const u = await db.collection('users').get(); u.forEach(d => { if (!registeredUsers.find(x => x.id === d.id)) registeredUsers.push(d.data()); }); const a = await db.collection('attendance').get(); a.forEach(d => { if (!attendanceRecords.find(x => x.id === d.data().id && x.date === d.data().date)) attendanceRecords.push(d.data()); }); saveLocal(); updateUI(); } catch(e) {} }
        
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }
        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
        async function showSuccess(t, m) { await Swal.fire({ title: t, text: m, icon: 'success', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        async function showError(t, m) { await Swal.fire({ title: t, text: m, icon: 'error', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        function playBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); setTimeout(() => o.stop(), 200); } catch(e) {} }
        function playAlertBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < 3; i++) { setTimeout(() => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15); setTimeout(() => o.stop(), 150); }, i * 200); } } catch(e) {} if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); }
        async function captureImage(video) { if (!video || !video.videoWidth) return null; const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0); return c.toDataURL('image/jpeg', 0.8); }
        function updateUI() { if (currentPage === 'dashboard') renderDashboard(); if (currentPage === 'records') renderRecordsPage(); if (currentPage === 'register') renderUsersTable(); }
        
        // ==================== FACE RECOGNITION MODELS ====================
        async function loadFaceModels() {
            const status = document.getElementById('securityStatus');
            if (status) { status.innerHTML = '⚡ Loading Fast AI Model...'; status.className = 'camera-status status-detecting'; }
            const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(url),
                faceapi.nets.faceLandmark68Net.loadFromUri(url),
                faceapi.nets.faceRecognitionNet.loadFromUri(url)
            ]);
            modelsLoaded = true;
            buildFaceMatcher();
            if (status) { status.innerHTML = '✅ AI Ready - Fast Detection 10x/sec'; status.className = 'camera-status status-active'; }
        }
        
        function buildFaceMatcher() {
            const labeled = [];
            for (const u of registeredUsers) {
                if (u.descriptor) {
                    labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
                }
            }
            if (labeled.length) {
                faceMatcher = new faceapi.FaceMatcher(labeled, SIMILARITY_THRESHOLD);
            }
        }
        
        // ==================== SECURITY CAMERA WITH FAST DETECTION ====================
        async function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: currentCameraId, 
                        width: { ideal: INPUT_SIZE }, 
                        height: { ideal: INPUT_SIZE }, 
                        frameRate: { ideal: 30 } 
                    } 
                });
                securityStream = stream;
                videoTrack = stream.getVideoTracks()[0];
                document.getElementById('securityVideo').srcObject = stream;
                isSecurityActive = true;
                if (!modelsLoaded) await loadFaceModels();
                if (securityInterval) clearInterval(securityInterval);
                securityInterval = setInterval(detectFacesFast, DETECTION_INTERVAL);
                
                // FPS counter
                lastFpsUpdate = Date.now();
                setInterval(() => {
                    if (isSecurityActive) {
                        const fps = Math.round(frameCount / ((Date.now() - lastFpsUpdate) / 1000));
                        const fpsEl = document.getElementById('fpsCounter');
                        if (fpsEl) fpsEl.innerHTML = `${fps}fps`;
                        frameCount = 0;
                        lastFpsUpdate = Date.now();
                    }
                }, 1000);
                
                const status = document.getElementById('securityStatus');
                if (status) { status.innerHTML = '🎯 Camera Active - Fast Detection 10x/sec'; status.className = 'camera-status status-active'; }
            } catch(e) { console.error(e); showError('Camera Error', 'Please allow camera access'); }

        function detectLightLevel(video) {
            if (!video || !video.videoWidth) return 100;
            const canvas = document.createElement('canvas');
            canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let total = 0;
            for (let i = 0; i < data.length; i += 4) {
                total += (data[i] + data[i+1] + data[i+2]) / 3;
            }
            return total / 2500;
        }

        async function disableTorch() {

        async function detectFacesFast() {
            if (!isSecurityActive || !modelsLoaded) return;
            frameCount++;
            
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            
            // Check light level and auto flash
            const light = detectLightLevel(video);
            const lightEl = document.getElementById('lightIndicator');
            if (lightEl) {
                lightEl.innerHTML = light < 50 ? '🌙 Dark' : (light > 100 ? '☀️ Bright' : '☀️ Good');
                lightEl.style.backgroundColor = light < 50 ? 'rgba(245,158,11,0.9)' : 'rgba(0,0,0,0.7)';
            }
            
            // Auto enable torch in low light for back camera
            if (light < 50 && currentCameraId === 'environment' && !torchEnabled && videoTrack) {
                await enableTorch();
            } else if (light > 80 && torchEnabled) {
                await disableTorch();
            }
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // SUPER FAST detection with lower confidence threshold
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: MIN_CONFIDENCE }))
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let recognizedNames = [];
            let strangerDetected = false;
            
            for (const detection of detections) {
                let bestMatch = null;
                let confidence = 0;
                
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(detection.descriptor);
                    if (result.label !== 'unknown') {
                        bestMatch = registeredUsers.find(u => u.id === result.label);
                        confidence = Math.round((1 - result.distance) * 100);
                    }
                }
                
                const box = detection.detection.box;
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.width, box.height);
                
                if (bestMatch) {
                    // Recognized face - GREEN box
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText(`${bestMatch.name} (${confidence}%)`, box.x, box.y - 5);
                    recognizedNames.push(bestMatch.name);
                    await autoMarkAttendance(bestMatch, confidence);
                } else {
                    // Stranger face - RED box
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ STRANGER!', box.x, box.y - 5);
                    strangerDetected = true;
                }
            }
            
            // Update UI indicators
            const detectEl = document.getElementById('detectCount');
            if (detectEl) {
                detectEl.innerHTML = detections.length ? `👤 ${detections.length} face(s) | Light: ${Math.round(light)}%` : '👤 No face detected';
            }
            
            const recognizedEl = document.getElementById('recognizedNames');
            if (recognizedEl) {
                recognizedEl.innerHTML = recognizedNames.length ? `✅ Recognized: ${recognizedNames.join(', ')}` : '✅ Waiting for face...';
                if (detections.length > 0) recognizedEl.className = 'camera-status status-active';
                else recognizedEl.className = 'camera-status';
            }
            
            // Stranger alert
            if (strangerDetected && Date.now() - lastStrangerAlertTime > 8000) {
                lastStrangerAlertTime = Date.now();
                const img = await captureImage(video);
                await reportStranger(img);
            }
        }
        
        async function autoMarkAttendance(user, confidence) {
            const today = getTodayDate();
            const session = getCurrentSession();
            const key = `${user.id}_${today}_${session}`;
            
            // Prevent duplicate within 3 seconds
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            
            const alreadyLogged = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!alreadyLogged) {
                lastAttendanceTime[key] = Date.now();
                
                const now = new Date();
                const timeValue = now.getHours() * 60 + now.getMinutes();
                let statusName = "Hadir";
                let statusText = "Present";
                
                if (session === 'pagi' && timeValue > 510) { statusName = "Lewat"; statusText = "Late"; }
                if (session === 'petang' && timeValue > 810) { statusName = "Lewat"; statusText = "Late"; }
                
                attendanceRecords.push({
                    id: user.id, name: user.name, role: user.role, className: user.className,
                    status: statusName, session: session, sessionName: session === 'pagi' ? 'Morning' : 'Afternoon',
                    time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto', confidence: confidence
                });
                saveLocal();
                syncToFirebase();
                playBeep();
                
                // Voice greeting
                speakGreeting(user.name, user.role, statusText);
                
                // Toast notification
                Swal.fire({
                    title: '✅ Attendance Recorded!',
                    html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${statusText}<br>Confidence: ${confidence}%<br>Time: ${getCurrentTime()}`,
                    icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2500,
                    background: 'white', borderRadius: '20px'
                });
                updateUI();
            }
        }

        function startRegisterCamera() {

                    registerInterval = setInterval(checkFaceForRegister, 100);
                }).catch(e => console.error(e));

            isCountingDown = false;
        }
        
        async function checkFaceForRegister() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: MIN_CONFIDENCE }))
                .withFaceLandmarks()
                .withFaceDescriptor();
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath();
            ctx.rect(cx, cy, w, h);
            
            if (detection) {
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Face Detected! Auto capture in 3...', cx, cy - 5);
                
                if (!registerFaceDetected) {
                    registerFaceDetected = true;
                    registerDescriptor = Array.from(detection.descriptor);
                    startAutoCaptureCountdown(video, canvas);
                }
            } else {
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Place your face in the box', cx, cy - 5);
                registerFaceDetected = false;
                if (captureTimer) clearTimeout(captureTimer);
                isCountingDown = false;
                document.getElementById('regCameraStatus').innerHTML = '● Position your face, auto capture in 3 seconds';
            }
        }
        
        function startAutoCaptureCountdown(video, canvas) {
            if (isCountingDown) return;
            isCountingDown = true;
            countdownValue = 3;
            
            const showCountdown = () => {
                if (!registerFaceDetected) { isCountingDown = false; return; }
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 56px system-ui';
                ctx.fillText(`${countdownValue}`, canvas.width/2 - 20, canvas.height/2 + 20);
                document.getElementById('regCameraStatus').innerHTML = `🎯 Auto capturing in ${countdownValue}...`;
                
                if (countdownValue === 0) {
                    isCountingDown = false;
                    autoRegisterFace();
                } else {
                    countdownValue--;
                    setTimeout(showCountdown, 1000);
                }
            };
            showCountdown();
        }
        
        async function autoRegisterFace() {
            if (!pendingRegistration) {
                await showError('Error', 'Fill name and class first');
                registerStep = 1;
                renderRegisterPage();
                return;
            }
            if (!registerFaceDetected || !registerDescriptor) {
                await showWarning('No Face', 'Position face in green box');
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                ...pendingRegistration,
                descriptor: registerDescriptor,
                registeredAt: new Date().toISOString(),
                qrData: JSON.stringify({ id: Date.now().toString(), name: pendingRegistration.name, role: pendingRegistration.role, className: pendingRegistration.className })
            };
            registeredUsers.push(newUser);
            saveLocal();
            syncToFirebase();
            buildFaceMatcher();
            
            await showSuccess('✅ Registration Successful!', `${newUser.name} (${newUser.role === 'teacher' ? 'Teacher' : 'Student'})\nClass: ${newUser.className}\n✅ Face saved to AI database!`);
            speakGreeting(newUser.name, newUser.role, "Registration successful");
            pendingRegistration = null;
            registerStep = 1;
            if (!availableClasses.includes(newUser.className)) {
                availableClasses.push(newUser.className);
                availableClasses.sort();
            }
            renderRegisterPage();
        }

            pendingRegistration = { name, role, className };

                <div class="step-indicator">
                    <div class="step active"><div class="step-number">1</div><div class="step-label">Info</div></div>
                    <div class="step"><div class="step-number">2</div><div class="step-label">Auto Capture</div></div>
                </div>
                <div class="data-table">
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Full Name *">
                        <select id="regRole">
                            <option value="student">🎓 Student</option>
                            <option value="teacher">👩‍🏫 Teacher</option>
                        </select>
                        <select id="regClass">
                            <option value="">Select Class *</option>
                            ${availableClasses.map(c => `<option value="${c}">Class ${c}</option>`).join('')}
                            <option value="Lain-lain">Other Class</option>
                        </select>
                        <input type="text" id="regClassOther" placeholder="Other class" style="display:none;">
                        <button class="btn btn-primary" id="continueBtn">Continue →</button>
                    </div>
                </div>
                <div class="data-table">
                    <h3>👥 Registered Users</h3>
                    <div id="usersList"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('regClass').onchange = () => {
                document.getElementById('regClassOther').style.display = document.getElementById('regClass').value === 'Lain-lain' ? 'block' : 'none';
            };
            
            document.getElementById('continueBtn').onclick = async () => {
                let className = document.getElementById('regClass').value;
                if (className === 'Lain-lain') {
                    className = document.getElementById('regClassOther').value.trim();
                    if (!className) {
                        await showError('Error', 'Please select class');
                        return;
                    }
                }
                await saveNameAndClass();
            };
            renderUsersTable();
        }
        
        function renderUsersTable() {
            const container = document.getElementById('usersList');
            if (!container) return;
            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead><tr><th>Name</th><th>Role</th><th>Class</th><th></th></tr></thead>
                        <tbody>
                            ${registeredUsers.map(u => `
                                <tr>
                                    <td><strong>${escapeHtml(u.name)}</strong></td>
                                    <td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Teacher' : 'Student'}</span></td>
                                    <td>${escapeHtml(u.className)}</td>
                                    <td class="action-buttons">
                                        <button class="edit-btn" onclick="editUserById('${u.id}')"><i data-lucide="edit-2"></i></button>
                                        <button class="delete-btn" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2"></i></button>
                                    </td>
                                </tr>
                            `).join('') || '<tr><td colspan="4">No users registered</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
            lucide.createIcons();
        }
        
        window.editUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) deleteUser(u); };
        
        function renderRegisterStep2() {
            const html = `
                <div class="step-indicator">
                    <div class="step completed"><div class="step-number">✓</div><div class="step-label">Info</div></div>
                    <div class="step active"><div class="step-number">2</div><div class="step-label">Auto 3-2-1</div></div>
                </div>
                <div class="info-box">
                    <i data-lucide="camera"></i>
                    <div><strong>Auto Capture in 3...2...1...</strong><br>Position your face in the green box, system will auto capture after 3 seconds!</div>
                </div>
                <div class="camera-container">
                    <video id="registerVideo" autoplay playsinline></video>
                    <canvas id="registerCanvas" class="face-canvas"></canvas>
                </div>
                <div class="camera-status" id="regCameraStatus">● Position your face, auto capture in 3 seconds</div>
                <div class="data-table">
                    <div style="background:rgba(16,185,129,0.1);padding:16px;border-radius:20px;margin-bottom:16px;">
                        <strong>📝 ${escapeHtml(pendingRegistration.name)}</strong><br>
                        ${pendingRegistration.role === 'teacher' ? 'Teacher' : 'Student'} | Class ${pendingRegistration.className}
                    </div>
                    <button class="btn btn-secondary" id="backBtn" style="margin-top:16px;">← Back</button>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startRegisterCamera();
            document.getElementById('backBtn').onclick = backToStep1;
        }
        
        function renderRecordsPage() {
            let filtered = getFilteredAttendance();
            const paginated = getPaginatedData(filtered);
            const todayStrangers = strangerAlerts.filter(a => a.date === getTodayDate() && (selectedClass === "Semua Kelas" || a.className === selectedClass));
            
            const html = `
                <div class="class-selector">
                    <select id="recordClassFilter">
                        <option value="Semua Kelas" ${selectedClass === "Semua Kelas" ? 'selected' : ''}>📚 All Classes</option>
                        ${availableClasses.map(c => `<option value="${c}" ${selectedClass === c ? 'selected' : ''}>📖 Class ${c}</option>`).join('')}
                    </select>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="🔍 Search by name..." value="${escapeHtml(searchQuery)}">
                    <button class="btn-small btn-primary" id="searchBtn">Search</button>
                </div>
                <div class="date-filter">
                    <input type="date" id="startDateInput" value="${startDate}">
                    <input type="date" id="endDateInput" value="${endDate}">
                    <button class="btn-small btn-primary" id="filterBtn">Filter</button>
                    <button class="btn-small btn-secondary" id="resetBtn">Reset</button>
                </div>
                <div class="data-table">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
                        <h3>⚠️ Stranger Alerts (${todayStrangers.length})</h3>
                        <div>
                            <button class="btn-small btn-primary" id="pdfBtn">📄 PDF</button>
                            <button class="btn-small btn-success" id="excelBtn">📊 Excel</button>
                        </div>
                    </div>
                    <div id="strangerList"></div>
                </div>
                <div class="data-table">
                    <h3>📋 Attendance Records (${filtered.length})</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr><th>Name</th><th>Class</th><th>Session</th><th>Status</th><th>Date</th><th>Time</th><th>Confidence</th></tr>
                            </thead>
                            <tbody>
                                ${paginated.map(r => `
                                    <tr>
                                        <td><strong>${escapeHtml(r.name)}</strong></td>
                                        <td>${escapeHtml(r.className)}</td>
                                        <td>${r.sessionName}</td>
                                        <td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td>
                                        <td>${r.date}</td>
                                        <td>${r.time}</td>
                                        <td>${r.confidence || 100}%</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="7">No records</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    ${renderPagination(filtered.length)}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('strangerList').innerHTML = todayStrangers.length ? todayStrangers.map(a => `
                <div class="danger-banner">
                    <div>${a.imageData ? `<img src="${a.imageData}" class="stranger-image" onclick="viewStranger('${a.imageData}')">` : '📷'}</div>
                    <div><strong>⚠️ Stranger Detected!</strong><br>Class: ${a.className} | Time: ${a.time}</div>
                    <button class="btn-small btn-primary" onclick="downloadImage('${a.imageData}',${a.id})">💾 Save Image</button>
                </div>
            `).join('') : '<p>✅ No stranger alerts today</p>';
            
            document.getElementById('recordClassFilter').onchange = (e) => { selectedClass = e.target.value; saveLocal(); currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('searchBtn').onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('filterBtn').onclick = () => { startDate = document.getElementById('startDateInput').value; endDate = document.getElementById('endDateInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('resetBtn').onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('pdfBtn').onclick = exportToPDF;
            document.getElementById('excelBtn').onclick = exportToCSV;
        }
        
        window.viewStranger = (img) => { Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#6366f1', borderRadius: '24px' }); };
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera();
            stopQRScanner();
            stopRegisterCamera();
            
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'qrcode') renderQRPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
        }
        
        // ==================== LOGIN & INIT ====================
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = { username: user.username, role: user.role, name: user.name };
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                document.getElementById('userName').innerText = currentUser.name;
                loadLocal();
                loadFromFirebase().then(() => {
                    buildFaceMatcher();
                    renderDashboard();
                    lucide.createIcons();
                    loadFaceModels();
                });
            } else {
                showError('Login Failed', 'Invalid username or password');
            }
        }
        
        function logout() {
            localStorage.removeItem('loggedInUser');
            currentUser = null;
            location.reload();
        }
        
        // Dark Mode
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.body.classList.add('dark');
        document.getElementById('darkModeToggle').onclick = () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', document.body.classList.contains('dark'));
            lucide.createIcons();
        };
        
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
        window.navigateTo = navigateTo;
        
        setInterval(() => {
            if (document.getElementById('currentTime')) {
                document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB');
            }
        }, 1000);
        
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('userName').innerText = currentUser.name;
            loadLocal();
            loadFromFirebase().then(() => {
                buildFaceMatcher();
                renderDashboard();
                lucide.createIcons();
                loadFaceModels();
            });
        }
        
        setTimeout(() => {
            if (!currentUser) {
                showInfo('⚡ Fast Face Detection Mode', '✨ Optimized Features:\n✓ Detection: 10x per second (100ms)\n✓ Auto flash in low light\n✓ Voice greeting on attendance\n✓ Export PDF/Excel\n✓ Stranger image capture\n\nLogin: admin / admin123');
            }
        }, 1000);
    </script>
</body>
</html>
