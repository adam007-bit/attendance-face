<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartClass Pro - Beautiful Tables</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
        }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--text-primary); }
        
        /* Header */
        .header { background: var(--card-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 99; box-shadow: var(--shadow-sm); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; }
        .header-left h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-left p { font-size: 0.7rem; color: var(--text-secondary); }
        .live-clock { background: var(--bg); padding: 8px 16px; border-radius: 40px; font-family: monospace; font-weight: 600; font-size: 0.85rem; color: var(--primary); }
        
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 60px; display: flex; justify-content: space-around; padding: 8px 16px; z-index: 100; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 0.7rem; font-weight: 500; }
        .nav-item i { width: 22px; height: 22px; }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .main-content { padding: 20px 16px 100px; max-width: 600px; margin: 0 auto; }
        
        /* Hero Stats */
        .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .hero-card { background: var(--card-bg); border-radius: 20px; padding: 16px 12px; text-align: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.2s; }
        .hero-card:hover { transform: translateY(-2px); }
        .hero-card .icon { width: 40px; height: 40px; margin: 0 auto 8px; background: rgba(99,102,241,0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        .hero-card .value { font-size: 24px; font-weight: 700; }
        .hero-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border-radius: 24px; padding: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.2s; cursor: pointer; }
        .stat-card:active { transform: scale(0.98); }
        .stat-info h4 { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; }
        .stat-number { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-icon { width: 48px; height: 48px; background: rgba(99,102,241,0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        
        /* Chart Cards */
        .chart-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .chart-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        canvas { max-height: 200px; width: 100% !important; }
        
        /* ==================== BEAUTIFUL TABLES ==================== */
        .data-table { background: var(--card-bg); border-radius: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--card-bg); }
        .table-header h3 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .table-header h3 i { color: var(--primary); width: 18px; height: 18px; }
        .table-badge { background: rgba(99,102,241,0.1); color: var(--primary); padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 500; }
        .table-container { overflow-x: auto; }
        .modern-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .modern-table th { text-align: left; padding: 14px 16px; background: #f8fafc; color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        .modern-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
        .modern-table tr:last-child td { border-bottom: none; }
        .modern-table tr:hover td { background: rgba(99,102,241,0.03); }
        
        /* Status Badges */
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
        .status-hadir { background: rgba(16,185,129,0.12); color: #10b981; }
        .status-lewat { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .status-teacher { background: rgba(99,102,241,0.12); color: #6366f1; }
        .status-student { background: rgba(139,92,246,0.12); color: #8b5cf6; }
        .status-default { background: rgba(100,116,139,0.1); color: #64748b; }
        
        /* User Avatar */
        .user-avatar { width: 36px; height: 36px; border-radius: 36px; object-fit: cover; background: var(--bg); border: 2px solid var(--primary); }
        .user-cell { display: flex; align-items: center; gap: 12px; }
        .user-name { font-weight: 600; color: var(--text-primary); }
        .user-role { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
        
        /* Action Buttons */
        .action-btns { display: flex; gap: 6px; }
        .action-btn { padding: 6px; border-radius: 30px; background: none; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: var(--bg); }
        .action-edit { color: var(--primary); }
        .action-delete { color: var(--danger); }
        .action-download { color: var(--primary); }
        
        /* Stranger Alert Cards */
        .alert-card { background: linear-gradient(135deg, #fff5f5 0%, #fff 100%); border-left: 4px solid var(--danger); padding: 14px 16px; margin-bottom: 12px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; transition: transform 0.2s; }
        .alert-card:hover { transform: translateX(4px); }
        .alert-info { display: flex; align-items: center; gap: 12px; }
        .alert-icon { width: 40px; height: 40px; background: rgba(239,68,68,0.1); border-radius: 40px; display: flex; align-items: center; justify-content: center; color: var(--danger); }
        .alert-details { display: flex; flex-direction: column; }
        .alert-title { font-weight: 600; font-size: 0.85rem; }
        .alert-time { font-size: 0.7rem; color: var(--text-secondary); }
        
        /* Class Selector */
        .class-selector { margin-bottom: 16px; }
        .class-selector select { width: 100%; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.85rem; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all 0.2s; }
        .class-selector select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        
        /* Search & Filter */
        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.85rem; transition: all 0.2s; }
        .search-bar input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .date-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .date-filter input { flex: 1; padding: 10px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.8rem; }
        .btn-small { padding: 8px 16px; font-size: 0.75rem; width: auto; border-radius: 30px; background: var(--primary); color: white; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-small:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--text-secondary); }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; padding: 0 16px 16px 16px; }
        .page-btn { padding: 6px 12px; border-radius: 30px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .page-btn:hover { background: var(--bg); }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Select All & Bulk Delete */
        .select-all { padding: 12px 16px; background: #f8fafc; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
        .user-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        .bulk-delete-bar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--danger); color: white; padding: 12px 24px; border-radius: 60px; display: flex; gap: 16px; z-index: 200; box-shadow: var(--shadow-lg); }
        
        /* Info Box */
        .info-box { background: rgba(99,102,241,0.06); border-radius: 20px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 0.8rem; border: 1px solid rgba(99,102,241,0.1); }
        
        /* Camera Section */
        .camera-section { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .camera-container { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 4/3; }
        #securityVideo, #registerVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; }
        .detection-indicator { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 20px; font-size: 10px; color: white; z-index: 10; }
        .camera-status { text-align: center; margin-top: 12px; font-size: 12px; padding: 8px; border-radius: 12px; }
        .status-active { background: rgba(16,185,129,0.15); color: #10b981; }
        .camera-selector { margin-bottom: 12px; }
        .camera-selector select { width: 100%; padding: 10px 16px; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); }
        
        /* Step Indicator */
        .step-indicator { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .step-number { width: 36px; height: 36px; border-radius: 36px; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .step.active .step-number { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; }
        .step.completed .step-number { background: var(--success); color: white; }
        
        .register-form input, .register-form select { width: 100%; padding: 14px; border-radius: 60px; border: 1px solid var(--border); margin-bottom: 12px; font-size: 0.9rem; background: var(--card-bg); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; padding: 14px 20px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer; width: 100%; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.98); }
        
        .face-preview { width: 36px; height: 36px; border-radius: 36px; object-fit: cover; cursor: pointer; border: 2px solid var(--primary); }
        
        /* Voice Indicator */
        .voice-indicator { position: fixed; bottom: 100px; right: 20px; background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 10px; z-index: 200; box-shadow: var(--shadow-lg); font-size: 12px; font-weight: 500; }
        
        /* Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card-bg); border-radius: 56px; padding: 40px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border); }
        .login-card input { width: 100%; padding: 16px 20px; margin: 12px 0; border-radius: 60px; border: 1px solid var(--border); background: var(--card-bg); font-size: 1rem; }
        
        /* Remove default number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo" style="margin: 0 auto 20px; width: 70px; height: 70px;"><i data-lucide="brain" style="width: 36px; height: 36px;"></i></div>
            <h2>SmartClass Pro</h2>
            <p style="margin-bottom: 24px;">Beautiful Tables • Firebase Cloud</p>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Password">
                <button type="button" class="btn-primary" id="loginBtn">Login</button>
            </form>
            <p style="margin-top: 15px; font-size: 12px;">Demo: admin / admin123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left"><div class="logo"><i data-lucide="brain"></i></div><div><h1>SmartClass Pro</h1><p>Beautiful Tables • Cloud Sync</p></div></div>
        <div class="live-clock"><span id="currentTime">--:--:--</span></div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>

    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Home</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="camera"></i><span>Camera</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Register</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Records</span></div>
        <div class="nav-item" data-page="users"><i data-lucide="users"></i><span>Users</span></div>
    </div>

    <div id="voiceIndicator" class="voice-indicator" style="display: none;"><i data-lucide="volume-2"></i><span id="voiceText">Speaking...</span></div>
    <div id="bulkDeleteBar" class="bulk-delete-bar" style="display: none;"><span id="selectedCount">0 selected</span><button class="btn-small" id="confirmBulkDelete">Delete Selected</button><button class="btn-small" id="cancelBulkDelete">Cancel</button></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Voice Functions
        function speakText(text) { if (!text) return; const u = new SpeechSynthesisUtterance(text); u.lang = 'ms-MY'; u.rate = 0.9; u.pitch = 1.1; const ind = document.getElementById('voiceIndicator'), span = document.getElementById('voiceText'); if (ind && span) { span.innerText = text.length > 30 ? text.substring(0,30)+'...' : text; ind.style.display = 'flex'; setTimeout(() => { if(ind) ind.style.display = 'none'; }, 2000); } window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
        function speakAttendance(name, status) { speakText(`${name} is ${status === 'Hadir' ? 'present' : 'late'}`); }
        function speakStrangerAlert() { speakText(`Warning! Stranger detected in classroom.`); }
        function speakRegistrationSuccess(name) { speakText(`${name} registration successful.`); }
        function speakWelcome(name) { speakText(`Welcome ${name} to SmartClass Pro.`); }
        
        // Data Variables
        let currentUser = null;
        const validUsers = [{ username: "admin", password: "admin123", role: "admin", name: "Admin" }];
        let registeredUsers = [], attendanceRecords = [], strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A","5B","5C","4A","4B","4C","3A","3B","2A","2B","1A","1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null, weeklyChart = null, classChart = null;
        let registerStep = 1, pendingRegistration = null;
        let currentPageNum = 1, itemsPerPage = 8, searchQuery = "", startDate = "", endDate = "";
        let selectedUsers = new Set();
        let isSyncing = false;
        
        // Camera
        let securityStream = null, registerStream = null, securityInterval = null, isSecurityActive = false, currentCameraId = 'user';
        let modelsLoaded = false, faceMatcher = null;
        let audioCtx = null, lastStrangerAlertTime = 0, lastAttendanceTime = {};
        let registerFaceDetected = false, registerDescriptor = null, registerInterval = null;
        let captureTimer = null, countdown = 3, isCountingDown = false, capturedFaceImage = null;
        const DETECTION_INTERVAL = 200, INPUT_SIZE = 320;
        
        // Load/Save Functions
        function loadLocalData() {
            const u = localStorage.getItem('smart_users'); if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('smart_attendance'); if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('smart_strangers'); if (s) strangerAlerts = JSON.parse(s);
            const c = localStorage.getItem('smart_class'); if (c) selectedClass = c;
            const d = localStorage.getItem('smart_descriptors');
            if (d) { const desc = JSON.parse(d); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
        }
        function saveLocalData() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className, faceImage: u.faceImage, registeredAt: u.registeredAt }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {}; registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
            localStorage.setItem('smart_class', selectedClass);
            syncToFirebase();
        }
        async function syncToFirebase() {
            if (isSyncing) return; isSyncing = true;
            try {
                for (const u of registeredUsers) { const data = { ...u }; delete data.descriptor; await db.collection('users').doc(u.id).set(data, { merge: true }); }
                for (const a of attendanceRecords) { await db.collection('attendance').doc(`${a.id}_${a.date}_${a.session}`).set(a, { merge: true }); }
                for (const s of strangerAlerts) { await db.collection('strangers').doc(s.id.toString()).set(s, { merge: true }); }
            } catch(e) { console.error(e); } finally { isSyncing = false; }
        }
        async function loadFromFirebase() {
            try {
                const u = await db.collection('users').get(); u.forEach(d => { const existing = registeredUsers.find(x => x.id === d.id); if (!existing) registeredUsers.push(d.data()); });
                const a = await db.collection('attendance').get(); a.forEach(d => { const att = d.data(); const existing = attendanceRecords.find(x => x.id === att.id && x.date === att.date && x.session === att.session); if (!existing) attendanceRecords.push(att); });
                const s = await db.collection('strangers').get(); s.forEach(d => { const alert = d.data(); const existing = strangerAlerts.find(x => x.id === alert.id); if (!existing) strangerAlerts.push(alert); });
                const savedDesc = localStorage.getItem('smart_descriptors');
                if (savedDesc) { const desc = JSON.parse(savedDesc); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
                saveLocalData();
            } catch(e) { console.error(e); loadLocalData(); }
        }
        
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }
        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
        async function showSuccess(t, m) { await Swal.fire({ title: t, text: m, icon: 'success', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        async function showError(t, m) { await Swal.fire({ title: t, text: m, icon: 'error', confirmButtonColor: '#6366f1', borderRadius: '24px' }); }
        function playBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); setTimeout(() => o.stop(), 200); } catch(e) {} }
        function playAlertBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); for (let i=0;i<3;i++) { setTimeout(() => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15); setTimeout(() => o.stop(), 150); }, i*200); } } catch(e) {} if ('vibrate' in navigator) navigator.vibrate([200,100,200]); }
        async function captureImageFromVideo(video) { if (!video || !video.videoWidth) return null; const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video,0,0); return c.toDataURL('image/jpeg',0.8); }

        async function loadFaceModels() { const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/'; await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(url), faceapi.nets.faceLandmark68Net.loadFromUri(url), faceapi.nets.faceRecognitionNet.loadFromUri(url)]); modelsLoaded = true; buildMatcher(); }
        function buildMatcher() { const labeled = []; for (const u of registeredUsers) if (u.descriptor) labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)])); if (labeled.length) faceMatcher = new faceapi.FaceMatcher(labeled, 0.55); }
        
        async function startSecurityCamera() { if (securityStream) stopSecurityCamera(); try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentCameraId, width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE }, frameRate: { ideal: 30 } } }); securityStream = stream; const videoEl = document.getElementById('securityVideo'); if (videoEl) videoEl.srcObject = stream; isSecurityActive = true; if (!modelsLoaded) await loadFaceModels(); if (securityInterval) clearInterval(securityInterval); securityInterval = setInterval(detectFaces, DETECTION_INTERVAL); const statusEl = document.getElementById('securityStatus'); if (statusEl) { statusEl.innerHTML = '✅ Camera Active'; statusEl.className = 'camera-status status-active'; } } catch(e) { console.error(e); showError('Camera Error', 'Please allow camera access'); } }
        function stopSecurityCamera() { if (securityStream) { securityStream.getTracks().forEach(t=>t.stop()); securityStream = null; } if (securityInterval) clearInterval(securityInterval); isSecurityActive = false; }
        
        async function detectFaces() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptors();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let recognized = [], stranger = false;
            for (const d of detections) {
                let best = null;
                if (faceMatcher) { const result = faceMatcher.findBestMatch(d.descriptor); if (result.label !== 'unknown') best = registeredUsers.find(u => u.id === result.label); }
                const box = d.detection.box;
                ctx.beginPath(); ctx.rect(box.x, box.y, box.width, box.height);
                if (best) { ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui'; ctx.fillText(best.name, box.x, box.y-5); recognized.push(best.name); await autoMarkAttendance(best); }
                else { ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#ef4444'; ctx.font = 'bold 14px system-ui'; ctx.fillText('⚠️ STRANGER', box.x, box.y-5); stranger = true; }
            }
            const detectEl = document.getElementById('detectCount'); if (detectEl) detectEl.innerHTML = detections.length ? `👤 ${detections.length} face(s)` : '👤 No face';
            const recognizedEl = document.getElementById('recognizedNames'); if (recognizedEl) recognizedEl.innerHTML = recognized.length ? `✅ Recognized: ${recognized.join(', ')}` : '✅ Waiting...';
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) { lastStrangerAlertTime = Date.now(); const img = await captureImageFromVideo(video); await reportStranger(img); }
        }
        
        async function autoMarkAttendance(user) {
            const today = getTodayDate(), session = getCurrentSession(), key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            const already = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!already) {
                lastAttendanceTime[key] = Date.now();
                const tv = new Date().getHours() * 60 + new Date().getMinutes();
                let status = "Hadir";
                if (session === 'pagi' && tv > 510) status = "Lewat";
                if (session === 'petang' && tv > 810) status = "Lewat";
                attendanceRecords.push({ id: user.id, name: user.name, role: user.role, className: user.className, status, session, sessionName: session === 'pagi' ? 'Morning' : 'Afternoon', time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto' });
                saveLocalData(); playBeep(); speakAttendance(user.name, status); updateUI();
            }
        }

            strangerAlerts.push(alert); saveLocalData(); playAlertBeep(); speakStrangerAlert();

        async function checkRegisterFace() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath(); ctx.rect(cx,cy,w,h);
            if (detection) {
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui'; ctx.fillText('✓ Face Detected!', cx, cy-5);
                if (!registerFaceDetected) { registerFaceDetected = true; registerDescriptor = Array.from(detection.descriptor); capturedFaceImage = await captureImageFromVideo(video); startCountdown(); }
            } else {
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 14px system-ui'; ctx.fillText('Place your face here', cx, cy-5);
                registerFaceDetected = false; if (captureTimer) clearTimeout(captureTimer); isCountingDown = false; const statusEl = document.getElementById('regCameraStatus'); if (statusEl) statusEl.innerHTML = '● Position your face';
            }

            const classOther = document.getElementById('regClassOther');
            if (classSelect) classSelect.onchange = () => { if (classOther) classOther.style.display = classSelect.value === 'Lain-lain' ? 'block' : 'none'; };
            const continueBtn = document.getElementById('continueBtn');
            if (continueBtn) continueBtn.onclick = async () => { let className = document.getElementById('regClass').value; if (className === 'Lain-lain') className = document.getElementById('regClassOther').value.trim(); if (!className) { await showError('Error', 'Please select class'); return; } await saveNameAndClass(); };
        }
        
        function renderUsersPage() {
            const html = `
                <div class="data-table">
                    <div class="table-header"><h3><i data-lucide="users"></i> All Users</h3><div><span class="table-badge">${registeredUsers.length} total</span><button class="btn-small" id="exportCsvBtn" style="margin-left: 10px;">📊 Export CSV</button></div></div>
                    <div class="select-all"><input type="checkbox" id="selectAllCheckbox" ${selectedUsers.size === registeredUsers.length && registeredUsers.length > 0 ? 'checked' : ''}><label for="selectAllCheckbox">Select All Users</label></div>
                    <div class="table-container"><table class="modern-table"><thead><tr><th style="width:40px;"></th><th>Photo</th><th>Name</th><th>Role</th><th>Class</th><th>Registered Date</th><th>Action</th></tr></thead><tbody>${registeredUsers.map(u => `<tr><td><input type="checkbox" class="user-checkbox" data-id="${u.id}" ${selectedUsers.has(u.id) ? 'checked' : ''}></td><td>${u.faceImage ? `<img src="${u.faceImage}" class="face-preview" onclick="viewFaceImage('${u.faceImage}')">` : '<div class="face-preview" style="background:#ddd;"></div>'}</td><td><div class="user-name">${escapeHtml(u.name)}</div></td><td><span class="status-badge ${u.role === 'teacher' ? 'status-teacher' : 'status-student'}">${u.role === 'teacher' ? 'Teacher' : 'Student'}</span></td><td><span class="status-badge status-default">${escapeHtml(u.className)}</span></td><td>${new Date(u.registeredAt).toLocaleDateString() || '-'}</td><td class="action-btns"><button class="action-btn action-edit" onclick="editUserById('${u.id}')"><i data-lucide="edit-2"></i></button><button class="action-btn action-delete" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join('') || '<tr><td colspan="7" style="text-align: center; padding: 40px;">No users registered</td></tr>'}</tbody></table></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.addEventListener('change', (e) => toggleSelectUser(cb.dataset.id)));
            const selectAll = document.getElementById('selectAllCheckbox');
            if (selectAll) selectAll.addEventListener('change', () => selectAllUsers());
            const exportBtn = document.getElementById('exportCsvBtn');
            if (exportBtn) exportBtn.onclick = exportToCSV;
            const confirmBtn = document.getElementById('confirmBulkDelete'), cancelBtn = document.getElementById('cancelBulkDelete');
            if (confirmBtn) confirmBtn.onclick = deleteSelectedUsers;
            if (cancelBtn) cancelBtn.onclick = cancelBulkDelete;
        }
        
        function renderRegisterStep2() {
            const html = `
                <div class="step-indicator"><div class="step completed"><div class="step-number">✓</div><div class="step-label">Info</div></div><div class="step active"><div class="step-number">2</div><div class="step-label">Capture</div></div></div>
                <div class="info-box"><i data-lucide="camera"></i><div><strong>Auto Capture in 3 seconds</strong><br>Position your face in the green box</div></div>
                <div class="camera-container"><video id="registerVideo" autoplay playsinline></video><canvas id="registerCanvas" class="face-canvas"></canvas></div>
                <div class="camera-status" id="regCameraStatus">● Position your face</div>
                <div style="background: var(--card-bg); border-radius: 24px; padding: 20px; margin-top: 20px;"><div style="background:rgba(16,185,129,0.1);padding:16px;border-radius:20px;margin-bottom:16px;"><strong>📝 ${escapeHtml(pendingRegistration.name)}</strong><br>${pendingRegistration.role === 'teacher' ? 'Teacher' : 'Student'} | Class ${pendingRegistration.className}</div><button class="btn-primary" id="backBtn" style="background: #64748b;">← Back</button></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startRegisterCamera();
            const backBtn = document.getElementById('backBtn');
            if (backBtn) backBtn.onclick = backToStep1;
        }
        
        function renderRecordsPage() {
            let filtered = getFilteredAttendance();
            const paginated = getPaginatedData(filtered);
            const totalItems = filtered.length;
            const todayStrangers = strangerAlerts.filter(a => a.date === getTodayDate() && (selectedClass === "Semua Kelas" || a.className === selectedClass));
            
            const html = `
                <div class="class-selector"><select id="recordClassFilter"><option value="Semua Kelas" ${selectedClass === "Semua Kelas" ? 'selected' : ''}>📚 All Classes</option>${availableClasses.map(c => `<option value="${c}" ${selectedClass === c ? 'selected' : ''}>📖 Class ${c}</option>`).join('')}</select></div>
                <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search by name..." value="${escapeHtml(searchQuery)}"><button class="btn-small" id="searchBtn">Search</button></div>
                <div class="date-filter"><input type="date" id="startDateInput" value="${startDate}"><input type="date" id="endDateInput" value="${endDate}"><button class="btn-small" id="filterBtn">Filter</button><button class="btn-small" id="resetBtn">Reset</button></div>
                <div class="data-table">
                    <div class="table-header"><h3><i data-lucide="alert-triangle"></i> Stranger Alerts</h3><span class="table-badge">${todayStrangers.length} alerts</span><button class="btn-small" id="exportBtn" style="background: var(--primary);">📊 Export CSV</button></div>
                    <div id="strangerList" style="padding: 0 16px 16px 16px;"></div>
                </div>
                <div class="data-table">
                    <div class="table-header"><h3><i data-lucide="clipboard-list"></i> Attendance Records</h3><span class="table-badge">${totalItems} records</span></div>
                    <div class="table-container"><table class="modern-table"><thead><tr><th>Name</th><th>Class</th><th>Session</th><th>Status</th><th>Date</th><th>Time</th></tr></thead><tbody>${paginated.map(r => `<tr><td><div class="user-name">${escapeHtml(r.name)}</div></td><td><span class="status-badge status-default">${escapeHtml(r.className)}</span></td><td>${r.sessionName}</td><td><span class="status-badge ${r.status === 'Hadir' ? 'status-hadir' : 'status-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="6" style="text-align: center; padding: 40px;">No records found</td></tr>'}</tbody></table></div>
                    ${renderPagination(totalItems)}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const strangerContainer = document.getElementById('strangerList');
            if (strangerContainer) {
                strangerContainer.innerHTML = todayStrangers.length ? todayStrangers.map(a => `
                    <div class="alert-card">
                        <div class="alert-info">
                            <div class="alert-icon"><i data-lucide="alert-triangle" style="width: 20px; height: 20px;"></i></div>
                            <div class="alert-details">
                                <span class="alert-title">⚠️ Stranger Detected!</span>
                                <span class="alert-time">Class: ${a.className} | Time: ${a.time}</span>
                            </div>
                        </div>
                        <button class="action-btn action-download" onclick="downloadImage('${a.imageData}',${a.id})"><i data-lucide="download" style="width: 18px; height: 18px;"></i></button>
                    </div>
                `).join('') : '<p style="text-align: center; padding: 40px;">✅ No stranger alerts today</p>';
                lucide.createIcons();
            }
            
            const recordFilter = document.getElementById('recordClassFilter'); if (recordFilter) recordFilter.onchange = (e) => { selectedClass = e.target.value; saveLocalData(); currentPageNum = 1; renderRecordsPage(); };
            const searchBtn = document.getElementById('searchBtn'); if (searchBtn) searchBtn.onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            const filterBtn = document.getElementById('filterBtn'); if (filterBtn) filterBtn.onclick = () => { startDate = document.getElementById('startDateInput').value; endDate = document.getElementById('endDateInput').value; currentPageNum = 1; renderRecordsPage(); };
            const resetBtn = document.getElementById('resetBtn'); if (resetBtn) resetBtn.onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            const exportBtn = document.getElementById('exportBtn'); if (exportBtn) exportBtn.onclick = exportToCSV;
        }
        
        window.editUserById = (id) => { const u = getUserById(id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = getUserById(id); if (u) deleteSingleUser(u); };
        window.viewFaceImage = (img) => { Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#6366f1', borderRadius: '24px' }); };
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera(); stopRegisterCamera();
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
            else if (page === 'users') renderUsersPage();
        }
        
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); speakWelcome(currentUser.name); });
            } else { showError('Login Failed', 'Invalid username or password'); }
        }
        
        function logout() { localStorage.removeItem('loggedInUser'); location.reload(); }
        
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
        window.navigateTo = navigateTo;
        setInterval(() => { const timeEl = document.getElementById('currentTime'); if (timeEl) timeEl.innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
        
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); speakWelcome(currentUser.name); });
        }
    </script>
</body>
</html>
