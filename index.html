<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Class - Advanced Face Recognition System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #007AFF;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }
        body.dark {
            --bg: #1C1C1E;
            --card-bg: #2C2C2E;
            --text-primary: #FFFFFF;
            --text-secondary: #98989E;
            --border: #3A3A3C;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text-primary); transition: background 0.3s; }
        
        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 48px;
            padding: 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-card input {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 16px;
        }
        .login-card img {
            width: 70px;
            margin-bottom: 20px;
        }
        
        .header { background: var(--card-bg); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 99; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left img { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); }
        .header-left h1 { font-size: 18px; margin: 0; }
        .header-left p { font-size: 10px; color: var(--text-secondary); }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 30px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
        .live-clock { background: var(--bg); padding: 6px 12px; border-radius: 25px; font-size: 13px; font-weight: 600; font-family: monospace; }
        .user-info { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 5px 12px; border-radius: 30px; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 5px 12px; border-radius: 30px; cursor: pointer; font-size: 12px; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 12px 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 30px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 11px; font-weight: 500; flex: 1; text-align: center; }
        .nav-item i { width: 24px; height: 24px; }
        .nav-item.active { background: var(--primary); color: white; }
        .main-content { padding: 16px 16px 80px; max-width: 600px; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); border-radius: 20px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-info h3 { font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-number { font-size: 24px; font-weight: 700; }
        .stat-icon { width: 40px; height: 40px; border-radius: 25px; display: flex; align-items: center; justify-content: center; background: rgba(0,122,255,0.1); color: var(--primary); }
        
        .camera-section { background: var(--card-bg); border-radius: 24px; padding: 16px; margin-bottom: 20px; }
        .camera-container { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 4/3; }
        #securityVideo, #registerVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .qr-container { background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 1; max-width: 300px; margin: 0 auto; }
        #qr-reader { width: 100%; height: 100%; }
        .camera-status { text-align: center; margin-top: 12px; font-size: 12px; padding: 8px; border-radius: 12px; }
        .status-active { background: #E8F5E9; color: #2E7D32; }
        .status-warning { background: #FFF3E0; color: #E65100; }
        .status-error { background: #FFEBEE; color: #C62828; }
        .status-info { background: #E3F2FD; color: #1565C0; }
        .status-blink { background: #E8F5E9; animation: blink-bg 0.3s ease; }
        @keyframes blink-bg { 0% { background: #E8F5E9; } 50% { background: #34C759; color: white; } 100% { background: #E8F5E9; } }
        
        .data-table { background: var(--card-bg); border-radius: 24px; padding: 16px; margin-bottom: 16px; }
        .data-table h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #F3E5F5; color: #6A1B9A; }
        .badge-student { background: #E8F5E9; color: #2E7D32; }
        
        .register-form input, .register-form select { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 12px; font-size: 15px; background: var(--card-bg); color: var(--text-primary); }
        .btn { padding: 14px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-secondary { background: #8E8E93; color: white; }
        .btn:active { transform: scale(0.97); }
        
        .charts-row { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
        .chart-card { background: var(--card-bg); border-radius: 24px; padding: 16px; }
        canvas { max-height: 200px; }
        
        .detected-face { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; z-index: 10; }
        .class-selector { margin-bottom: 16px; }
        .class-selector select { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--border); font-size: 14px; background: var(--card-bg); color: var(--text-primary); }
        .stranger-image { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
        .btn-small { padding: 6px 12px; font-size: 11px; width: auto; margin-left: 8px; }
        .danger-banner { background: #FFEBEE; border-left: 4px solid var(--danger); animation: pulse 1s infinite; padding: 12px; border-radius: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        
        .step-indicator { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .step-number { width: 40px; height: 40px; border-radius: 40px; background: #E5E5EA; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #8E8E93; }
        .step.active .step-number { background: var(--primary); color: white; }
        .step.completed .step-number { background: var(--success); color: white; }
        .step-label { font-size: 11px; color: var(--text-secondary); }
        .info-box { background: #E3F2FD; border-radius: 14px; padding: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
        
        .action-buttons { display: flex; gap: 8px; }
        .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
        .edit-btn { color: var(--primary); }
        .delete-btn { color: var(--danger); }
        
        .camera-selector { margin-bottom: 12px; }
        .camera-selector select { width: 100%; padding: 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); }
        .light-indicator { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 20px; font-size: 10px; color: white; z-index: 15; }
        .torch-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; border-radius: 30px; padding: 8px; cursor: pointer; z-index: 15; color: white; display: flex; align-items: center; gap: 5px; font-size: 10px; }
        .flash-on { background: var(--warning); color: black; }
        
        .search-bar { margin-bottom: 16px; display: flex; gap: 8px; }
        .search-bar input { flex: 1; padding: 12px; border-radius: 30px; border: 1px solid var(--border); background: var(--card-bg); }
        .date-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .date-filter input { flex: 1; padding: 10px; border-radius: 30px; border: 1px solid var(--border); background: var(--card-bg); }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .page-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .liveness-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 20px; font-size: 10px; color: white; z-index: 15; }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <h2>Smart Class Security</h2>
            <p style="margin-bottom: 20px; color: var(--text-secondary);">Log masuk untuk mengakses sistem</p>
            <input type="text" id="loginUsername" placeholder="Nama Pengguna" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="Kata Laluan">
            <button class="btn btn-primary" id="loginBtn">Log Masuk</button>
            <p style="margin-top: 15px; font-size: 12px; color: var(--text-secondary);">Demo: admin / admin123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div><h1>Smart Class Security</h1><p>AI Face Recognition | Auto Flash | Blink Register</p></div>
        </div>
        <div class="header-right">
            <div class="user-info" id="userInfo"><i data-lucide="user"></i> <span id="userName">Admin</span></div>
            <button class="icon-btn" id="darkModeToggle"><i data-lucide="moon"></i></button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
            <div class="live-clock"><span id="currentTime">--:--:--</span></div>
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>

    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="shield-check"></i><span>AI Security</span></div>
        <div class="nav-item" data-page="qrcode"><i data-lucide="qr-code"></i><span>QR Scan</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Daftar Muka</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Rekod</span></div>
    </div>

    <script>
        // ==================== LOGIN SYSTEM ====================
        let currentUser = null;
        const validUsers = [
            { username: "admin", password: "admin123", role: "admin", name: "Admin" },
            { username: "guru", password: "guru123", role: "teacher", name: "Cikgu Ahmad" }
        ];
        
        function checkLogin() {
            const saved = localStorage.getItem('loggedInUser');
            if (saved) {
                const user = JSON.parse(saved);
                if (validUsers.find(u => u.username === user.username)) {
                    currentUser = user;
                    showMainApp();
                }
            }
        }
        
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = { username: user.username, role: user.role, name: user.name };
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                showMainApp();
            } else {
                Swal.fire({ title: 'Gagal!', text: 'Username atau password salah', icon: 'error', confirmButtonColor: '#007AFF' });
            }
        }
        
        function logout() {
            localStorage.removeItem('loggedInUser');
            currentUser = null;
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
        }
        
        function showMainApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('userName').innerText = currentUser.name;
            loadData();
            initApp();
        }
        
        // ==================== TELEGRAM BOT SETUP ====================
        const TELEGRAM_BOT_TOKEN = ""; // Isi dengan token bot Telegram
        const TELEGRAM_CHAT_ID = ""; // Isi dengan chat ID
        
        async function sendTelegramAlert(message, imageData = null) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) {
                console.log("Telegram not configured");
                return;
            }
            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message })
                });
                if (imageData) {
                    const blob = await (await fetch(imageData)).blob();
                    const formData = new FormData();
                    formData.append('chat_id', TELEGRAM_CHAT_ID);
                    formData.append('photo', blob, 'stranger.jpg');
                    formData.append('caption', message);
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                }
            } catch(e) { console.error("Telegram error:", e); }
        }
        
        // ==================== DATA STORAGE ====================
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let registerStep = 1;
        let pendingRegistration = null;
        
        // Pagination variables
        let currentPageNum = 1;
        let itemsPerPage = 10;
        let searchQuery = "";
        let startDate = "";
        let endDate = "";
        
        // Camera variables
        let securityStream = null;
        let registerStream = null;
        let securityInterval = null;
        let isSecurityActive = false;
        let currentCameraId = 'user';
        let torchEnabled = false;
        let videoTrack = null;
        let autoFlashTriggered = false;
        let lastLightLevel = 100;
        
        // Blink detection variables
        let blinkCount = 0;
        let expectedBlinks = 2;
        let isBlinking = false;
        let captureTriggered = false;
        
        // Liveness detection
        let lastBlinkTime = 0;
        let livenessVerified = false;
        
        // Face recognition
        let modelsLoaded = false;
        let faceMatcher = null;
        let html5QrCode = null;
        let isScanning = false;
        
        let audioCtx = null;
        let lastStrangerAlertTime = 0;
        let lastAttendanceTime = {};
        
        const DETECTION_INTERVAL = 200;
        const INPUT_SIZE = 320;
        
        // ==================== FIREBASE & LOCAL STORAGE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        async function syncToFirebase() {
            try {
                for (const u of registeredUsers) { const data = { ...u }; delete data.descriptor; await db.collection('users').doc(u.id).set(data, { merge: true }); }
                for (const a of attendanceRecords) await db.collection('attendance').doc(`${a.id}_${a.date}_${a.session}`).set(a, { merge: true });
                for (const s of strangerAlerts) await db.collection('strangers').doc(s.id.toString()).set(s, { merge: true });
            } catch(e) { console.error(e); }
        }
        
        async function loadFromFirebase() {
            try {
                const u = await db.collection('users').get(); u.forEach(d => { if (!registeredUsers.find(x => x.id === d.id)) registeredUsers.push(d.data()); });
                const a = await db.collection('attendance').get(); a.forEach(d => { if (!attendanceRecords.find(x => x.id === d.data().id && x.date === d.data().date)) attendanceRecords.push(d.data()); });
                const s = await db.collection('strangers').get(); s.forEach(d => { if (!strangerAlerts.find(x => x.id === d.data().id)) strangerAlerts.push(d.data()); });
                saveLocal();
                updateUI();
            } catch(e) { console.error(e); }
        }
        
        function saveLocal() {
            localStorage.setItem('users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className, registeredAt: u.registeredAt }))));
            localStorage.setItem('attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('strangers', JSON.stringify(strangerAlerts));
            const desc = {}; registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('descriptors', JSON.stringify(desc));
            localStorage.setItem('selected_class', selectedClass);
        }
        
        function loadLocal() {
            const u = localStorage.getItem('users'); if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('attendance'); if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('strangers'); if (s) strangerAlerts = JSON.parse(s);
            const c = localStorage.getItem('selected_class'); if (c) selectedClass = c;
            const d = localStorage.getItem('descriptors');
            if (d) { const desc = JSON.parse(d); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
        }
        
        // Helper functions
        function playBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3); setTimeout(() => o.stop(), 300); } catch(e) {} }
        function playAlertBeep() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < 3; i++) { setTimeout(() => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.4; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); setTimeout(() => o.stop(), 200); }, i * 200); } } catch(e) {} if ('vibrate' in navigator) navigator.vibrate([200, 150, 200]); }
        
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }
        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
        
        async function showSuccess(t, m) { await Swal.fire({ title: t, text: m, icon: 'success', confirmButtonColor: '#007AFF' }); }
        async function showError(t, m) { await Swal.fire({ title: t, text: m, icon: 'error', confirmButtonColor: '#007AFF' }); }
        async function showWarning(t, m) { await Swal.fire({ title: t, text: m, icon: 'warning', confirmButtonColor: '#FF9500' }); }
        async function showInfo(t, m) { await Swal.fire({ title: t, text: m, icon: 'info', confirmButtonColor: '#007AFF' }); }
        
        async function captureImage(video) { if (!video || !video.videoWidth) return null; const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0); return c.toDataURL('image/jpeg', 0.8); }
        function updateUI() { if (currentPage === 'dashboard') renderDashboard(); if (currentPage === 'records') renderRecordsPage(); if (currentPage === 'register') renderUsersTable(); }
        
        // ==================== FACE RECOGNITION ====================
        async function loadFaceModels() {
            const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(url), faceapi.nets.faceLandmark68Net.loadFromUri(url), faceapi.nets.faceRecognitionNet.loadFromUri(url)]);
            modelsLoaded = true;
            buildMatcher();
        }
        
        function buildMatcher() {
            const labeled = [];
            for (const u of registeredUsers) if (u.descriptor) labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
            if (labeled.length) faceMatcher = new faceapi.FaceMatcher(labeled, 0.55);
        }
        
        // ==================== LIGHT & FLASH ====================
        function detectLightLevel(video) {
            if (!video || !video.videoWidth) return 100;
            const canvas = document.createElement('canvas');
            canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let total = 0;
            for (let i = 0; i < data.length; i += 4) total += (data[i] + data[i+1] + data[i+2]) / 3;
            return total / 2500;
        }
        
        function updateLightIndicator(level) {
            const ind = document.getElementById('lightIndicator');
            if (ind) {
                let text = '', color = '';
                if (level < 50) { text = '🌙 Gelap - Flash ON'; color = '#FF9500'; }
                else if (level < 100) { text = '☀️ Sederhana'; color = '#FFD700'; }
                else { text = '☀️☀️ Terang'; color = '#34C759'; }
                ind.innerHTML = text;
                ind.style.backgroundColor = color;
            }
            return level < 60;
        }
        
        async function enableTorch() { if (videoTrack) { try { await videoTrack.applyConstraints({ advanced: [{ torch: true }] }); torchEnabled = true; updateTorchButton(true); } catch(e) {} } }
        async function disableTorch() { if (videoTrack) { try { await videoTrack.applyConstraints({ advanced: [{ torch: false }] }); torchEnabled = false; updateTorchButton(false); } catch(e) {} } }
        function toggleTorch() { torchEnabled ? disableTorch() : enableTorch(); }
        function updateTorchButton(on) { const btn = document.getElementById('torchBtn'); if (btn) { btn.innerHTML = on ? '<i data-lucide="sun"></i> Flash ON' : '<i data-lucide="sun"></i> Flash OFF'; if (on) btn.classList.add('flash-on'); else btn.classList.remove('flash-on'); lucide.createIcons(); } }
        
        // ==================== LIVENESS DETECTION ====================
        async function verifyLiveness(video) {
            // Check for blink within last 3 seconds
            const now = Date.now();
            if (now - lastBlinkTime < 3000) {
                livenessVerified = true;
                return true;
            }
            livenessVerified = false;
            return false;
        }
        
        // ==================== SECURITY CAMERA ====================
        async function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentCameraId, width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE }, frameRate: { ideal: 30 } } });
                securityStream = stream;
                videoTrack = stream.getVideoTracks()[0];
                document.getElementById('securityVideo').srcObject = stream;
                isSecurityActive = true;
                await loadFaceModels();
                if (securityInterval) clearInterval(securityInterval);
                securityInterval = setInterval(detectAndProcess, DETECTION_INTERVAL);
            } catch(e) { console.error(e); }
        }
        
        function stopSecurityCamera() { if (securityStream) { securityStream.getTracks().forEach(t => t.stop()); securityStream = null; } if (securityInterval) clearInterval(securityInterval); isSecurityActive = false; }
        
        async function detectAndProcess() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            
            const light = detectLightLevel(video);
            lastLightLevel = light;
            const isDark = light < 60;
            if (isDark && currentCameraId === 'environment' && !torchEnabled && videoTrack) { await enableTorch(); autoFlashTriggered = true; }
            else if (!isDark && autoFlashTriggered && torchEnabled) { await disableTorch(); autoFlashTriggered = false; }
            updateLightIndicator(light);
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptors();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Show liveness status
            const livenessEl = document.getElementById('livenessStatus');
            if (livenessEl) livenessEl.innerHTML = livenessVerified ? '✅ Liveness: Verified' : '👁️ Kedip mata untuk verify';
            
            let recognized = [], stranger = false;
            for (const d of detections) {
                let best = null;
                if (faceMatcher) {
                    const r = faceMatcher.findBestMatch(d.descriptor);
                    if (r.label !== 'unknown') best = registeredUsers.find(u => u.id === r.label);
                }
                const box = d.detection.box;
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.width, box.height);
                if (best && livenessVerified) {
                    ctx.strokeStyle = '#34C759';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#34C759';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText(best.name, box.x, box.y - 5);
                    recognized.push(best.name);
                    await autoMark(best);
                } else if (best && !livenessVerified) {
                    ctx.strokeStyle = '#FF9500';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#FF9500';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ Kedip mata dulu!', box.x, box.y - 5);
                } else {
                    ctx.strokeStyle = '#FF3B30';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#FF3B30';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ ASING!', box.x, box.y - 5);
                    stranger = true;
                }
            }
            document.getElementById('detectCount').innerHTML = detections.length ? `👤 ${detections.length} wajah (${Math.round(light)}% cahaya)` : '👤 Tiada wajah';
            document.getElementById('recognizedNames').innerHTML = recognized.length ? `✅ Dikenali: ${recognized.join(', ')}` : '✅ Menunggu wajah...';
            
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) {
                lastStrangerAlertTime = Date.now();
                const img = await captureImage(video);
                await reportStranger(img);
            }
        }
        
        async function autoMark(user) {
            const today = getTodayDate(), session = getCurrentSession(), key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 5000) return;
            if (!attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session)) {
                lastAttendanceTime[key] = Date.now();
                const tv = new Date().getHours() * 60 + new Date().getMinutes();
                let status = "Hadir";
                if (session === 'pagi' && tv > 510) status = "Lewat";
                if (session === 'petang' && tv > 810) status = "Lewat";
                attendanceRecords.push({ id: user.id, name: user.name, role: user.role, className: user.className, status, session, sessionName: session === 'pagi' ? 'Sesi Pagi' : 'Sesi Petang', time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto' });
                saveLocal(); syncToFirebase(); playBeep(); updateUI();
            }
        }
        
        async function reportStranger(img) {
            const alert = { id: Date.now(), className: selectedClass === "Semua Kelas" ? "Unknown" : selectedClass, time: getCurrentTime(), date: getTodayDate(), session: getCurrentSession(), imageData: img };
            strangerAlerts.push(alert);
            saveLocal(); syncToFirebase(); playAlertBeep();
            
            // Send Telegram alert
            const msg = `⚠️ AMARAN KESELAMATAN! ⚠️\nWajah asing dikesan di dalam kelas!\nKelas: ${alert.className}\nMasa: ${alert.time}\nTarikh: ${alert.date}`;
            await sendTelegramAlert(msg, img);
            
            await Swal.fire({ title: '⚠️ AMARAN! Wajah Asing', html: `<img src="${img}" style="width:150px;border-radius:12px;margin:10px 0;"><br>Kelas: ${alert.className}<br>Masa: ${alert.time}<br>🔔 Alert telah dihantar ke Telegram`, icon: 'warning', confirmButtonColor: '#FF3B30' });
            updateUI();
        }
        
        // ==================== QR SCANNER ====================
        async function startQRScanner() {
            if (isScanning) return;
            try {
                html5QrCode = new Html5Qrcode("qr-reader");
                await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, async (t) => {
                    if (t && !window.processing) {
                        window.processing = true;
                        try { const d = JSON.parse(t), u = registeredUsers.find(x => x.id === d.id); if (u) { await autoMark(u); playBeep(); } else { await showError('❌', 'QR tidak berdaftar.'); playAlertBeep(); } } catch(e) { await showError('QR Tidak Sah', ''); playAlertBeep(); }
                        setTimeout(() => { window.processing = false; }, 1500);
                    }
                });
                isScanning = true;

        function stopQRScanner() { if (html5QrCode && isScanning) { html5QrCode.stop(); isScanning = false; } }
        
        // ==================== BLINK DETECTION WITH LIVENESS ====================
        function startBlinkCamera() {
            if (registerStream) registerStream.getTracks().forEach(t => t.stop());
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE } } }).then(s => {
                registerStream = s;
                document.getElementById('registerVideo').srcObject = s;
                if (registerInterval) clearInterval(registerInterval);
                registerInterval = setInterval(detectBlink, 150);
                blinkCount = 0; captureTriggered = false;
            }).catch(e => console.error(e));
        }
        
        async function detectBlink() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath();
            ctx.rect(cx, cy, w, h);
            if (detection) {
                ctx.strokeStyle = '#34C759';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#34C759';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Wajah Dikesan! Kedip mata untuk daftar', cx, cy - 5);
                registerFaceDetected = true;
                registerDescriptor = Array.from(detection.descriptor);
                
                const left = detection.landmarks.getLeftEye();
                const right = detection.landmarks.getRightEye();
                if (left && right) {
                    const ear = (getEAR(left) + getEAR(right)) / 2;
                    const isBlinkingNow = ear < 0.2;
                    if (isBlinkingNow && !isBlinking) {
                        isBlinking = true;
                        blinkCount++;
                        lastBlinkTime = Date.now();
                        document.getElementById('regStatus').innerHTML = `👁️ Kedipan ke-${blinkCount}! ${blinkCount >= expectedBlinks ? 'Auto daftar...' : `Kedip ${expectedBlinks - blinkCount} lagi`}`;
                        document.getElementById('regStatus').className = 'camera-status status-blink';
                        playBeep();
                        if (blinkCount >= expectedBlinks && !captureTriggered) {
                            captureTriggered = true;
                            setTimeout(() => autoRegisterFace(), 1000);
                        }
                    } else if (!isBlinkingNow) { isBlinking = false; }
                }
                document.getElementById('regStatus').innerHTML = `👁️ Kedip ${expectedBlinks - blinkCount} kali lagi untuk daftar automatik`;
            } else {
                ctx.strokeStyle = '#FF9500';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FF9500';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Letakkan muka di sini', cx, cy - 5);
                registerFaceDetected = false;
                document.getElementById('regStatus').innerHTML = '● Letakkan muka dalam kotak, kemudian kedip mata untuk daftar';
            }
        }
        
        function getEAR(eye) {
            if (eye.length < 6) return 0.3;
            const v1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
            const v2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
            const h = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
            return (v1 + v2) / (2 * h);
        }
        
        let registerFaceDetected = false, registerDescriptor = null, registerInterval = null;
        
        async function autoRegisterFace() {
            if (!pendingRegistration) { await showError('Ralat', 'Sila isi nama dan kelas dahulu.'); registerStep = 1; renderRegisterPage(); return; }
            if (!registerFaceDetected || !registerDescriptor) { await showWarning('Tiada Wajah', 'Pastikan muka dalam kotak.'); captureTriggered = false; blinkCount = 0; return; }
            const canvas = document.getElementById('registerCanvas');
            for (let i = 3; i > 0; i--) { const ctx = canvas.getContext('2d'); ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#34C759'; ctx.font = 'bold 48px system-ui'; ctx.fillText(`${i}`, canvas.width/2 - 15, canvas.height/2); await new Promise(r => setTimeout(r, 300)); }
            const newUser = { id: Date.now().toString(), ...pendingRegistration, descriptor: registerDescriptor, registeredAt: new Date().toISOString(), qrData: JSON.stringify({ id: Date.now().toString(), name: pendingRegistration.name, role: pendingRegistration.role, className: pendingRegistration.className }) };
            registeredUsers.push(newUser);
            saveLocal(); syncToFirebase(); buildMatcher();
            await showSuccess('✅ Auto Pendaftaran Berjaya!', `${newUser.name} (${newUser.role === 'teacher' ? 'Guru' : 'Pelajar'})\nKelas: ${newUser.className}\n✅ Muka DIHAFAL oleh AI!\n✅ Didaftar dengan blink detection!`);
            pendingRegistration = null; registerStep = 1; blinkCount = 0; captureTriggered = false;
            if (!availableClasses.includes(newUser.className)) availableClasses.push(newUser.className);
            renderRegisterPage();
        }
        
        async function manualCaptureFace() {
            if (!registerFaceDetected || !registerDescriptor) { await showWarning('Tiada Wajah', 'Pastikan muka dalam kotak.'); return; }
            await autoRegisterFace();
        }

        // ==================== EXPORT EXCEL ====================
        function exportToCSV() {
            let csv = "Nama,Kelas,Status,Sesi,Tarikh,Masa,Kaedah\n";
            const filtered = getFilteredAttendance();
            for (const r of filtered) {
                csv += `"${r.name}","${r.className}","${r.status}","${r.sessionName}","${r.date}","${r.time}","${r.method || 'Face Auto'}"\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `attendance_${getTodayDate()}.csv`; a.click();

            showSuccess('Eksport', 'CSV telah dimuat turun.');

        function getFilteredAttendance() {

        }
        
        function renderQRPage() {
            document.getElementById('mainContent').innerHTML = `<div class="camera-section"><h3><i data-lucide="qr-code"></i> QR Code</h3><div class="qr-container" id="qr-reader"></div><div class="camera-status">● Memulakan...</div></div>`;
            lucide.createIcons();
            setTimeout(() => startQRScanner(), 100);
        }
        
        function renderRegisterPage() {
            const html = `<div class="step-indicator"><div class="step active"><div class="step-number">1</div><div class="step-label">Nama & Kelas</div></div><div class="step"><div class="step-number">2</div><div class="step-label">Kedip Mata</div></div></div>
                <div class="data-table"><input type="text" id="rn" placeholder="Nama Penuh *"><select id="rr"><option value="student">👨‍🎓 Pelajar</option><option value="teacher">👩‍🏫 Guru</option></select>
                <select id="rc"><option value="">Pilih Kelas</option>${availableClasses.map(c => `<option value="${c}">Kelas ${c}</option>`).join('')}<option value="Lain-lain">Lain-lain</option></select>
                <input type="text" id="rco" placeholder="Kelas lain" style="display:none;"><button class="btn btn-primary" id="cb"><i data-lucide="arrow-right"></i> Teruskan ke Kedip Mata</button></div>
                <div class="data-table"><h3>👥 Pengguna Berdaftar</h3><div id="ul"></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.getElementById('rc').onchange = () => { document.getElementById('rco').style.display = document.getElementById('rc').value === 'Lain-lain' ? 'block' : 'none'; };
            document.getElementById('cb').onclick = async () => {
                let c = document.getElementById('rc').value;
                if (c === 'Lain-lain') c = document.getElementById('rco').value.trim();
                if (!c) { await showError('Ralat', 'Pilih kelas.'); return; }
                const n = document.getElementById('rn').value.trim();
                if (!n) { await showError('Ralat', 'Masukkan nama.'); return; }
                if (registeredUsers.some(u => u.name === n)) { await showError('Nama wujud', 'Pengguna sudah berdaftar.'); return; }
                pendingRegistration = { name: n, role: document.getElementById('rr').value, className: c };
                renderRegisterStep2();
            };
            renderUsersTable();
        }
        
        function renderUsersTable() {
            const container = document.getElementById('ul');
            if (!container) return;
            container.innerHTML = `<div class="table-container"></table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th></th></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Guru' : 'Pelajar'}</span></td><td>${escapeHtml(u.className)}</td><td class="action-buttons"><button class="edit-btn" onclick="editUserById('${u.id}')"><i data-lucide="edit-2"></i></button><button class="delete-btn" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2"></i></button></td>`).join('') || '<tr><td colspan="4">Tiada pengguna</td>'}</tbody></div>`;
            lucide.createIcons();
        }
        
        window.editUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) deleteUser(u); };
        
        function renderRegisterStep2() {
            const html = `<div class="step-indicator"><div class="step completed"><div class="step-number">✓</div><div class="step-label">Nama & Kelas</div></div><div class="step active"><div class="step-number">2</div><div class="step-label">Kedip Mata</div></div></div>
                <div class="info-box"><i data-lucide="eye"></i><div><strong>Kedipkan MATA 2 KALI untuk daftar automatik!</strong><br>Sistem akan auto tangkap wajah bila anda kedip</div></div>
                <div class="camera-container"><video id="registerVideo" autoplay></video><canvas id="registerCanvas" class="face-canvas"></canvas></div>
                <div class="camera-status" id="regStatus">● Sedia...</div>
                <div class="data-table"><div style="background:#E8F5E9;padding:12px;border-radius:14px;"><strong>📝 ${escapeHtml(pendingRegistration.name)}</strong><br>${pendingRegistration.role === 'teacher' ? 'Guru' : 'Pelajar'} | Kelas ${pendingRegistration.className}</div>
                <div style="display:flex;gap:12px;margin-top:12px;"><button class="btn btn-secondary" id="bb" style="flex:1;">Kembali</button><button class="btn btn-primary" id="mcb" style="flex:1;">Manual Capture</button></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startBlinkCamera();
            document.getElementById('bb').onclick = () => { registerStep = 1; renderRegisterPage(); };
            document.getElementById('mcb').onclick = manualCaptureFace;
        }
        
        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Laporan Kehadiran', 20, 20);
            doc.text(`Tarikh: ${getTodayDate()}`, 20, 35);
            doc.text(`Jumlah Kehadiran: ${getFilteredAttendance().length}`, 20, 45);
            doc.save(`laporan_${getTodayDate()}.pdf`);
            await showSuccess('Eksport', 'PDF selesai.');
        }
        
        async function exportToHTML() {
            const filtered = getFilteredAttendance();
            let html = `<html><head><title>Laporan Kehadiran</title><style>body{font-family:Arial;padding:20px;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:8px;}</style></head><body><h1>Laporan Kehadiran</h1><p>Tarikh: ${getTodayDate()} | Jumlah: ${filtered.length}</p><hr><table><tr><th>Nama</th><th>Kelas</th><th>Status</th><th>Masa</th></tr>`;
            for (const a of filtered) html += `<tr><td>${a.name}</td><td>${a.className}</td><td>${a.status}</td><td>${a.time}</td></tr>`;
            html += `</table></body></html>`;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `laporan_${getTodayDate()}.html`; a.click();
            URL.revokeObjectURL(url);
            await showSuccess('Eksport', 'HTML selesai.');
        }
        
        function renderRecordsPage() {
            let filtered = getFilteredAttendance();
            const totalItems = filtered.length;
            const paginated = getPaginatedData(filtered);
            const strangersList = strangerAlerts.filter(a => a.date === getTodayDate() && (selectedClass === "Semua Kelas" || a.className === selectedClass));
            
            const html = `<div class="class-selector"><select id="rcf"><option value="Semua Kelas" ${selectedClass === "Semua Kelas" ? 'selected' : ''}>📚 Semua Kelas</option>${availableClasses.map(c => `<option value="${c}" ${selectedClass === c ? 'selected' : ''}>📖 Kelas ${c}</option>`).join('')}</select></div>
                <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Cari nama..." value="${escapeHtml(searchQuery)}"><button class="btn-small btn-primary" id="searchBtn">Cari</button></div>
                <div class="date-filter"><input type="date" id="startDate" value="${startDate}" placeholder="Tarikh Mula"><input type="date" id="endDate" value="${endDate}" placeholder="Tarikh Akhir"><button class="btn-small btn-primary" id="filterBtn">Tapis</button><button class="btn-small btn-secondary" id="resetFilterBtn">Reset</button></div>
                <div class="data-table"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><h3>⚠️ Wajah Asing (${strangersList.length})</h3><div><button class="btn-small btn-primary" id="pdfBtn">📄 PDF</button><button class="btn-small btn-success" id="excelBtn">📊 Excel</button><button class="btn-small btn-warning" id="htmlBtn">📁 HTML</button></div></div><div id="sl"></div></div>
                <div class="data-table"><h3>📋 Rekod Kehadiran (${totalItems})</h3><div class="table-container"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Sesi</th><th>Status</th><th>Masa</th><th>Tarikh</th></thead><tbody>${paginated.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${r.sessionName}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td><td>${r.date}</td></tr>`).join('') || '<tr><td colspan="6">Tiada rekod</td>'}</tbody></div>${renderPagination(totalItems)}</div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('sl').innerHTML = strangersList.length ? strangersList.map(a => `<div class="danger-banner"><div>${a.imageData ? `<img src="${a.imageData}" class="stranger-image" onclick="Swal.fire({imageUrl:'${a.imageData}',imageWidth:300})">` : '📷'}</div><div><strong>⚠️ Wajah Asing</strong><br>Kelas: ${a.className} | ${a.time}</div><button class="btn-small btn-primary" onclick="downloadImage('${a.imageData}',${a.id})">💾 Simpan</button></div>`).join('') : '<p>✅ Tiada laporan</p>';
            
            document.getElementById('rcf').onchange = (e) => { selectedClass = e.target.value; saveLocal(); currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('searchBtn').onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('filterBtn').onclick = () => { startDate = document.getElementById('startDate').value; endDate = document.getElementById('endDate').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('resetFilterBtn').onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('pdfBtn').onclick = exportToPDF;
            document.getElementById('excelBtn').onclick = exportToCSV;
            document.getElementById('htmlBtn').onclick = exportToHTML;
        }
        
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera(); stopQRScanner(); if (registerStream) registerStream.getTracks().forEach(t => t.stop());
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'qrcode') renderQRPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
        }
        
        async function initApp() {
            document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
            window.navigateTo = navigateTo;
            setInterval(() => { if (document.getElementById('currentTime')) document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
            let dark = localStorage.getItem('darkMode') === 'true';
            if (dark) document.body.classList.add('dark');
            document.getElementById('darkModeToggle').onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); lucide.createIcons(); };
            document.getElementById('logoutBtn').onclick = logout;
            loadLocal();
            await loadFromFirebase();
            buildMatcher();
            renderDashboard();
            lucide.createIcons();
            await loadFaceModels();
            if ('Notification' in window) Notification.requestPermission();
        }
        
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        checkLogin();
        
        setTimeout(() => {
            if (!currentUser) showInfo('🔐 Login System', 'Demo: admin / admin123\nGuru: guru / guru123\n\nSemua data disimpan ke cloud Firebase!\nAlert akan dihantar ke Telegram jika stranger dikesan.');
        }, 1000);
    </script>
</body>
</html>
