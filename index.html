<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SmartClass Pro Ultimate | AI Face Recognition System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.5);
            --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.08);
            --shadow-lg: 0 25px 50px -12px rgb(0 0 0 / 0.15);
            --radius-sm: 16px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 40px;
        }

        body.dark {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        /* Glassmorphism Effect */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: var(--shadow-md);
        }

        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-left p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 6px 12px;
            background: var(--bg);
            border-radius: 40px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.94);
            background: var(--border);
        }

        .live-clock {
            font-family: monospace;
            font-weight: 600;
            background: var(--bg);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .nav-item i {
            width: 22px;
            height: 22px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Main Content */
        .main-content {
            padding: 20px 16px 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .stat-card:active {
            transform: scale(0.97);
        }

        .stat-info h3 {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        /* Camera Section */
        .camera-section, .qr-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #securityVideo, #registerVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .detection-indicator {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: white;
            z-index: 10;
        }

        .light-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 10px;
            color: white;
            z-index: 10;
        }

        .torch-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            z-index: 10;
        }

        .camera-status {
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            padding: 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-detecting {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Data Tables */
        .data-table {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .data-table h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-hadir { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-lewat { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-teacher { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
        .badge-student { background: rgba(139, 92, 246, 0.15); color: var(--purple); }

        /* Buttons */
        .btn {
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--text-secondary); color: white; }
        .btn:active { transform: scale(0.97); }
        .btn-small { padding: 8px 16px; font-size: 0.75rem; width: auto; }

        /* Forms */
        .register-form input, .register-form select {
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .register-form input:focus, .register-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Search & Filter */
        .search-bar, .date-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input, .date-filter input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.85rem;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
        }
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Danger Banner */
        .danger-banner {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .stranger-image {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--danger);
            cursor: pointer;
        }

        /* Step Indicator */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .step-number {
            width: 44px;
            height: 44px;
            border-radius: 44px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        .step.active .step-number {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: white;
            box-shadow: var(--shadow-md);
        }
        .step.completed .step-number {
            background: var(--success);
            color: white;
        }
        .step-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .step.active .step-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 20px;
        }
        .edit-btn { color: var(--primary); }
        .delete-btn { color: var(--danger); }

        /* Chart Card */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
        }
        canvas {
            max-height: 200px;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-card img { width: 70px; margin-bottom: 24px; }
        .login-card input {
            width: 100%;
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 1rem;
        }
        .info-box {
            background: rgba(99, 102, 241, 0.1);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
        }
        
        .class-selector, .camera-selector {
            margin-bottom: 16px;
        }
        .class-selector select, .camera-selector select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo" style="margin: 0 auto 20px; width: 70px; height: 70px; background: linear-gradient(135deg, #6366f1, #8b5cf6);">
                <i data-lucide="brain" style="width: 36px; height: 36px; color: white;"></i>
            </div>
            <h2>SmartClass Pro</h2>
            <p style="margin-bottom: 24px; color: var(--text-secondary);">AI Face Recognition System</p>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn btn-primary" id="loginBtn">Login</button>
            <p style="margin-top: 20px; font-size: 12px;">Demo: admin / admin123 | guru / guru123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left">
            <div class="logo"><i data-lucide="brain"></i></div>
            <div><h1>SmartClass Pro</h1><p>AI Face Recognition • Voice Greeting</p></div>
        </div>
        <div class="header-right">
            <div class="user-badge"><i data-lucide="user" style="width: 16px; height: 16px;"></i><span id="userName">Admin</span></div>
            <button class="icon-btn" id="darkModeToggle"><i data-lucide="moon"></i></button>
            <button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i></button>
            <div class="live-clock"><span id="currentTime">--:--:--</span></div>
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="shield-check"></i><span>Security</span></div>
        <div class="nav-item" data-page="qrcode"><i data-lucide="qr-code"></i><span>QR Scan</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Register</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Records</span></div>
    </div>

    <script>
        // ==================== VOICE GREETING ====================
        function speakGreeting(name, role, status) {
            const greeting = `Welcome ${name}. ${role === 'teacher' ? 'Teacher' : 'Student'}. ${status}.`;
            const utterance = new SpeechSynthesisUtterance(greeting);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        // ==================== LOGIN ====================
        let currentUser = null;
        const validUsers = [
            { username: "admin", password: "admin123", role: "admin", name: "Admin" },
            { username: "guru", password: "guru123", role: "teacher", name: "Cikgu Ahmad" }
        ];
        
        // ==================== DATA ====================
        let registeredUsers = [], attendanceRecords = [], strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let registerStep = 1;
        let pendingRegistration = null;
        let currentPageNum = 1, itemsPerPage = 10, searchQuery = "", startDate = "", endDate = "";
        
        // Camera
        let securityStream = null, registerStream = null, securityInterval = null, isSecurityActive = false, currentCameraId = 'user';
        let torchEnabled = false, videoTrack = null;
        
        // Face Recognition
        let modelsLoaded = false, faceMatcher = null;
        let html5QrCode = null, isScanning = false;
        let audioCtx = null, lastStrangerAlertTime = 0, lastAttendanceTime = {};
        let registerFaceDetected = false, registerDescriptor = null, registerInterval = null;
        let blinkCount = 0, isBlinking = false, captureTriggered = false;
        
        const DETECTION_INTERVAL = 150;
        const INPUT_SIZE = 320;
        const SIMILARITY_THRESHOLD = 0.55;
        
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // ==================== HELPERS ====================
        function loadLocal() {
            const u = localStorage.getItem('smart_users'); if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('smart_attendance'); if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('smart_strangers'); if (s) strangerAlerts = JSON.parse(s);
            const c = localStorage.getItem('smart_class'); if (c) selectedClass = c;
            const d = localStorage.getItem('smart_descriptors');
            if (d) { const desc = JSON.parse(d); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
        }
        function saveLocal() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className, registeredAt: u.registeredAt }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {}; registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
            localStorage.setItem('smart_class', selectedClass);
        }

        function detectLightLevel(video) {
            if (!video || !video.videoWidth) return 100;
            const canvas = document.createElement('canvas'); canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let total = 0;
            for (let i = 0; i < data.length; i += 4) total += (data[i] + data[i+1] + data[i+2]) / 3;
            return total / 2500;
        }
        async function enableTorch() { if (videoTrack) { try { await videoTrack.applyConstraints({ advanced: [{ torch: true }] }); torchEnabled = true; } catch(e) {} } }
        async function disableTorch() { if (videoTrack) { try { await videoTrack.applyConstraints({ advanced: [{ torch: false }] }); torchEnabled = false; } catch(e) {} } }
        
        async function detectAndProcessFaces() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            const light = detectLightLevel(video);
            if (light < 60 && currentCameraId === 'environment' && !torchEnabled && videoTrack) await enableTorch();
            else if (light > 100 && torchEnabled) await disableTorch();
            
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptors();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let recognized = [], stranger = false;
            for (const d of detections) {
                let best = null;
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(d.descriptor);
                    if (result.label !== 'unknown') best = registeredUsers.find(u => u.id === result.label);
                }
                const box = d.detection.box;
                ctx.beginPath(); ctx.rect(box.x, box.y, box.width, box.height);
                if (best) {
                    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui';
                    ctx.fillText(`${best.name} (${Math.round((1 - result.distance)*100)}%)`, box.x, box.y - 5);
                    recognized.push(best.name);
                    await autoMarkAttendance(best, Math.round((1 - result.distance)*100));
                } else {
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ STRANGER', box.x, box.y - 5);
                    stranger = true;
                }
            }
            document.getElementById('detectCount').innerHTML = detections.length ? `👤 ${detections.length} face(s) | Light: ${Math.round(light)}%` : '👤 No face detected';
            document.getElementById('recognizedNames').innerHTML = recognized.length ? `✅ Recognized: ${recognized.join(', ')}` : '✅ Waiting for face...';
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) {
                lastStrangerAlertTime = Date.now();
                const img = await captureImage(video);
                await reportStranger(img);
            }
        }
        
        async function autoMarkAttendance(user, confidence) {
            const today = getTodayDate(), session = getCurrentSession(), key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            const already = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!already) {
                lastAttendanceTime[key] = Date.now();
                const tv = new Date().getHours() * 60 + new Date().getMinutes();
                let statusName = "Hadir";
                if (session === 'pagi' && tv > 510) statusName = "Lewat";
                if (session === 'petang' && tv > 810) statusName = "Lewat";
                const statusText = statusName === "Hadir" ? "Present" : "Late";
                attendanceRecords.push({ id: user.id, name: user.name, role: user.role, className: user.className, status: statusName, session, sessionName: session === 'pagi' ? 'Morning' : 'Afternoon', time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto', confidence });
                saveLocal(); syncToFirebase(); playBeep();
                speakGreeting(user.name, user.role, statusText);
                Swal.fire({ title: '✅ Attendance Recorded!', html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${statusText}<br>Confidence: ${confidence}%<br>Time: ${getCurrentTime()}`, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, background: 'white', borderRadius: '20px' });
                updateUI();
            }
        }

        async function checkFaceForRegister() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath(); ctx.rect(cx, cy, w, h);
            if (detection) {
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#10b981'; ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Face Detected! Blink 2 times to register', cx, cy - 5);
                registerFaceDetected = true;
                registerDescriptor = Array.from(detection.descriptor);
                const left = detection.landmarks.getLeftEye();
                const right = detection.landmarks.getRightEye();
                if (left && right) {
                    const ear = (getEAR(left) + getEAR(right)) / 2;
                    const blinking = ear < 0.2;
                    if (blinking && !isBlinking) {
                        isBlinking = true;
                        blinkCount++;
                        document.getElementById('regCameraStatus').innerHTML = `👁️ Blink ${blinkCount}/2! ${blinkCount >= 2 ? 'Auto registering...' : 'Blink 1 more time'}`;
                        playBeep();
                        if (blinkCount >= 2 && !captureTriggered) {
                            captureTriggered = true;
                            setTimeout(() => autoRegisterFace(), 800);
                        }
                    } else if (!blinking) { isBlinking = false; }
                }
                document.getElementById('regCameraStatus').innerHTML = `👁️ Blink ${2 - blinkCount} time(s) to auto register`;
            } else {
                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 14px system-ui';
                ctx.fillText('Place your face in the box', cx, cy - 5);
                registerFaceDetected = false;
                document.getElementById('regCameraStatus').innerHTML = '● Position your face, then blink 2 times';
            }
        }

        function renderQRPage() { document.getElementById('mainContent').innerHTML = `<div class="qr-section"><h3><i data-lucide="qr-code"></i> QR Code Scan</h3><div class="qr-container" id="qr-reader"></div><div class="camera-status">● Starting scanner...</div></div>`; lucide.createIcons(); setTimeout(() => startQRScanner(), 100); }
        
        function renderRegisterPage() {
            const html = `<div class="step-indicator"><div class="step active"><div class="step-number">1</div><div class="step-label">Info</div></div><div class="step"><div class="step-number">2</div><div class="step-label">Blink to Register</div></div></div><div class="data-table"><div class="register-form"><input type="text" id="regName" placeholder="Full Name *"><select id="regRole"><option value="student">🎓 Student</option><option value="teacher">👩‍🏫 Teacher</option></select><select id="regClass"><option value="">Select Class *</option>${availableClasses.map(c => `<option value="${c}">Class ${c}</option>`).join('')}<option value="Lain-lain">Other Class</option></select><input type="text" id="regClassOther" placeholder="Other class" style="display:none;"><button class="btn btn-primary" id="continueBtn"><i data-lucide="arrow-right"></i> Continue →</button></div></div><div class="data-table"><h3>👥 Registered Users</h3><div id="usersList"></div></div>`;
            document.getElementById('mainContent').innerHTML = html; lucide.createIcons();
            document.getElementById('regClass').onchange = () => { document.getElementById('regClassOther').style.display = document.getElementById('regClass').value === 'Lain-lain' ? 'block' : 'none'; };
            document.getElementById('continueBtn').onclick = async () => { let className = document.getElementById('regClass').value; if (className === 'Lain-lain') className = document.getElementById('regClassOther').value.trim(); if (!className) { await showError('Error', 'Please select class'); return; } document.getElementById('regClass').value = className; await saveNameAndClass(); };
            renderUsersTable();
        }
        
        function renderUsersTable() {
            const container = document.getElementById('usersList');
            if (!container) return;
            container.innerHTML = `<div class="table-container"><table><thead><tr><th>Name</th><th>Role</th><th>Class</th><th></th></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Teacher' : 'Student'}</span></td><td>${escapeHtml(u.className)}</td><td class="action-buttons"><button class="edit-btn" onclick="editUserById('${u.id}')"><i data-lucide="edit-2"></i></button><button class="delete-btn" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2"></i></button></td>`).join('') || '<tr><td colspan="4">No users registered</td>'}</tbody> </div>`;
            lucide.createIcons();
        }
        window.editUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) deleteUser(u); };
        
        function renderRegisterStep2() {
            const html = `<div class="step-indicator"><div class="step completed"><div class="step-number">✓</div><div class="step-label">Info</div></div><div class="step active"><div class="step-number">2</div><div class="step-label">Blink 2x</div></div></div><div class="info-box"><i data-lucide="eye"></i><div><strong>👁️ Blink Your Eyes 2 Times to Register!</strong><br>System will auto-capture your face when you blink twice</div></div><div class="camera-container"><video id="registerVideo" autoplay playsinline></video><canvas id="registerCanvas" class="face-canvas"></canvas></div><div class="camera-status" id="regCameraStatus">● Position your face, then blink 2 times</div><div class="data-table"><div style="background: rgba(16,185,129,0.1);padding:16px;border-radius:20px;margin-bottom:16px;"><strong>📝 ${escapeHtml(pendingRegistration.name)}</strong><br>${pendingRegistration.role === 'teacher' ? '👩‍🏫 Teacher' : '🎓 Student'} | Class ${pendingRegistration.className}</div><div style="display:flex;gap:12px;"><button class="btn btn-secondary" id="backBtn" style="flex:1;"><i data-lucide="arrow-left"></i> Back</button></div></div>`;
            document.getElementById('mainContent').innerHTML = html; lucide.createIcons();
            startRegisterCamera();
            document.getElementById('backBtn').onclick = backToStep1;
        }
        
        function renderRecordsPage() {
            let filtered = getFilteredAttendance();
            const totalItems = filtered.length;
            const paginated = getPaginatedData(filtered);
            const todayStrangers = strangerAlerts.filter(a => a.date === getTodayDate() && (selectedClass === "Semua Kelas" || a.className === selectedClass));
            const html = `<div class="class-selector"><select id="recordClassFilter"><option value="Semua Kelas" ${selectedClass === "Semua Kelas" ? 'selected' : ''}>📚 All Classes</option>${availableClasses.map(c => `<option value="${c}" ${selectedClass === c ? 'selected' : ''}>📖 Class ${c}</option>`).join('')}</select></div><div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search by name..." value="${escapeHtml(searchQuery)}"><button class="btn-small btn-primary" id="searchBtn">Search</button></div><div class="date-filter"><input type="date" id="startDateInput" value="${startDate}"><input type="date" id="endDateInput" value="${endDate}"><button class="btn-small btn-primary" id="filterBtn">Filter</button><button class="btn-small btn-secondary" id="resetBtn">Reset</button></div><div class="data-table"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;"><h3>⚠️ Stranger Alerts (${todayStrangers.length})</h3><div><button class="btn-small btn-primary" id="pdfBtn">📄 PDF</button><button class="btn-small btn-success" id="excelBtn">📊 Excel</button></div></div><div id="strangerList"></div></div><div class="data-table"><h3>📋 Attendance Records (${totalItems})</h3><div class="table-container"><tr><thead><tr><th>Name</th><th>Class</th><th>Session</th><th>Status</th><th>Date</th><th>Time</th><th>Confidence</th></tr></thead><tbody>${paginated.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${r.sessionName}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td><td>${r.confidence || 100}%</td>`).join('') || '<tr><td colspan="7">No records</td>'}</tbody> </div>${renderPagination(totalItems)}</div>`;
            document.getElementById('mainContent').innerHTML = html; lucide.createIcons();
            document.getElementById('strangerList').innerHTML = todayStrangers.length ? todayStrangers.map(a => `<div class="danger-banner"><div>${a.imageData ? `<img src="${a.imageData}" class="stranger-image" onclick="viewStranger('${a.imageData}')">` : '📷'}</div><div><strong>⚠️ Stranger Detected!</strong><br>Class: ${a.className} | Time: ${a.time}</div><button class="btn-small btn-primary" onclick="downloadImage('${a.imageData}',${a.id})">💾 Save</button></div>`).join('') : '<p>✅ No stranger alerts today</p>';
            document.getElementById('recordClassFilter').onchange = (e) => { selectedClass = e.target.value; saveLocal(); currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('searchBtn').onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('filterBtn').onclick = () => { startDate = document.getElementById('startDateInput').value; endDate = document.getElementById('endDateInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('resetBtn').onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('pdfBtn').onclick = exportToPDF;
            document.getElementById('excelBtn').onclick = exportToCSV;
        }
        
        window.viewStranger = (img) => { Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#6366f1', borderRadius: '24px' }); };
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera(); stopQRScanner(); if (registerStream) registerStream.getTracks().forEach(t => t.stop());
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'qrcode') renderQRPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
        }
        
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = { username: user.username, role: user.role, name: user.name };
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                document.getElementById('userName').innerText = currentUser.name;
                loadLocal(); loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); });
            } else { showError('Login Failed', 'Invalid username or password'); }
        }
        
        function logout() { localStorage.removeItem('loggedInUser'); currentUser = null; location.reload(); }
        
        let darkMode = localStorage.getItem('darkMode') === 'true';
        if (darkMode) document.body.classList.add('dark');
        document.getElementById('darkModeToggle')?.addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); lucide.createIcons(); });
        
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
        window.navigateTo = navigateTo;
        setInterval(() => { if (document.getElementById('currentTime')) document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
        
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('userName').innerText = currentUser.name;
            loadLocal(); loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); });
        }
    </script>
</body>
</html>
