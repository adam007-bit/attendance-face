<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Class - Full Day Security System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
        }

        .header-left h1 {
            font-size: 18px;
            margin: 0;
        }

        .header-left p {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .live-clock {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            font-family: monospace;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .nav-item i {
            width: 24px;
            height: 24px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .main-content {
            padding: 16px 16px 80px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }

        .stat-info h3 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        .camera-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #securityVideo, #registerVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .qr-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1;
            max-width: 300px;
            margin: 0 auto;
        }

        #qr-reader {
            width: 100%;
            height: 100%;
        }

        .camera-status {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            padding: 8px;
            border-radius: 12px;
        }

        .status-active { background: #E8F5E9; color: #2E7D32; }
        .status-warning { background: #FFF3E0; color: #E65100; }
        .status-error { background: #FFEBEE; color: #C62828; }
        .status-info { background: #E3F2FD; color: #1565C0; }
        .status-danger { background: #FFEBEE; color: #C62828; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .data-table {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .data-table h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-pulang { background: #E3F2FD; color: #1565C0; }
        .badge-teacher { background: #F3E5F5; color: #6A1B9A; }
        .badge-student { background: #E8F5E9; color: #2E7D32; }

        .register-form input, .register-form select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }

        .btn:active { transform: scale(0.97); }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
        }

        canvas {
            max-height: 200px;
        }

        .warning-banner {
            background: #FFF3E0;
            border-left: 4px solid var(--warning);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .danger-banner {
            background: #FFEBEE;
            border-left: 4px solid var(--danger);
            animation: pulse 1s infinite;
        }

        .session-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .session-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }

        .session-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .class-selector {
            margin-bottom: 16px;
        }

        .class-selector select {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div>
                <h1>Smart Class Security</h1>
                <p>Full Day QR + Face Recognition</p>
            </div>
        </div>
        <div class="live-clock">
            <span id="currentTime">--:--:--</span>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>

    <div class="bottom-nav">
        <div class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="security">
            <i data-lucide="shield-check"></i>
            <span>Keselamatan</span>
        </div>
        <div class="nav-item" data-page="qrcode">
            <i data-lucide="qr-code"></i>
            <span>QR Scan</span>
        </div>
        <div class="nav-item" data-page="register">
            <i data-lucide="user-plus"></i>
            <span>Daftar</span>
        </div>
        <div class="nav-item" data-page="records">
            <i data-lucide="clipboard-list"></i>
            <span>Rekod</span>
        </div>
    </div>

    <script>
        // ==================== DATA STORAGE ====================
        let registeredUsers = [];     // { id, name, role, className, faceImage }
        let attendanceRecords = [];    // { id, name, role, className, status, time, date, session }
        let strangerAlerts = [];       // { time, date, className, image }
        let selectedClass = "Semua Kelas";
        let selectedSession = "pagi";  // pagi, petang, sepanjang_hari
        
        // Available classes
        let availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];
        
        let currentPage = 'dashboard';
        let attendanceChart = null;
        
        // Camera variables
        let securityStream = null;
        let registerStream = null;
        let securityInterval = null;
        let isSecurityActive = false;
        let isRegisterActive = false;
        
        // QR Scanner
        let html5QrCode = null;
        let isScanning = false;
        
        // Face detection
        let lastFaceDetected = false;
        let currentFaceImage = null;

        // Session times
        const SESSION_TIMES = {
            pagi: { start: "07:30", end: "13:00", name: "Sesi Pagi" },
            petang: { start: "13:30", end: "18:30", name: "Sesi Petang" },
            sepanjang_hari: { start: "07:30", end: "18:30", name: "Sepanjang Hari" }
        };

        // Helper Functions
        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function getCurrentSession() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeValue = hours * 60 + minutes;
            
            if (timeValue < 13 * 60) return "pagi";
            return "petang";
        }

        function escapeHtml(str) { 
            return String(str).replace(/[&<>]/g, function(m) { 
                if (m === '&') return '&amp;'; 
                if (m === '<') return '&lt;'; 
                if (m === '>') return '&gt;'; 
                return m; 
            }); 
        }

        // SweetAlert functions
        async function showSuccess(title, message) {
            await Swal.fire({
                title: title, text: message, icon: 'success',
                confirmButtonColor: '#007AFF', confirmButtonText: 'OK',
                background: 'white', borderRadius: '20px'
            });
        }

        async function showError(title, message) {
            await Swal.fire({
                title: title, text: message, icon: 'error',
                confirmButtonColor: '#007AFF', confirmButtonText: 'OK',
                background: 'white', borderRadius: '20px'
            });
        }

        async function showWarning(title, message) {
            await Swal.fire({
                title: title, text: message, icon: 'warning',
                confirmButtonColor: '#FF9500', confirmButtonText: 'OK',
                background: 'white', borderRadius: '20px'
            });
        }

        async function showInfo(title, message) {
            await Swal.fire({
                title: title, text: message, icon: 'info',
                confirmButtonColor: '#007AFF', confirmButtonText: 'OK',
                background: 'white', borderRadius: '20px'
            });
        }

        // Load/Save
        function loadData() {
            const savedUsers = localStorage.getItem('full_day_users');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            
            const savedAttendance = localStorage.getItem('full_day_attendance');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            
            const savedAlerts = localStorage.getItem('full_day_stranger_alerts');
            if (savedAlerts) strangerAlerts = JSON.parse(savedAlerts);
            
            const savedClass = localStorage.getItem('selected_class');
            if (savedClass) selectedClass = savedClass;
            
            updateUI();
        }

        function saveUsers() {
            localStorage.setItem('full_day_users', JSON.stringify(registeredUsers));
            updateUI();
        }

        function saveAttendance() {
            localStorage.setItem('full_day_attendance', JSON.stringify(attendanceRecords));
            updateUI();
        }

        function saveStrangerAlerts() {
            localStorage.setItem('full_day_stranger_alerts', JSON.stringify(strangerAlerts));
        }

        function saveSelectedClass() {
            localStorage.setItem('selected_class', selectedClass);
        }

        function updateUI() {
            if (currentPage === 'dashboard') renderDashboard();
            if (currentPage === 'records') renderRecordsPage();
            if (currentPage === 'security') updateSecurityStats();
        }

        // ==================== FACE DETECTION ====================
        function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
                .then(stream => {
                    securityStream = stream;
                    const video = document.getElementById('securityVideo');
                    if (video) {
                        video.srcObject = stream;
                        video.play().catch(e => console.log(e));
                    }
                    isSecurityActive = true;
                    
                    const statusEl = document.getElementById('securityStatus');
                    if (statusEl) {
                        statusEl.innerHTML = '● Kamera keselamatan aktif - Mengesan wajah';
                        statusEl.className = 'camera-status status-active';
                    }
                    
                    if (securityInterval) clearInterval(securityInterval);
                    securityInterval = setInterval(detectStrangerFace, 1000);
                })
                .catch(err => {
                    console.error(err);
                    const statusEl = document.getElementById('securityStatus');
                    if (statusEl) {
                        statusEl.innerHTML = '⚠️ Kamera tidak dapat diakses';
                        statusEl.className = 'camera-status status-error';
                    }
                });
        }

        function stopSecurityCamera() {
            if (securityStream) {
                securityStream.getTracks().forEach(track => track.stop());
                securityStream = null;
            }
            if (securityInterval) {
                clearInterval(securityInterval);
                securityInterval = null;
            }
            isSecurityActive = false;
        }

        function detectStrangerFace() {
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Detect faces in frame
            const centerX = Math.floor(canvas.width / 4);
            const centerY = Math.floor(canvas.height / 4);
            const boxW = Math.floor(canvas.width / 2);
            const boxH = Math.floor(canvas.height / 2);
            
            const imageData = ctx.getImageData(centerX, centerY, boxW, boxH);
            const data = imageData.data;
            
            let skinPixelCount = 0;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                if (r > 80 && g > 40 && b > 40 && r > g && Math.abs(r - g) > 15) {
                    skinPixelCount++;
                }
            }
            
            const totalPixels = boxW * boxH;
            const skinPercentage = skinPixelCount / totalPixels;
            const faceDetected = skinPercentage > 0.12;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.rect(centerX, centerY, boxW, boxH);
            
            if (faceDetected) {
                // Check if face is recognized (simplified - check if any user matches)
                // For demo, we'll just show detection
                ctx.strokeStyle = '#34C759';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#34C759';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Wajah Dikesan', centerX, centerY - 5);
                
                const statusEl = document.getElementById('securityStatus');
                if (statusEl) {
                    statusEl.innerHTML = '✅ Wajah dikesan - Sistem memantau';
                    statusEl.className = 'camera-status status-active';
                }
            } else {
                ctx.strokeStyle = '#FF9500';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FF9500';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Mengesan wajah...', centerX, centerY - 5);
            }
        }

        async function reportStranger() {
            const strangerName = document.getElementById('strangerName')?.value.trim();
            if (!strangerName) {
                await showWarning('Sila Masukkan Nama', 'Masukkan nama atau keterangan orang asing.');
                return;
            }
            
            const alert = {
                id: Date.now(),
                name: strangerName,
                className: selectedClass,
                time: getCurrentTime(),
                date: getTodayDate(),
                session: getCurrentSession()
            };
            
            strangerAlerts.push(alert);
            saveStrangerAlerts();
            
            await Swal.fire({
                title: '⚠️ Laporan Keselamatan Dihantar!',
                html: `Orang asing: ${escapeHtml(strangerName)}<br>Kelas: ${selectedClass}<br>Masa: ${getCurrentTime()}`,
                icon: 'warning',
                confirmButtonColor: '#FF3B30',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
            
            document.getElementById('strangerName').value = '';
            updateSecurityStats();
        }

        function updateSecurityStats() {
            const strangerCount = strangerAlerts.filter(a => a.date === getTodayDate()).length;
            const strangerCountEl = document.getElementById('strangerCount');
            if (strangerCountEl) strangerCountEl.innerText = strangerCount;
            
            const alertsList = document.getElementById('alertsList');
            if (alertsList) {
                const todayAlerts = strangerAlerts.filter(a => a.date === getTodayDate()).slice(-10);
                alertsList.innerHTML = todayAlerts.map(a => `
                    <div class="warning-banner danger-banner" style="margin-bottom: 8px;">
                        <i data-lucide="alert-triangle"></i>
                        <div><strong>${escapeHtml(a.name)}</strong><br><small>Kelas ${a.className} | ${a.time}</small></div>
                    </div>
                `).join('') || '<p style="text-align:center; padding:20px;">Tiada laporan untuk hari ini</p>';
                lucide.createIcons();
            }
        }

        // ==================== QR SCANNER ====================
        async function startQRScanner() {
            if (isScanning) return;
            
            const qrContainer = document.getElementById('qr-reader');
            if (!qrContainer) return;
            
            try {
                html5QrCode = new Html5Qrcode("qr-reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1 },
                    async (decodedText) => {
                        if (decodedText && !window.isProcessing) {
                            window.isProcessing = true;
                            try {
                                const qrData = JSON.parse(decodedText);
                                const user = registeredUsers.find(u => u.id === qrData.id);
                                
                                if (user && (selectedClass === "Semua Kelas" || user.className === selectedClass)) {
                                    await markAttendance(user, 'QR Code');
                                } else if (user) {
                                    await showError('Kelas Berbeza', `Pengguna ini dari kelas ${user.className}, bukan ${selectedClass}.`);
                                } else {
                                    await showError('❌ Pengguna Tidak Dikenali', 'QR Code ini tidak berdaftar.');
                                }
                            } catch(e) {
                                await showError('QR Code Tidak Sah', 'Format tidak dikenali.');
                            }
                            setTimeout(() => { window.isProcessing = false; }, 2000);
                        }
                    },
                    (error) => {}
                );
                isScanning = true;
            } catch(err) {
                await showError('Ralat Kamera', 'Kamera tidak dapat diakses.');
            }
        }

        function stopQRScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().catch(e => console.log(e));
                isScanning = false;
            }
        }

        // ==================== ATTENDANCE ====================
        async function markAttendance(user, method) {
            const today = getTodayDate();
            const session = getCurrentSession();
            const sessionName = SESSION_TIMES[session].name;
            
            // Check if already logged for this session
            const alreadyLogged = attendanceRecords.find(rec => rec.id === user.id && rec.date === today && rec.session === session);
            
            if (alreadyLogged) {
                await showWarning('Kehadiran Dicatat Sebelum Ini', `${user.name} sudah mencatat kehadiran untuk ${sessionName}.`);
                return false;
            }
            
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const timeValue = hours * 60 + minutes;
            
            let status = "Hadir";
            if (session === "pagi") {
                if (timeValue > 510) status = "Lewat"; // 8:30
            } else {
                if (timeValue > 810) status = "Lewat"; // 13:30
            }
            
            attendanceRecords.push({
                id: user.id,
                name: user.name,
                role: user.role,
                className: user.className,
                status: status,
                session: session,
                sessionName: sessionName,
                time: getCurrentTime(),
                date: today,
                timestamp: Date.now(),
                method: method
            });
            saveAttendance();
            
            // Beep sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                setTimeout(() => osc.stop(), 300);
            } catch(e) {}
            
            if ('vibrate' in navigator) navigator.vibrate(100);
            
            await Swal.fire({
                title: '✅ Kehadiran Dicatat!',
                html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${status}<br>Sesi: ${sessionName}<br>Masa: ${getCurrentTime()}`,
                icon: 'success',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px',
                timer: 3000,
                timerProgressBar: true
            });
            
            updateUI();
            return true;
        }

        // ==================== REGISTER FACE ====================
        function startRegisterCamera() {
            if (registerStream) stopRegisterCamera();
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
                .then(stream => {
                    registerStream = stream;
                    const video = document.getElementById('registerVideo');
                    if (video) {
                        video.srcObject = stream;
                        video.play().catch(e => console.log(e));
                    }
                    isRegisterActive = true;
                    
                    if (registerInterval) clearInterval(registerInterval);
                    registerInterval = setInterval(detectFaceForRegister, 300);
                })
                .catch(err => {
                    showError('Ralat Kamera', 'Kamera tidak dapat diakses.');
                });
        }

        function stopRegisterCamera() {
            if (registerStream) {
                registerStream.getTracks().forEach(track => track.stop());
                registerStream = null;
            }
            if (registerInterval) {
                clearInterval(registerInterval);
                registerInterval = null;
            }
            isRegisterActive = false;
        }

        let registerInterval = null;

        function detectFaceForRegister() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const centerX = Math.floor(canvas.width / 4);
            const centerY = Math.floor(canvas.height / 4);
            const boxW = Math.floor(canvas.width / 2);
            const boxH = Math.floor(canvas.height / 2);
            
            const imageData = ctx.getImageData(centerX, centerY, boxW, boxH);
            const data = imageData.data;
            
            let skinPixelCount = 0;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                if (r > 80 && g > 40 && b > 40 && r > g && Math.abs(r - g) > 15) {
                    skinPixelCount++;
                }
            }
            
            const totalPixels = boxW * boxH;
            const skinPercentage = skinPixelCount / totalPixels;
            const faceDetected = skinPercentage > 0.12;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.rect(centerX, centerY, boxW, boxH);
            
            if (faceDetected) {
                ctx.strokeStyle = '#34C759';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#34C759';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Wajah Dikesan!', centerX, centerY - 5);
                lastFaceDetected = true;
                currentFaceImage = canvas.toDataURL('image/jpeg');
                
                const statusEl = document.getElementById('registerStatus');
                if (statusEl) {
                    statusEl.innerHTML = '✅ Wajah dikesan! Anda boleh daftar sekarang.';
                    statusEl.className = 'camera-status status-active';
                }
            } else {
                ctx.strokeStyle = '#FF9500';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FF9500';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Letakkan muka di sini', centerX, centerY - 5);
                lastFaceDetected = false;
                
                const statusEl = document.getElementById('registerStatus');
                if (statusEl) {
                    statusEl.innerHTML = '● Letakkan muka dalam kotak untuk daftar';
                    statusEl.className = 'camera-status status-info';
                }
            }
        }

        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClass').value.trim();
            
            if (!name) {
                await showError('Ralat', 'Sila masukkan nama penuh.');
                return;
            }
            
            if (!className) {
                await showError('Ralat', 'Sila pilih kelas.');
                return;
            }
            
            if (!lastFaceDetected) {
                await showWarning('Tiada Wajah Dikesan', 'Sila pastikan muka anda dalam kotak hijau.');
                return;
            }
            
            if (registeredUsers.some(u => u.name.toLowerCase() === name.toLowerCase())) {
                await showError('Nama Sudah Wujud', `Pengguna "${name}" sudah berdaftar.`);
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                name: name,
                role: role,
                className: className,
                registeredAt: new Date().toISOString(),
                faceImage: currentFaceImage,
                qrData: JSON.stringify({ id: Date.now().toString(), name: name, role: role, className: className })
            };
            
            registeredUsers.push(newUser);
            saveUsers();
            
            await showSuccess('✅ Pendaftaran Berjaya!', `${name} (${role === 'teacher' ? 'Guru' : 'Pelajar'})\nKelas: ${className}\n\nGunakan QR Code atau Face untuk rekod kehadiran.`);
            
            document.getElementById('regName').value = '';
            document.getElementById('regClass').value = '';
            
            // Update class options
            if (!availableClasses.includes(className)) {
                availableClasses.push(className);
                availableClasses.sort();
            }
        }

                </div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-info"><h3>Pengguna</h3><div class="stat-number">${registeredUsers.length}</div></div><div class="stat-icon"><i data-lucide="users"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir Hari Ini</h3><div class="stat-number">${todayAttendance}</div></div><div class="stat-icon"><i data-lucide="check-circle"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Pelajar</h3><div class="stat-number">${totalStudents}</div></div><div class="stat-icon"><i data-lucide="graduation-cap"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Guru</h3><div class="stat-number">${totalTeachers}</div></div><div class="stat-icon"><i data-lucide="chalkboard"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir</h3><div class="stat-number">${presentToday}</div></div><div class="stat-icon"><i data-lucide="smile"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Lewat</h3><div class="stat-number">${lateToday}</div></div><div class="stat-icon"><i data-lucide="clock"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Wajah Asing</h3><div class="stat-number">${strangerToday}</div></div><div class="stat-icon"><i data-lucide="alert-triangle"></i></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i data-lucide="pie-chart"></i> Kehadiran Hari Ini</h3><canvas id="attendanceChartCanvas"></canvas></div>
                </div>
                <div class="data-table"><h3><i data-lucide="info"></i> Panduan Sistem</h3>
                    <p style="font-size: 13px; line-height: 1.5;">
                    🟢 <strong>Sesi Persekolahan:</strong> Pagi (7:30AM - 1:00PM) | Petang (1:30PM - 6:30PM)<br>
                    🟢 <strong>QR Code:</strong> Scan untuk rekod kehadiran cepat<br>
                    🟢 <strong>Keselamatan:</strong> Kamera memantau wajah asing<br>
                    🟢 <strong>Laporan:</strong> Semua kehadiran dan alert direkod</p>
                </div>
                <div class="data-table"><h3>📋 Kehadiran Terkini (${selectedClass === "Semua Kelas" ? "Semua Kelas" : "Kelas " + selectedClass})</h3>
                <div class="table-container"><tr><thead><tr><th>Nama</th><th>Kelas</th><th>Sesi</th><th>Status</th><th>Kaedah</th><th>Masa</th></thead><tbody>${attendanceRecords.filter(r => selectedClass === "Semua Kelas" || r.className === selectedClass).slice(-10).reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${r.sessionName || r.session}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td><span style="font-size:10px;">${r.method || 'Face'}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="6">Tiada rekod</td></tr>'}</tbody></div></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const ctx = document.getElementById('attendanceChartCanvas')?.getContext('2d');
            if (ctx && attendanceChart) attendanceChart.destroy();
            if (ctx) {
                const filteredAttendance = attendanceRecords.filter(r => r.date === getTodayDate() && (selectedClass === "Semua Kelas" || r.className === selectedClass));
                const present = filteredAttendance.filter(r => r.status === 'Hadir').length;
                const late = filteredAttendance.filter(r => r.status === 'Lewat').length;
                attendanceChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Hadir', 'Lewat'], datasets: [{ data: [present, late], backgroundColor: ['#34C759', '#FF9500'] }] } });
            }
            
            document.getElementById('classFilterSelect').onchange = (e) => {
                selectedClass = e.target.value;
                saveSelectedClass();
                renderDashboard();
            };
        }

        function renderSecurityPage() {
            const strangerToday = strangerAlerts.filter(a => a.date === getTodayDate()).length;
            const html = `
                <div class="camera-section">
                    <h3><i data-lucide="shield-check"></i> Kamera Keselamatan Kelas</h3>
                    <div class="camera-container">
                        <video id="securityVideo" autoplay playsinline></video>
                        <canvas id="securityCanvas" class="face-canvas"></canvas>
                    </div>
                    <div class="camera-status" id="securityStatus">● Memulakan kamera...</div>
                </div>
                <div class="data-table">
                    <h3>⚠️ Laporan Wajah Asing</h3>
                    <div style="margin-bottom: 12px;">
                        <input type="text" id="strangerName" placeholder="Nama/Keterangan orang asing" style="width:100%; padding:12px; border-radius:14px; border:1px solid var(--border); margin-bottom:8px;">
                        <button class="btn btn-danger" id="reportStrangerBtn"><i data-lucide="alert-triangle"></i> Laporkan Wajah Asing</button>
                    </div>
                    <div id="alertsList"></div>
                </div>
                <div class="stats-grid" style="margin-top: 12px;">
                    <div class="stat-card"><div class="stat-info"><h3>Wajah Asing Hari Ini</h3><div class="stat-number" id="strangerCount">${strangerToday}</div></div><div class="stat-icon"><i data-lucide="alert-triangle"></i></div></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startSecurityCamera();
            document.getElementById('reportStrangerBtn').onclick = reportStranger;
            updateSecurityStats();
        }

        function renderQRPage() {
            const html = `
                <div class="camera-section">
                    <h3><i data-lucide="qr-code"></i> Imbas QR Code Kehadiran</h3>
                    <div class="qr-container" id="qr-reader"></div>
                    <div class="camera-status" id="qrStatus" style="margin-top: 12px;">● Memulakan scanner...</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="info"></i> Maklumat Sesi</h3>
                    <p style="font-size: 13px;">📅 <strong>Sesi Pagi:</strong> 7:30AM - 2.40PM<br>📅 <strong>Sesi Petang:</strong> 3:00PM - 4:00PM<br>📅 Sesi semasa: <strong>${SESSION_TIMES[getCurrentSession()].name}</strong><br>📅 Kelas terpilih: <strong>${selectedClass === "Semua Kelas" ? "Semua Kelas" : selectedClass}</strong></p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            setTimeout(() => startQRScanner(), 100);
        }

        function renderRegisterPage() {
            const html = `
                <div class="camera-section">
                    <h3><i data-lucide="user-plus"></i> Daftar Wajah & QR Baru</h3>
                    <div class="camera-container">
                        <video id="registerVideo" autoplay playsinline></video>
                        <canvas id="registerCanvas" class="face-canvas"></canvas>
                    </div>
                    <div class="camera-status" id="registerStatus">● Memulakan kamera...</div>
                </div>
                <div class="data-table">
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Nama Penuh *">
                        <select id="regRole">
                            <option value="student">👨‍🎓 Pelajar</option>
                            <option value="teacher">👩‍🏫 Guru</option>
                        </select>
                        <select id="regClass">
                            <option value="">Pilih Kelas *</option>
                            ${availableClasses.map(c => `<option value="${c}">Kelas ${c}</option>`).join('')}
                            <option value="Lain-lain">Kelas Lain (isi sendiri)</option>
                        </select>
                        <input type="text" id="regClassOther" placeholder="Atau masukkan kelas lain" style="display:none;">
                        <button class="btn btn-success" id="registerBtn"><i data-lucide="camera"></i> Daftar Wajah & Jana QR</button>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startRegisterCamera();
            
            const classSelect = document.getElementById('regClass');
            const classOther = document.getElementById('regClassOther');
            classSelect.onchange = () => {
                classOther.style.display = classSelect.value === 'Lain-lain' ? 'block' : 'none';
            };
            
            document.getElementById('registerBtn').onclick = async () => {
                let className = document.getElementById('regClass').value;
                if (className === 'Lain-lain') {
                    className = document.getElementById('regClassOther').value.trim();
                    if (!className) {
                        await showError('Ralat', 'Sila masukkan nama kelas.');
                        return;
                    }
                }
                document.getElementById('regClass').value = className;
                registerUser();
            };
        }

                </div>
                <div class="data-table">
                    <h3>📋 Kehadiran Hari Ini - Sesi Pagi</h3>

                </div>

                    <div class="table-container"><table><thead><table><th>Nama</th><th>Kelas</th><th>Status</th><th>Masa</th></thead><tbody>${filtered.filter(r => r.session === 'petang').map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="4">Tiada rekod sesi petang</td></tr>'}</tbody></div>
                </div>
                <div class="data-table">
                    <h3>📜 Semua Rekod Kehadiran</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Sesi</th><th>Status</th><th>Tarikh</th><th>Masa</th></thead><tbody>${allRecords.slice().reverse().slice(0, 30).map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${r.sessionName || r.session}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="6">Tiada rekod</td></tr>'}</tbody></div>
                </div>
                <div class="data-table">
                    <h3>⚠️ Laporan Keselamatan (Wajah Asing)</h3>
                    <div class="table-container"><table><thead><tr><th>Nama/Keterangan</th><th>Kelas</th><th>Tarikh</th><th>Masa</th></thead><tbody>${strangerAlerts.slice().reverse().map(a => `<tr><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.className)}</td><td>${a.date}</td><td>${a.time}</td></tr>`).join('') || '<tr><td colspan="4">Tiada laporan</td></tr>'}</tbody></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('recordClassFilter').onchange = (e) => {
                selectedClass = e.target.value;
                saveSelectedClass();
                renderRecordsPage();
            };
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            
            // Stop all cameras
            stopSecurityCamera();
            stopQRScanner();
            stopRegisterCamera();
            
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'qrcode') renderQRPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
        }

        // Event Listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });

        // Initialize
        loadData();
        renderDashboard();
        lucide.createIcons();
        
        setTimeout(() => {
            showInfo('🛡️ Selamat Datang ke Smart Class Security', 
                'Sistem Keselamatan Sepanjang Hari Persekolahan\n\n' +
                '✅ Daftar muka & QR Code di tab "Daftar"\n' +
                '✅ Scan QR untuk rekod kehadiran pagi/petang\n' +
                '✅ Kamera keselamatan pantau wajah asing\n' +
                '✅ Laporan kehadiran dan keselamatan lengkap');
        }, 1000);
    </script>
