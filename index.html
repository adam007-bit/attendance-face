<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Class - Face Recognition Attendance</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
        }

        .header-left h1 {
            font-size: 18px;
            margin: 0;
        }

        .live-clock {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            font-family: monospace;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .nav-item i {
            width: 24px;
            height: 24px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .main-content {
            padding: 16px 16px 80px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-info h3 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        .camera-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #globalVideoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .camera-status {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            padding: 8px;
            border-radius: 12px;
            background: var(--bg);
        }

        .status-loading { color: var(--warning); }
        .status-active { color: var(--success); }
        .status-error { color: var(--danger); }

        .data-table {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .data-table h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #E3F2FD; color: #1565C0; }
        .badge-student { background: #F3E5F5; color: #6A1B9A; }

        .register-form input, .register-form select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .btn:active { transform: scale(0.97); }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
        }

        canvas {
            max-height: 200px;
        }

        /* Face detection indicator */
        .detection-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div>
                <h1>Smart Class</h1>
                <p style="font-size: 10px; color: var(--text-secondary);">Face Recognition</p>
            </div>
        </div>
        <div class="live-clock">
            <span id="currentTime">--:--:--</span>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>

    <div class="bottom-nav">
        <div class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="camera">
            <i data-lucide="camera"></i>
            <span>Kamera</span>
        </div>
        <div class="nav-item" data-page="register">
            <i data-lucide="user-plus"></i>
            <span>Daftar</span>
        </div>
        <div class="nav-item" data-page="attendance">
            <i data-lucide="clipboard-list"></i>
            <span>Rekod</span>
        </div>
        <div class="nav-item" data-page="users">
            <i data-lucide="users"></i>
            <span>Pengguna</span>
        </div>
    </div>

    <script>
        // Data variables
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlertCount = 0;
        let isCameraActive = false;
        let videoStream = null;
        let detectionInterval = null;
        let modelsLoaded = false;
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let faceDetectionReady = false;

        // Helper Functions
        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(str) { 
            return String(str).replace(/[&<>]/g, function(m) { 
                if (m === '&') return '&amp;'; 
                if (m === '<') return '&lt;'; 
                if (m === '>') return '&gt;'; 
                return m; 
            }); 
        }

        // SweetAlert functions
        async function showSuccessAlert(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'success',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showErrorAlert(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'error',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showWarningAlert(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'warning',
                confirmButtonColor: '#FF9500',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showInfoAlert(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'info',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showLoadingAlert(title, message) {
            Swal.fire({
                title: title,
                text: message,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            return Swal;
        }

        // Load/Save from localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('smartclass_users');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            const savedAttendance = localStorage.getItem('smartclass_attendance');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            const savedAlerts = localStorage.getItem('smartclass_stranger_count');
            if (savedAlerts) strangerAlertCount = parseInt(savedAlerts);
            updateAllStats();
        }

        function saveUsers() {
            localStorage.setItem('smartclass_users', JSON.stringify(registeredUsers));
            updateAllStats();
        }

        function saveAttendance() {
            localStorage.setItem('smartclass_attendance', JSON.stringify(attendanceRecords));
            updateAllStats();
        }

        function saveStrangerCount() {
            localStorage.setItem('smartclass_stranger_count', strangerAlertCount);
        }

        function updateAllStats() {
            if (currentPage === 'dashboard') renderDashboard();
            if (currentPage === 'attendance') renderAttendanceTable();
            if (currentPage === 'users') renderUsersTable();
        }

        // Mark Attendance
        function markAttendance(user) {
            const today = getTodayDate();
            const alreadyLogged = attendanceRecords.find(rec => rec.id === user.id && rec.date === today);
            if (!alreadyLogged) {
                const now = new Date();
                const hour = now.getHours();
                const minute = now.getMinutes();
                const timeValue = hour * 60 + minute;
                const status = timeValue > 510 ? (timeValue > 540 ? 'Lewat' : 'Hadir') : 'Hadir';
                
                attendanceRecords.push({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    className: user.className,
                    status: status,
                    time: getCurrentTime(),
                    date: today,
                    timestamp: Date.now()
                });
                saveAttendance();
                
                // SweetAlert notification for attendance
                Swal.fire({
                    title: '✅ Kehadiran Dicatat!',
                    html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${status}<br>Masa: ${getCurrentTime()}`,
                    icon: 'success',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    background: 'white',
                    borderRadius: '16px'
                });
            }
        }

        // Stranger Alert
        function showStrangerAlert() {
            strangerAlertCount++;
            saveStrangerCount();
            
            // SweetAlert for stranger
            Swal.fire({
                title: '⚠️ Amaran Keselamatan!',
                html: 'Wajah asing telah dikesan di dalam kelas!<br>Sistem akan merekodkan kejadian ini.',
                icon: 'warning',
                confirmButtonColor: '#FF3B30',
                confirmButtonText: 'OK, Faham',
                background: 'white',
                borderRadius: '20px',
                timer: 5000,
                timerProgressBar: true
            });
            
            if ('vibrate' in navigator) navigator.vibrate(200);
            updateAllStats();
        }

        // ==================== FACE RECOGNITION ====================
        async function loadFaceModels() {
            const loadingAlert = await showLoadingAlert('Memuatkan Model...', 'Sistem sedang memuatkan model face recognition. Sila tunggu sebentar.');
            
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                modelsLoaded = true;
                faceDetectionReady = true;
                
                Swal.close();
                await showSuccessAlert('✅ Model Sedia!', 'Face recognition system telah sedia digunakan.');
                console.log('Face models loaded');
                return true;
            } catch (err) {
                Swal.close();
                console.error(err);
                await showErrorAlert('Ralat Model', 'Gagal memuatkan model face recognition. Sila muat semula halaman.');
                return false;
            }
        }

        async function initGlobalCamera() {
            if (videoStream) return true;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                videoStream = stream;
                
                const videos = document.querySelectorAll('.camera-video');
                videos.forEach(video => {
                    video.srcObject = stream;
                    video.play().catch(e => console.log(e));
                });
                
                isCameraActive = true;
                
                if (!modelsLoaded) {
                    await loadFaceModels();
                }
                
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(runGlobalFaceDetection, 500);
                
                const statusEl = document.getElementById('cameraStatus');
                if (statusEl) {
                    statusEl.innerHTML = '● Kamera Aktif - Sedia mengesan wajah';
                    statusEl.className = 'camera-status status-active';
                }
                
                return true;
            } catch(err) {
                console.error(err);
                isCameraActive = false;
                const statusEl = document.getElementById('cameraStatus');
                if (statusEl) {
                    statusEl.innerHTML = '⚠️ Kamera tidak dapat diakses. Sila berikan kebenaran kamera.';
                    statusEl.className = 'camera-status status-error';
                }
                await showErrorAlert('Ralat Kamera', 'Kamera tidak dapat diakses. Sila pastikan anda memberi kebenaran kamera.');
                return false;
            }
        }

        async function runGlobalFaceDetection() {
            if (!isCameraActive || !modelsLoaded || !faceDetectionReady) return;
            
            const video = document.getElementById('globalVideoFeed');
            if (!video || !video.videoWidth || video.videoWidth === 0) return;
            
            // Update canvas size
            const canvases = document.querySelectorAll('.face-canvas');
            canvases.forEach(canvas => {
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            });
            
            try {
                const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options())
                    .withFaceLandmarks()
                    .withFaceDescriptors();
                
                let recognizedCount = 0;
                
                for (const detection of detections) {
                    let bestMatch = null;
                    let bestDistance = 0.55;
                    
                    for (const user of registeredUsers) {
                        if (user.descriptor) {
                            const distance = faceapi.euclideanDistance(detection.descriptor, user.descriptor);
                            if (distance < bestDistance) {
                                bestDistance = distance;
                                bestMatch = user;
                            }
                        }
                    }
                    
                    // Draw on all canvases
                    canvases.forEach(canvas => {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        
                        const box = detection.detection.box;
                        ctx.beginPath();
                        ctx.rect(box.x, box.y, box.width, box.height);
                        
                        if (bestMatch) {
                            ctx.strokeStyle = '#34C759';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                            ctx.fillStyle = '#34C759';
                            ctx.font = 'bold 14px system-ui';
                            ctx.fillText(`${bestMatch.name}`, box.x, box.y - 5);
                            markAttendance(bestMatch);
                            recognizedCount++;
                        } else {
                            ctx.strokeStyle = '#FF3B30';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                            ctx.fillStyle = '#FF3B30';
                            ctx.font = 'bold 14px system-ui';
                            ctx.fillText('Wajah Asing!', box.x, box.y - 5);
                        }
                    });
                }
                
                // Clear canvases if no faces
                if (detections.length === 0) {
                    canvases.forEach(canvas => {
                        const ctx = canvas?.getContext('2d');
                        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
                    });
                }
                
                // Update detection indicator
                const indicator = document.getElementById('detectionIndicator');
                if (indicator) {
                    indicator.innerHTML = detections.length > 0 ? `👤 ${detections.length} wajah dikesan` : '👤 Tiada wajah';
                }
                
                const unknownCount = detections.length - recognizedCount;
                if (unknownCount > 0 && (!window.lastAlertTime || Date.now() - window.lastAlertTime > 10000)) {
                    showStrangerAlert();
                    window.lastAlertTime = Date.now();
                }
                
                // Update status if faces detected
                if (detections.length > 0 && currentPage === 'register') {
                    const statusEl = document.getElementById('cameraStatus');
                    if (statusEl) {
                        statusEl.innerHTML = `✅ ${detections.length} wajah dikesan! Sedia untuk daftar.`;
                        statusEl.className = 'camera-status status-active';
                    }
                }
                
            } catch(err) {
                console.error('Detection error:', err);
            }
        }

        // Register Face function with SweetAlert
        async function registerFace() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClass').value.trim();
            
            if (!name) {
                await showErrorAlert('❌ Ralat', 'Sila masukkan nama penuh.');
                return;
            }
            
            if (!isCameraActive || !videoStream) {
                await showErrorAlert('❌ Ralat Kamera', 'Kamera belum aktif. Sila pergi ke tab Kamera dahulu.');
                return;
            }
            
            if (!modelsLoaded || !faceDetectionReady) {
                await showWarningAlert('⚠️ Memuatkan Model', 'Sistem sedang memuatkan model. Sila tunggu sebentar.');
                return;
            }
            
            const video = document.getElementById('globalVideoFeed');
            if (!video || !video.videoWidth) {
                await showErrorAlert('❌ Ralat', 'Kamera belum sedia. Pastikan kamera berfungsi.');
                return;
            }
            
            const loadingAlert = await showLoadingAlert('Mendaftar Wajah...', 'Sistem sedang memproses wajah anda.');
            
            try {
                const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                Swal.close();
                
                if (!detection) {
                    await showErrorAlert('❌ Tiada Wajah Dikesan', 
                        'Sistem tidak dapat mengesan wajah anda.\n\nPastikan:\n✓ Muka anda jelas dalam frame\n✓ Pencahayaan mencukupi\n✓ Tiada objek menutup muka\n✓ Kamera sedang berfungsi');
                    return;
                }
                
                const newUser = {
                    id: Date.now().toString(),
                    name: name,
                    role: role,
                    className: className || '-',
                    descriptor: Array.from(detection.descriptor),
                    registeredAt: new Date().toISOString()
                };
                
                registeredUsers.push(newUser);
                saveUsers();
                
                await showSuccessAlert('✅ Pendaftaran Berjaya!', 
                    `${name} telah berjaya didaftarkan sebagai ${role === 'teacher' ? 'Guru' : 'Pelajar'}.\n\nKelas: ${className || '-'}`);
                
                document.getElementById('regName').value = '';
                document.getElementById('regClass').value = '';
                renderUsersTable();
                
            } catch(err) {
                Swal.close();
                console.error(err);
                await showErrorAlert('❌ Ralat', 'Terjadi ralat semasa pendaftaran. Sila cuba lagi.');
            }
        }

        // Clock update
        function updateClock() {
            document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==================== RENDER FUNCTIONS ====================
        function renderDashboard() {
            const today = getTodayDate();
            const todayAttendance = attendanceRecords.filter(r => r.date === today).length;
            const totalStudents = registeredUsers.filter(u => u.role === 'student').length;
            const totalTeachers = registeredUsers.filter(u => u.role === 'teacher').length;
            const presentToday = attendanceRecords.filter(r => r.date === today && r.status === 'Hadir').length;
            const lateToday = attendanceRecords.filter(r => r.date === today && r.status === 'Lewat').length;
            
            const html = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-info"><h3>Pengguna</h3><div class="stat-number">${registeredUsers.length}</div></div><div class="stat-icon"><i data-lucide="users"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir Hari Ini</h3><div class="stat-number">${todayAttendance}</div></div><div class="stat-icon"><i data-lucide="check-circle"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Pelajar</h3><div class="stat-number">${totalStudents}</div></div><div class="stat-icon"><i data-lucide="graduation-cap"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Guru</h3><div class="stat-number">${totalTeachers}</div></div><div class="stat-icon"><i data-lucide="chalkboard"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir</h3><div class="stat-number">${presentToday}</div></div><div class="stat-icon"><i data-lucide="smile"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Lewat</h3><div class="stat-number">${lateToday}</div></div><div class="stat-icon"><i data-lucide="clock"></i></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i data-lucide="pie-chart"></i> Kehadiran Hari Ini</h3><canvas id="attendanceChartCanvas"></canvas></div>
                </div>
                <div class="data-table"><h3>📋 Kehadiran Terkini</h3><div class="table-container"><table><thead><td><th>Nama</th><th>Status</th><th>Masa</th></thead><tbody>${attendanceRecords.slice(-8).reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="3">Tiada rekod</td></tr>'}</tbody></table></div></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const ctx = document.getElementById('attendanceChartCanvas')?.getContext('2d');
            if (ctx && attendanceChart) attendanceChart.destroy();
            if (ctx) {
                attendanceChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Hadir', 'Lewat'], datasets: [{ data: [presentToday, lateToday], backgroundColor: ['#34C759', '#FF9500'] }] } });
            }
        }

        function renderCameraPage() {
            const html = `
                <div class="camera-section">
                    <div class="camera-container">
                        <video id="globalVideoFeed" class="camera-video" autoplay playsinline></video>
                        <canvas id="cameraCanvas" class="face-canvas"></canvas>
                        <div class="detection-indicator" id="detectionIndicator">👤 Menunggu wajah</div>
                    </div>
                    <div class="camera-status" id="cameraStatus">● Mengaktifkan kamera...</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="info"></i> Maklumat Sistem</h3>
                    <p style="font-size: 13px;">✓ Wajah berdaftar akan auto rekod kehadiran<br>✓ Wajah asing akan trigger amaran<br>✓ Pastikan pencahayaan cukup<br>✓ Hadapkan muka terus ke kamera</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            if (videoStream) {
                const video = document.getElementById('globalVideoFeed');
                video.srcObject = videoStream;
                video.play().catch(e => console.log(e));
            }
            
            const canvas = document.getElementById('cameraCanvas');
            if (canvas && videoStream) {
                const video = document.getElementById('globalVideoFeed');
                const updateSize = () => {
                    if (video.videoWidth) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }
                };
                video.addEventListener('loadedmetadata', updateSize);
                setTimeout(updateSize, 100);
            }
        }

        function renderRegisterPage() {
            const html = `
                <div class="camera-section">
                    <h3><i data-lucide="camera"></i> Preview Kamera</h3>
                    <div class="camera-container" style="aspect-ratio: 16/9;">
                        <video id="globalVideoFeed" class="camera-video" autoplay playsinline></video>
                        <canvas id="registerCanvas" class="face-canvas"></canvas>
                        <div class="detection-indicator" id="detectionIndicator">👤 Menunggu wajah</div>
                    </div>
                    <div class="camera-status" id="cameraStatus">● Pastikan muka jelas dalam frame</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="user-plus"></i> Daftar Wajah Baru</h3>
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Nama Penuh *">
                        <select id="regRole">
                            <option value="student">👨‍🎓 Pelajar</option>
                            <option value="teacher">👩‍🏫 Guru</option>
                        </select>
                        <input type="text" id="regClass" placeholder="Kelas (cth: 5A)">
                        <button class="btn btn-success" id="registerFaceBtn"><i data-lucide="camera"></i> Tangkap & Daftar Wajah</button>
                    </div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="users"></i> Senarai Pengguna Berdaftar</h3>
                    <div class="table-container" id="usersTableContainer"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            if (videoStream) {
                const video = document.getElementById('globalVideoFeed');
                video.srcObject = videoStream;
                video.play().catch(e => console.log(e));
            }
            
            const canvas = document.getElementById('registerCanvas');
            if (canvas && videoStream) {
                const video = document.getElementById('globalVideoFeed');
                const updateSize = () => {
                    if (video.videoWidth) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }
                };
                video.addEventListener('loadedmetadata', updateSize);
                setTimeout(updateSize, 100);
            }
            
            document.getElementById('registerFaceBtn').onclick = registerFace;
            renderUsersTable();
        }

        function renderUsersTable() {
            const container = document.getElementById('usersTableContainer');
            if (!container) return;
            container.innerHTML = `<table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Guru' : 'Pelajar'}</span></td><td>${escapeHtml(u.className)}</td></tr>`).join('') || '<tr><td colspan="3">Tiada pengguna berdaftar</td></tr>'}</tbody></table>`;
            lucide.createIcons();
        }

        function renderAttendanceTable() {
            const today = getTodayDate();
            const filtered = attendanceRecords.filter(r => r.date === today);
            const html = `
                <div class="data-table">
                    <h3>📋 Kehadiran Hari Ini (${today})</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>Status</th><th>Masa</th></thead><tbody>${filtered.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.role === 'teacher' ? 'Guru' : 'Pelajar'}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="5">Tiada kehadiran hari ini</td></tr>'}</tbody></table></div>
                </div>
                <div class="data-table">
                    <h3>📜 Semua Rekod Kehadiran</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Status</th><th>Tarikh</th><th>Masa</th></thead><tbody>${attendanceRecords.slice().reverse().slice(0, 20).map(r => `<tr><td>${escapeHtml(r.name)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></table>`).join('') || '<tr><td colspan="4">Tiada rekod</td></tr>'}</tbody></table></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            
            if (page === 'dashboard') renderDashboard();
            else if (page === 'camera') renderCameraPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'attendance') renderAttendanceTable();
            else if (page === 'users') renderUsersTable();
        }

        // Event Listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });

        // Initialize
        async function init() {
            loadData();
            await initGlobalCamera();
            renderDashboard();
            lucide.createIcons();
            
            // Show welcome message
            setTimeout(() => {
                showInfoAlert('👋 Selamat Datang', 'Sistem keselamatan kelas pintar sedia digunakan.\n\n✓ Daftar wajah di tab "Daftar"\n✓ Kamera akan auto rekod kehadiran');
            }, 1000);
        }
        
        init();
    </script>
</body>
</html>
