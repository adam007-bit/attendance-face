<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Class - QR Attendance System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
        }

        .header-left h1 {
            font-size: 18px;
            margin: 0;
        }

        .live-clock {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            font-family: monospace;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .nav-item i {
            width: 24px;
            height: 24px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .main-content {
            padding: 16px 16px 80px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-info h3 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        .qr-scanner-section, .camera-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .qr-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1;
        }

        #qr-reader {
            width: 100%;
            height: 100%;
        }

        .data-table {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .data-table h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #E3F2FD; color: #1565C0; }
        .badge-student { background: #F3E5F5; color: #6A1B9A; }

        .register-form input, .register-form select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }

        .btn:active { transform: scale(0.97); }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
        }

        canvas {
            max-height: 200px;
        }

        .qr-code-display {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 20px;
        }

        .qr-code-display canvas {
            max-width: 200px;
            margin: 0 auto;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div>
                <h1>Smart Class</h1>
                <p style="font-size: 10px; color: var(--text-secondary);">QR Code Attendance</p>
            </div>
        </div>
        <div class="live-clock">
            <span id="currentTime">--:--:--</span>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>

    <div class="bottom-nav">
        <div class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="scanner">
            <i data-lucide="qr-code"></i>
            <span>Imbas QR</span>
        </div>
        <div class="nav-item" data-page="register">
            <i data-lucide="user-plus"></i>
            <span>Daftar</span>
        </div>
        <div class="nav-item" data-page="attendance">
            <i data-lucide="clipboard-list"></i>
            <span>Rekod</span>
        </div>
        <div class="nav-item" data-page="users">
            <i data-lucide="users"></i>
            <span>Pengguna</span>
        </div>
    </div>

    <script>
        // Data variables
        let registeredUsers = [];
        let attendanceRecords = [];
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let html5QrCode = null;
        let isScanning = false;

        // Helper Functions
        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(str) { 
            return String(str).replace(/[&<>]/g, function(m) { 
                if (m === '&') return '&amp;'; 
                if (m === '<') return '&lt;'; 
                if (m === '>') return '&gt;'; 
                return m; 
            }); 
        }

        // SweetAlert functions
        async function showSuccess(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'success',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showError(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'error',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        async function showInfo(title, message) {
            await Swal.fire({
                title: title,
                text: message,
                icon: 'info',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
        }

        // Load/Save from localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('smartclass_users_qr');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            const savedAttendance = localStorage.getItem('smartclass_attendance_qr');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            updateAllStats();
        }

        function saveUsers() {
            localStorage.setItem('smartclass_users_qr', JSON.stringify(registeredUsers));
            updateAllStats();
        }

        function saveAttendance() {
            localStorage.setItem('smartclass_attendance_qr', JSON.stringify(attendanceRecords));
            updateAllStats();
        }

        function updateAllStats() {
            if (currentPage === 'dashboard') renderDashboard();
            if (currentPage === 'attendance') renderAttendanceTable();
            if (currentPage === 'users') renderUsersTable();
        }

        // Generate QR Code for user
        function generateQRCodeForUser(user) {
            const qrData = JSON.stringify({
                id: user.id,
                name: user.name,
                role: user.role,
                className: user.className,
                timestamp: Date.now()
            });
            return qrData;
        }

        // Process QR scan
        async function processQRScan(decodedText) {
            if (!decodedText) return;
            
            try {
                const qrData = JSON.parse(decodedText);
                const user = registeredUsers.find(u => u.id === qrData.id);
                
                if (!user) {
                    await showError('❌ Pengguna Tidak Dikenali', 'QR Code ini tidak berdaftar dalam sistem.');
                    return;
                }
                
                const today = getTodayDate();
                const alreadyLogged = attendanceRecords.find(rec => rec.id === user.id && rec.date === today);
                
                if (alreadyLogged) {
                    await showError('⚠️ Kehadiran Dicatat Sebelum Ini', `${user.name} sudah mencatat kehadiran hari ini pada ${alreadyLogged.time}.`);
                    return;
                }
                
                const now = new Date();
                const hour = now.getHours();
                const minute = now.getMinutes();
                const timeValue = hour * 60 + minute;
                const status = timeValue > 510 ? (timeValue > 540 ? 'Lewat' : 'Hadir') : 'Hadir';
                
                attendanceRecords.push({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    className: user.className,
                    status: status,
                    time: getCurrentTime(),
                    date: today,
                    timestamp: Date.now()
                });
                saveAttendance();
                
                // Play beep
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 880;
                    gain.gain.value = 0.2;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                    setTimeout(() => osc.stop(), 300);
                } catch(e) {}
                
                if ('vibrate' in navigator) navigator.vibrate(100);
                
                await Swal.fire({
                    title: '✅ Kehadiran Dicatat!',
                    html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${status}<br>Masa: ${getCurrentTime()}<br>Tarikh: ${today}`,
                    icon: 'success',
                    confirmButtonColor: '#007AFF',
                    confirmButtonText: 'OK',
                    background: 'white',
                    borderRadius: '20px'
                });
                
                updateAllStats();
                
            } catch(err) {
                await showError('QR Code Tidak Sah', 'Format QR Code tidak dikenali.');
            }
        }

        // Start QR Scanner
        async function startQRScanner() {
            if (isScanning) return;
            
            const qrContainer = document.getElementById('qr-reader');
            if (!qrContainer) return;
            
            try {
                html5QrCode = new Html5Qrcode("qr-reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 },
                        aspectRatio: 1
                    },
                    (decodedText) => {
                        if (decodedText && !window.isProcessingQR) {
                            window.isProcessingQR = true;
                            processQRScan(decodedText);
                            setTimeout(() => { window.isProcessingQR = false; }, 2000);
                        }
                    },
                    (error) => {
                        // Silent error
                    }
                );
                isScanning = true;
                const statusEl = document.getElementById('scannerStatus');
                if (statusEl) statusEl.innerHTML = '● Scanner aktif - Hala QR Code ke kamera';
            } catch(err) {
                console.error(err);
                await showError('Ralat Kamera', 'Kamera tidak dapat diakses. Sila berikan kebenaran kamera.');
            }
        }

        function stopQRScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().catch(e => console.log(e));
                isScanning = false;
            }
        }

        // Clock update
        function updateClock() {
            document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Register User (with QR)
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClass').value.trim();
            
            if (!name) {
                await showError('❌ Ralat', 'Sila masukkan nama penuh.');
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                name: name,
                role: role,
                className: className || '-',
                registeredAt: new Date().toISOString()
            };
            
            registeredUsers.push(newUser);
            saveUsers();
            
            const qrData = generateQRCodeForUser(newUser);
            
            await Swal.fire({
                title: '✅ Pendaftaran Berjaya!',
                html: `${escapeHtml(name)} telah didaftarkan.<br><br>Sila ambil gambar QR Code ini untuk kegunaan hadapan.`,
                icon: 'success',
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'OK',
                background: 'white',
                borderRadius: '20px'
            });
            
            document.getElementById('regName').value = '';
            document.getElementById('regClass').value = '';
            renderUsersTable();
        }

        // Show user's QR Code
        async function showUserQR(user) {
            const qrData = generateQRCodeForUser(user);
            
            // Simple QR display using canvas
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h3>QR Code - ${escapeHtml(user.name)}</h3>
                    <div id="tempQR" style="display: flex; justify-content: center; margin: 20px 0;"></div>
                    <p style="color: gray; font-size: 12px;">Gunakan QR Code ini untuk mencatat kehadiran</p>
                </div>
            `;
            
            Swal.fire({
                title: 'QR Code Pengguna',
                html: tempDiv.innerHTML,
                confirmButtonColor: '#007AFF',
                confirmButtonText: 'Tutup',
                background: 'white',
                borderRadius: '20px',
                didOpen: () => {
                    // Create simple QR using canvas (without external library)
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, 200, 200);
                    ctx.fillStyle = 'black';
                    ctx.font = '12px monospace';
                    ctx.fillText(qrData.substring(0, 50), 20, 100);
                    ctx.fillText('...', 20, 120);
                    document.getElementById('tempQR').appendChild(canvas);
                }
            });
        }

        // ==================== RENDER FUNCTIONS ====================
        function renderDashboard() {
            const today = getTodayDate();
            const todayAttendance = attendanceRecords.filter(r => r.date === today).length;
            const totalStudents = registeredUsers.filter(u => u.role === 'student').length;
            const totalTeachers = registeredUsers.filter(u => u.role === 'teacher').length;
            const presentToday = attendanceRecords.filter(r => r.date === today && r.status === 'Hadir').length;
            const lateToday = attendanceRecords.filter(r => r.date === today && r.status === 'Lewat').length;
            
            const html = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-info"><h3>Pengguna</h3><div class="stat-number">${registeredUsers.length}</div></div><div class="stat-icon"><i data-lucide="users"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir Hari Ini</h3><div class="stat-number">${todayAttendance}</div></div><div class="stat-icon"><i data-lucide="check-circle"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Pelajar</h3><div class="stat-number">${totalStudents}</div></div><div class="stat-icon"><i data-lucide="graduation-cap"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Guru</h3><div class="stat-number">${totalTeachers}</div></div><div class="stat-icon"><i data-lucide="chalkboard"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir</h3><div class="stat-number">${presentToday}</div></div><div class="stat-icon"><i data-lucide="smile"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Lewat</h3><div class="stat-number">${lateToday}</div></div><div class="stat-icon"><i data-lucide="clock"></i></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i data-lucide="pie-chart"></i> Kehadiran Hari Ini</h3><canvas id="attendanceChartCanvas"></canvas></div>
                </div>
                <div class="data-table"><h3><i data-lucide="qr-code"></i> Cara Penggunaan</h3>
                    <p style="font-size: 13px; line-height: 1.5;">1. Pergi ke tab <strong>"Daftar"</strong> untuk daftar pengguna baru<br>
                    2. Setiap pengguna akan dapat <strong>QR Code unik</strong><br>
                    3. Pergi ke tab <strong>"Imbas QR"</strong> dan scan QR Code<br>
                    4. Sistem akan catat kehadiran secara automatik<br>
                    5. Semak rekod di tab <strong>"Rekod"</strong></p>
                </div>
                <div class="data-table"><h3>📋 Kehadiran Terkini</h3><div class="table-container"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Status</th><th>Masa</th></thead><tbody>${attendanceRecords.slice(-8).reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="4">Tiada rekod</td></tr>'}</tbody></table></div></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const ctx = document.getElementById('attendanceChartCanvas')?.getContext('2d');
            if (ctx && attendanceChart) attendanceChart.destroy();
            if (ctx) {
                attendanceChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Hadir', 'Lewat'], datasets: [{ data: [presentToday, lateToday], backgroundColor: ['#34C759', '#FF9500'] }] } });
            }
        }

        function renderScannerPage() {
            const html = `
                <div class="qr-scanner-section">
                    <h3><i data-lucide="qr-code"></i> Imbas QR Code</h3>
                    <div class="qr-container" id="qr-reader"></div>
                    <div class="camera-status" id="scannerStatus" style="margin-top: 12px; text-align: center;">● Memulakan scanner...</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="info"></i> Cara Imbas</h3>
                    <p style="font-size: 13px;">✓ Hala kamera ke QR Code<br>✓ Pastikan pencahayaan cukup<br>✓ Sistem akan auto rekod kehadiran</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            setTimeout(() => startQRScanner(), 100);
        }

        function renderRegisterPage() {
            const html = `
                <div class="data-table">
                    <h3><i data-lucide="user-plus"></i> Daftar Pengguna Baru</h3>
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Nama Penuh *">
                        <select id="regRole">
                            <option value="student">👨‍🎓 Pelajar</option>
                            <option value="teacher">👩‍🏫 Guru</option>
                        </select>
                        <input type="text" id="regClass" placeholder="Kelas (cth: 5A)">
                        <button class="btn btn-success" id="registerBtn"><i data-lucide="save"></i> Daftar & Jana QR</button>
                    </div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="users"></i> Senarai Pengguna</h3>
                    <div class="table-container" id="usersTableContainer"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.getElementById('registerBtn').onclick = registerUser;
            renderUsersTable();
        }

        function renderUsersTable() {
            const container = document.getElementById('usersTableContainer');
            if (!container) return;
            container.innerHTML = `<table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>Tindakan</th></thead><tbody>${registeredUsers.map(u => `
                <tr>
                    <td>${escapeHtml(u.name)}</td>
                    <td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Guru' : 'Pelajar'}</span></td>
                    <td>${escapeHtml(u.className)}</td>
                    <td><button class="btn-qr-${u.id}" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i data-lucide="qr-code"></i></button></td>
                </tr>
            `).join('') || '<tr><td colspan="4">Tiada pengguna berdaftar</td></tr>'}</tbody></table>`;
            lucide.createIcons();
            
            registeredUsers.forEach(user => {
                const btn = document.querySelector(`.btn-qr-${user.id}`);
                if (btn) {
                    btn.onclick = () => showUserQR(user);
                }
            });
        }

        function renderAttendanceTable() {
            const today = getTodayDate();
            const filtered = attendanceRecords.filter(r => r.date === today);
            const html = `
                <div class="data-table">
                    <h3>📋 Kehadiran Hari Ini (${today})</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>Status</th><th>Masa</th></thead><tbody>${filtered.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.role === 'teacher' ? 'Guru' : 'Pelajar'}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="5">Tiada kehadiran hari ini</td></tr>'}</tbody></table></div>
                </div>
                <div class="data-table">
                    <h3>📜 Semua Rekod Kehadiran</h3>
                    <div class="table-container"><tr><thead><tr><th>Nama</th><th>Kelas</th><th>Status</th><th>Tarikh</th><th>Masa</th></thead><tbody>${attendanceRecords.slice().reverse().slice(0, 30).map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="5">Tiada rekod</td></tr>'}</tbody>}</div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            
            if (page !== 'scanner') {
                stopQRScanner();
            }
            
            if (page === 'dashboard') renderDashboard();
            else if (page === 'scanner') renderScannerPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'attendance') renderAttendanceTable();
            else if (page === 'users') renderUsersTable();
        }

        // Event Listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });

        // Initialize
        loadData();
        renderDashboard();
        lucide.createIcons();
        
        setTimeout(() => {
            showInfo('👋 Selamat Datang', 'Sistem Kehadiran QR Code\n\n✓ Daftar pengguna di tab "Daftar"\n✓ Setiap pengguna dapat QR Code\n✓ Scan QR untuk catat kehadiran');
        }, 1000);
    </script>
</body>
</html>
