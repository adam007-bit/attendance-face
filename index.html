<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SmartClass Pro - AI Face Recognition System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #007AFF;
            --primary-light: #5E9EFF;
            --primary-dark: #0055CC;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --purple: #AF52DE;
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius-sm: 16px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 40px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Animated Gradient Background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Modern Header */
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left img {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .icon-btn:active {
            transform: scale(0.94);
            background: var(--border);
        }

        .live-clock {
            background: var(--bg);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 6px 16px 6px 12px;
            border-radius: 30px;
        }

        .logout-btn {
            background: rgba(255,59,48,0.15);
            color: var(--danger);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:active {
            transform: scale(0.95);
            background: rgba(255,59,48,0.25);
        }

        /* Bottom Navigation - Modern */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            padding: 8px 16px;
            z-index: 100;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item i {
            width: 22px;
            height: 22px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .main-content {
            padding: 20px 16px 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats Cards - Modern */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 18px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .stat-card:active {
            transform: scale(0.98);
        }

        .stat-info h3 {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        /* Camera Section - Modern */
        .camera-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #securityVideo, #registerVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .qr-container {
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 1;
            max-width: 300px;
            margin: 0 auto;
        }

        #qr-reader {
            width: 100%;
            height: 100%;
        }

        .camera-status {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .status-active {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .status-detecting {
            background: #E3F2FD;
            color: #1565C0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Data Tables - Modern */
        .data-table {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .data-table h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #E3F2FD; color: #1565C0; }
        .badge-student { background: #F3E5F5; color: #6A1B9A; }

        /* Buttons */
        .btn {
            padding: 14px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
            font-size: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-secondary {
            background: #8E8E93;
            color: white;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Form Elements */
        .register-form input, .register-form select {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .register-form input:focus, .register-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
        }

        /* Chart Card */
        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .chart-card h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        canvas {
            max-height: 200px;
        }

        /* Search & Filter */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-bar input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 14px;
        }

        .date-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .date-filter input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
        }

        /* Danger Banner */
        .danger-banner {
            background: #FFEBEE;
            border-left: 4px solid var(--danger);
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .stranger-image {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--danger);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .edit-btn { color: var(--primary); }
        .delete-btn { color: var(--danger); }

        .edit-btn:hover, .delete-btn:hover {
            background: var(--bg);
        }

        /* Step Indicator */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step-number {
            width: 44px;
            height: 44px;
            border-radius: 44px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: var(--text-secondary);
        }

        .step.active .step-number {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        .step.completed .step-number {
            background: var(--success);
            color: white;
        }

        .step-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .step.active .step-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* Camera Selector */
        .camera-selector {
            margin-bottom: 16px;
        }

        .camera-selector select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 14px;
        }

        /* Class Selector */
        .class-selector {
            margin-bottom: 16px;
        }

        .class-selector select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 14px;
        }

        /* Detection Indicator */
        .detection-indicator {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: white;
            z-index: 10;
            font-weight: 500;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 56px;
            padding: 40px 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .login-card img {
            width: 70px;
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 16px;
        }

        /* Info Box */
        .info-box {
            background: #E3F2FD;
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <h2 style="margin-bottom: 8px;">SmartClass Pro</h2>
            <p style="margin-bottom: 24px; color: var(--text-secondary);">AI Face Recognition System</p>
            <input type="text" id="loginUsername" placeholder="Nama Pengguna">
            <input type="password" id="loginPassword" placeholder="Kata Laluan">
            <button class="btn btn-primary" id="loginBtn">Log Masuk</button>
            <p style="margin-top: 20px; font-size: 12px; color: var(--text-secondary);">Demo: admin / admin123</p>
        </div>
    </div>

    <div class="header" id="mainHeader" style="display: none;">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div>
                <h1>SmartClass Pro</h1>
                <p>AI Face Recognition • Auto Attendance</p>
            </div>
        </div>
        <div class="header-right">
            <div class="user-badge">
                <i data-lucide="user" style="width: 16px; height: 16px;"></i>
                <span id="userName" style="font-weight: 500; font-size: 13px;">Admin</span>
            </div>
            <button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i></button>
            <div class="live-clock"><span id="currentTime">--:--:--</span></div>
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;"></div>

    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></div>
        <div class="nav-item" data-page="security"><i data-lucide="shield-check"></i><span>Security</span></div>
        <div class="nav-item" data-page="qrcode"><i data-lucide="qr-code"></i><span>QR Scan</span></div>
        <div class="nav-item" data-page="register"><i data-lucide="user-plus"></i><span>Register</span></div>
        <div class="nav-item" data-page="records"><i data-lucide="clipboard-list"></i><span>Records</span></div>
    </div>

    <script>
        // ==================== LOGIN SYSTEM ====================
        let currentUser = null;
        const validUsers = [
            { username: "admin", password: "admin123", role: "admin", name: "Admin" },
            { username: "guru", password: "guru123", role: "teacher", name: "Cikgu Ahmad" }
        ];
        
        // ==================== DATA STORAGE ====================
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlerts = [];
        let selectedClass = "Semua Kelas";
        let availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];
        let currentPage = 'dashboard';
        let attendanceChart = null;
        let registerStep = 1;
        let pendingRegistration = null;
        let currentPageNum = 1;
        let itemsPerPage = 10;
        let searchQuery = "";
        let startDate = "";
        let endDate = "";
        
        // Camera variables
        let securityStream = null;
        let registerStream = null;
        let securityInterval = null;
        let isSecurityActive = false;
        let currentCameraId = 'user';
        
        // Face recognition
        let modelsLoaded = false;
        let faceMatcher = null;
        let html5QrCode = null;
        let isScanning = false;
        
        let audioCtx = null;
        let lastStrangerAlertTime = 0;
        let lastAttendanceTime = {};
        
        // Detection tracking untuk elak double record
        let processingAttendance = {};
        
        const DETECTION_INTERVAL = 150; // 6-7x per second (smooth)
        const INPUT_SIZE = 320;
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // ==================== HELPER FUNCTIONS ====================
        function loadLocal() {
            const u = localStorage.getItem('smart_users'); if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('smart_attendance'); if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('smart_strangers'); if (s) strangerAlerts = JSON.parse(s);
            const c = localStorage.getItem('smart_class'); if (c) selectedClass = c;
            const d = localStorage.getItem('smart_descriptors');
            if (d) { const desc = JSON.parse(d); registeredUsers.forEach(u => { if (desc[u.id]) u.descriptor = desc[u.id]; }); }
        }
        
        function saveLocal() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({ id: u.id, name: u.name, role: u.role, className: u.className, registeredAt: u.registeredAt }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {}; registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
            localStorage.setItem('smart_class', selectedClass);
        }
        
        async function syncToFirebase() {
            try {
                for (const u of registeredUsers) { const data = { ...u }; delete data.descriptor; await db.collection('users').doc(u.id).set(data, { merge: true }); }
                for (const a of attendanceRecords) await db.collection('attendance').doc(`${a.id}_${a.date}_${a.session}`).set(a, { merge: true });
                for (const s of strangerAlerts) await db.collection('strangers').doc(s.id.toString()).set(s, { merge: true });
            } catch(e) { console.error(e); }
        }
        
        async function loadFromFirebase() {
            try {
                const u = await db.collection('users').get(); u.forEach(d => { if (!registeredUsers.find(x => x.id === d.id)) registeredUsers.push(d.data()); });
                const a = await db.collection('attendance').get(); a.forEach(d => { if (!attendanceRecords.find(x => x.id === d.data().id && x.date === d.data().date)) attendanceRecords.push(d.data()); });
                const s = await db.collection('strangers').get(); s.forEach(d => { if (!strangerAlerts.find(x => x.id === d.data().id)) strangerAlerts.push(d.data()); });
                saveLocal(); updateUI();
            } catch(e) { console.error(e); }
        }
        
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }
        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }
        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
        
        async function showSuccess(t, m) { await Swal.fire({ title: t, text: m, icon: 'success', confirmButtonColor: '#007AFF', borderRadius: '24px' }); }
        async function showError(t, m) { await Swal.fire({ title: t, text: m, icon: 'error', confirmButtonColor: '#007AFF', borderRadius: '24px' }); }
        async function showInfo(t, m) { await Swal.fire({ title: t, text: m, icon: 'info', confirmButtonColor: '#007AFF', borderRadius: '24px' }); }
        
        function playBeep() {
            try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); setTimeout(() => o.stop(), 200); } catch(e) {} }
        function playAlertBeep() {
            try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < 3; i++) { setTimeout(() => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15); setTimeout(() => o.stop(), 150); }, i * 200); } } catch(e) {} if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); }
        
        async function captureImage(video) { if (!video || !video.videoWidth) return null; const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0); return c.toDataURL('image/jpeg', 0.8); }
        function updateUI() { if (currentPage === 'dashboard') renderDashboard(); if (currentPage === 'records') renderRecordsPage(); if (currentPage === 'register') renderUsersTable(); }
        
        // ==================== FACE RECOGNITION CORE ====================
        async function loadFaceModels() {
            const status = document.getElementById('securityStatus');
            if (status) { status.innerHTML = '🎯 Loading AI Model...'; status.className = 'camera-status status-detecting'; }
            const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(url),
                faceapi.nets.faceLandmark68Net.loadFromUri(url),
                faceapi.nets.faceRecognitionNet.loadFromUri(url)
            ]);
            modelsLoaded = true;
            buildMatcher();
            if (status) { status.innerHTML = '✅ AI Ready - Detecting Faces'; status.className = 'camera-status status-active'; }
        }
        
        function buildMatcher() {
            const labeled = [];
            for (const u of registeredUsers) if (u.descriptor) labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
            if (labeled.length) faceMatcher = new faceapi.FaceMatcher(labeled, 0.55);
        }
        
        // ==================== SECURITY CAMERA (SMOOTH AUTO DETECTION) ====================
        async function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentCameraId, width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE }, frameRate: { ideal: 30 } } 
                });
                securityStream = stream;
                document.getElementById('securityVideo').srcObject = stream;
                isSecurityActive = true;
                if (!modelsLoaded) await loadFaceModels();
                if (securityInterval) clearInterval(securityInterval);
                securityInterval = setInterval(detectAndProcessFaces, DETECTION_INTERVAL);
                const status = document.getElementById('securityStatus');
                if (status) { status.innerHTML = '🎯 Camera Active - Auto Detecting'; status.className = 'camera-status status-active'; }
            } catch(e) { console.error(e); showError('Camera Error', 'Please allow camera access'); }
        }
        
        function stopSecurityCamera() {
            if (securityStream) { securityStream.getTracks().forEach(t => t.stop()); securityStream = null; }
            if (securityInterval) { clearInterval(securityInterval); securityInterval = null; }
            isSecurityActive = false;
        }
        
        async function detectAndProcessFaces() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 }))
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let recognized = [];
            let stranger = false;
            
            for (const d of detections) {
                let best = null;
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(d.descriptor);
                    if (result.label !== 'unknown') best = registeredUsers.find(u => u.id === result.label);
                }
                const box = d.detection.box;
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.width, box.height);
                if (best) {
                    ctx.strokeStyle = '#34C759';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#34C759';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText(best.name, box.x, box.y - 5);
                    recognized.push(best.name);
                    await autoMarkAttendance(best);
                } else {
                    ctx.strokeStyle = '#FF3B30';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#FF3B30';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ STRANGER', box.x, box.y - 5);
                    stranger = true;
                }
            }
            
            const detectEl = document.getElementById('detectCount');
            if (detectEl) detectEl.innerHTML = detections.length ? `👤 ${detections.length} face(s) detected` : '👤 No face detected';
            
            const recognizedEl = document.getElementById('recognizedNames');
            if (recognizedEl) recognizedEl.innerHTML = recognized.length ? `✅ Recognized: ${recognized.join(', ')}` : '✅ Waiting for face...';
            
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) {
                lastStrangerAlertTime = Date.now();
                const img = await captureImage(video);
                await reportStranger(img);
            }
        }
        
        async function autoMarkAttendance(user) {
            const today = getTodayDate();
            const session = getCurrentSession();
            const key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            const already = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!already) {
                lastAttendanceTime[key] = Date.now();
                const tv = new Date().getHours() * 60 + new Date().getMinutes();
                let status = "Hadir";
                if (session === 'pagi' && tv > 510) status = "Lewat";
                if (session === 'petang' && tv > 810) status = "Lewat";
                attendanceRecords.push({
                    id: user.id, name: user.name, role: user.role, className: user.className,
                    status, session, sessionName: session === 'pagi' ? 'Morning' : 'Afternoon',
                    time: getCurrentTime(), date: today, timestamp: Date.now(), method: 'Face Auto'
                });
                saveLocal(); syncToFirebase(); playBeep();
                Swal.fire({ title: '✅ Attendance Recorded!', html: `<strong>${escapeHtml(user.name)}</strong><br>Status: ${status}<br>Time: ${getCurrentTime()}`, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, background: 'white', borderRadius: '20px' });
                updateUI();
            }
        }
        
        async function reportStranger(img) {
            const alert = { id: Date.now(), className: selectedClass === "Semua Kelas" ? "Unknown" : selectedClass, time: getCurrentTime(), date: getTodayDate(), session: getCurrentSession(), imageData: img };
            strangerAlerts.push(alert);
            saveLocal(); syncToFirebase(); playAlertBeep();
            await Swal.fire({ title: '⚠️ SECURITY ALERT!', html: `<img src="${img}" style="width:150px;border-radius:16px;margin:10px 0;"><br><strong>Stranger detected in class!</strong><br>Class: ${alert.className}<br>Time: ${alert.time}`, icon: 'warning', confirmButtonColor: '#FF3B30', confirmButtonText: 'Acknowledge', borderRadius: '28px' });
            updateUI();
        }
        
        // ==================== QR SCANNER ====================
        async function startQRScanner() {
            if (isScanning) return;
            try {
                html5QrCode = new Html5Qrcode("qr-reader");
                await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 } }, async (t) => {
                    if (t && !window.processing) {
                        window.processing = true;
                        try { const d = JSON.parse(t), u = registeredUsers.find(x => x.id === d.id); if (u) { await autoMarkAttendance(u); playBeep(); } else { await showError('❌', 'QR not registered'); playAlertBeep(); } } catch(e) { await showError('Invalid QR', ''); playAlertBeep(); }
                        setTimeout(() => { window.processing = false; }, 1500);
                    }
                });
                isScanning = true;
            } catch(e) { await showError('Camera Error', 'Cannot access camera'); }
        }
        
        function stopQRScanner() { if (html5QrCode && isScanning) { html5QrCode.stop(); isScanning = false; } }
        
        // ==================== REGISTER FACE (NO BLINK, JUST CAPTURE) ====================
        function startRegisterCamera() {
            if (registerStream) stopRegisterCamera();
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE } } }).then(s => {
                registerStream = s;
                document.getElementById('registerVideo').srcObject = s;
                if (registerInterval) clearInterval(registerInterval);
                registerInterval = setInterval(checkFaceForRegister, 100);
            }).catch(e => console.error(e));
        }
        
        function stopRegisterCamera() { if (registerStream) { registerStream.getTracks().forEach(t => t.stop()); registerStream = null; } if (registerInterval) clearInterval(registerInterval); }
        
        let registerInterval = null;
        let registerFaceDetected = false;
        let registerDescriptor = null;
        let currentFaceImage = null;
        
        async function checkFaceForRegister() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const cx = canvas.width/4, cy = canvas.height/4, w = canvas.width/2, h = canvas.height/2;
            ctx.beginPath();
            ctx.rect(cx, cy, w, h);
            
            if (detection) {
                ctx.strokeStyle = '#34C759';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#34C759';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Face Detected! Ready to register', cx, cy - 5);
                registerFaceDetected = true;
                registerDescriptor = Array.from(detection.descriptor);
                currentFaceImage = await captureImage(video);
                const status = document.getElementById('regCameraStatus');
                if (status) { status.innerHTML = '✅ Face detected! Click Register to save'; status.className = 'camera-status status-active'; }
            } else {
                ctx.strokeStyle = '#FF9500';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FF9500';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Place your face in the box', cx, cy - 5);
                registerFaceDetected = false;
                const status = document.getElementById('regCameraStatus');
                if (status) { status.innerHTML = '● Position your face in the green box'; status.className = 'camera-status status-info'; }
            }
        }
        
        async function saveNameAndClass() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            let className = document.getElementById('regClass').value;
            if (!name) { await showError('Error', 'Please enter name'); return false; }
            if (!className) { await showError('Error', 'Please select class'); return false; }
            if (registeredUsers.some(u => u.name.toLowerCase() === name.toLowerCase())) {
                await showError('Name Exists', `"${name}" is already registered`);
                return false;
            }
            pendingRegistration = { name, role, className };
            registerStep = 2;
            renderRegisterStep2();
            return true;
        }
        
        async function captureAndRegister() {
            if (!registerFaceDetected || !registerDescriptor) {
                await showWarning('No Face Detected', 'Please position your face in the green box');
                return;
            }
            if (!pendingRegistration) { await showError('Error', 'Please fill name and class first'); registerStep = 1; renderRegisterPage(); return; }
            
            // Countdown effect
            for (let i = 3; i > 0; i--) { 
                await Swal.fire({ title: `${i}...`, text: 'Preparing registration', icon: 'info', timer: 800, showConfirmButton: false, background: 'white', borderRadius: '20px' }); 
            }
            
            const newUser = {
                id: Date.now().toString(),
                ...pendingRegistration,
                descriptor: registerDescriptor,
                registeredAt: new Date().toISOString(),
                qrData: JSON.stringify({ id: Date.now().toString(), name: pendingRegistration.name, role: pendingRegistration.role, className: pendingRegistration.className })
            };
            registeredUsers.push(newUser);
            saveLocal(); syncToFirebase(); buildMatcher();
            await showSuccess('✅ Registration Successful!', `${newUser.name} (${newUser.role === 'teacher' ? 'Teacher' : 'Student'})\nClass: ${newUser.className}\n✅ Face saved to AI database!`);
            pendingRegistration = null; registerStep = 1;
            if (!availableClasses.includes(newUser.className)) { availableClasses.push(newUser.className); availableClasses.sort(); }
            renderRegisterPage();
        }
        
        function backToStep1() { registerStep = 1; pendingRegistration = null; renderRegisterPage(); }

        function renderRegisterPage() {
            const html = `
                <div class="step-indicator"><div class="step active"><div class="step-number">1</div><div class="step-label">Info</div></div><div class="step"><div class="step-number">2</div><div class="step-label">Face Capture</div></div></div>
                <div class="data-table">
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Full Name *">
                        <select id="regRole"><option value="student">🎓 Student</option><option value="teacher">👩‍🏫 Teacher</option></select>
                        <select id="regClass"><option value="">Select Class *</option>${availableClasses.map(c => `<option value="${c}">Class ${c}</option>`).join('')}<option value="Lain-lain">Other Class</option></select>
                        <input type="text" id="regClassOther" placeholder="Other class" style="display:none;">
                        <button class="btn btn-primary" id="continueBtn"><i data-lucide="arrow-right"></i> Continue →</button>
                    </div>
                </div>
                <div class="data-table"><h3>👥 Registered Users</h3><div id="usersList"></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.getElementById('regClass').onchange = () => { document.getElementById('regClassOther').style.display = document.getElementById('regClass').value === 'Lain-lain' ? 'block' : 'none'; };
            document.getElementById('continueBtn').onclick = async () => {
                let className = document.getElementById('regClass').value;
                if (className === 'Lain-lain') className = document.getElementById('regClassOther').value.trim();
                if (!className) { await showError('Error', 'Please select class'); return; }
                document.getElementById('regClass').value = className;
                await saveNameAndClass();
            };
            renderUsersTable();
        }
        
        function renderUsersTable() {
            const container = document.getElementById('usersList');
            if (!container) return;
            container.innerHTML = `<div class="table-container"><table><thead><tr><th>Name</th><th>Role</th><th>Class</th><th></th></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Teacher' : 'Student'}</span></td><td>${escapeHtml(u.className)}</td><td class="action-buttons"><button class="edit-btn" onclick="editUserById('${u.id}')"><i data-lucide="edit-2"></i></button><button class="delete-btn" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join('') || '<tr><td colspan="4">No users registered</tr>'}</tbody></table></div>`;
            lucide.createIcons();
        }
        
        window.editUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = registeredUsers.find(x => x.id === id); if (u) deleteUser(u); };
        
        function renderRegisterStep2() {
            const html = `
                <div class="step-indicator"><div class="step completed"><div class="step-number">✓</div><div class="step-label">Info</div></div><div class="step active"><div class="step-number">2</div><div class="step-label">Face Capture</div></div></div>
                <div class="info-box"><i data-lucide="camera"></i><div><strong>Step 2: Capture Your Face</strong><br>Position your face in the green box, then click Register</div></div>
                <div class="camera-container"><video id="registerVideo" autoplay playsinline></video><canvas id="registerCanvas" class="face-canvas"></canvas></div>
                <div class="camera-status" id="regCameraStatus">● Initializing camera...</div>
                <div class="data-table">
                    <div style="background:#E8F5E9;padding:16px;border-radius:20px;margin-bottom:16px;">
                        <strong>📝 ${escapeHtml(pendingRegistration.name)}</strong><br>
                        ${pendingRegistration.role === 'teacher' ? '👩‍🏫 Teacher' : '🎓 Student'} | Class ${pendingRegistration.className}
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button class="btn btn-secondary" id="backBtn" style="flex:1;"><i data-lucide="arrow-left"></i> Back</button>
                        <button class="btn btn-success" id="captureBtn" style="flex:1;"><i data-lucide="camera"></i> Register Face</button>
                    </div>
                </div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            startRegisterCamera();
            document.getElementById('backBtn').onclick = backToStep1;
            document.getElementById('captureBtn').onclick = captureAndRegister;
        }
        
        function renderRecordsPage() {
            let filtered = getFilteredAttendance();
            const totalItems = filtered.length;
            const paginated = getPaginatedData(filtered);
            const todayStrangers = strangerAlerts.filter(a => a.date === getTodayDate() && (selectedClass === "Semua Kelas" || a.className === selectedClass));
            
            const html = `
                <div class="class-selector"><select id="recordClassFilter"><option value="Semua Kelas" ${selectedClass === "Semua Kelas" ? 'selected' : ''}>📚 All Classes</option>${availableClasses.map(c => `<option value="${c}" ${selectedClass === c ? 'selected' : ''}>📖 Class ${c}</option>`).join('')}</select></div>
                <div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search by name..." value="${escapeHtml(searchQuery)}"><button class="btn-small btn-primary" id="searchBtn">Search</button></div>
                <div class="date-filter"><input type="date" id="startDateInput" value="${startDate}" placeholder="Start date"><input type="date" id="endDateInput" value="${endDate}" placeholder="End date"><button class="btn-small btn-primary" id="filterBtn">Filter</button><button class="btn-small btn-secondary" id="resetBtn">Reset</button></div>
                <div class="data-table"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;"><h3>⚠️ Stranger Alerts (${todayStrangers.length})</h3><div><button class="btn-small btn-primary" id="pdfBtn">📄 PDF</button><button class="btn-small btn-success" id="excelBtn">📊 Excel</button></div></div><div id="strangerList"></div></div>
                <div class="data-table"><h3>📋 Attendance Records (${totalItems})</h3><div class="table-container"><table><thead><tr><th>Name</th><th>Class</th><th>Session</th><th>Status</th><th>Date</th><th>Time</th></thead><tbody>${paginated.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.className)}</td><td>${r.sessionName}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="6">No records</tr>'}</tbody></table></div>${renderPagination(totalItems)}</div>`;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            document.getElementById('strangerList').innerHTML = todayStrangers.length ? todayStrangers.map(a => `<div class="danger-banner"><div>${a.imageData ? `<img src="${a.imageData}" class="stranger-image" onclick="viewStranger('${a.imageData}')">` : '📷'}</div><div><strong>⚠️ Stranger Detected!</strong><br>Class: ${a.className} | Time: ${a.time}</div><button class="btn-small btn-primary" onclick="downloadImage('${a.imageData}',${a.id})">💾 Save Image</button></div>`).join('') : '<p>✅ No stranger alerts today</p>';
            
            document.getElementById('recordClassFilter').onchange = (e) => { selectedClass = e.target.value; saveLocal(); currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('searchBtn').onclick = () => { searchQuery = document.getElementById('searchInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('filterBtn').onclick = () => { startDate = document.getElementById('startDateInput').value; endDate = document.getElementById('endDateInput').value; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('resetBtn').onclick = () => { searchQuery = ""; startDate = ""; endDate = ""; currentPageNum = 1; renderRecordsPage(); };
            document.getElementById('pdfBtn').onclick = exportToPDF;
            document.getElementById('excelBtn').onclick = exportToCSV;
        }
        
        window.viewStranger = (img) => { Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#007AFF', borderRadius: '24px' }); };
        window.downloadImage = (data, id) => { const a = document.createElement('a'); a.href = data; a.download = `stranger_${id}.jpg`; a.click(); };
        
        // Navigation
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            stopSecurityCamera(); stopQRScanner(); if (registerStream) registerStream.getTracks().forEach(t => t.stop());
            if (page === 'dashboard') renderDashboard();
            else if (page === 'security') renderSecurityPage();
            else if (page === 'qrcode') renderQRPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'records') renderRecordsPage();
        }
        
        // Login Functions
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = { username: user.username, role: user.role, name: user.name };
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainHeader').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                document.getElementById('userName').innerText = currentUser.name;
                loadLocal();
                loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); });
            } else { showError('Login Failed', 'Invalid username or password'); }
        }
        
        function logout() { localStorage.removeItem('loggedInUser'); currentUser = null; location.reload(); }
        
        // Initialize
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => navigateTo(i.dataset.page)));
        window.navigateTo = navigateTo;
        
        setInterval(() => { if (document.getElementById('currentTime')) document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
        
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('userName').innerText = currentUser.name;
            loadLocal();
            loadFromFirebase().then(() => { buildMatcher(); renderDashboard(); lucide.createIcons(); loadFaceModels(); });
        }
        
        setTimeout(() => { if (!currentUser) showInfo('Welcome to SmartClass Pro', 'Demo Login:\nadmin / admin123\n\nguru / guru123\n\n✨ Features:\n✓ Auto face detection & attendance\n✓ Stranger alert with image save\n✓ QR code backup\n✓ Export reports to PDF/Excel\n✓ Cloud sync with Firebase', 'info'); }, 1000);
    </script>
</body>
</html>
