<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartClass Pro – Face & Emotion Recognition</title>

    <!-- Libraries -->
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <style>
        /* ----- RESET & ROOT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
            --radius: 24px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* ----- LOGIN OVERLAY ----- */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.hidden {
            display: none;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 56px;
            padding: 40px 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }
        .login-card .logo-big {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-card p.sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .login-card input {
            width: 100%;
            padding: 16px 20px;
            margin: 8px 0;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 1rem;
            transition: border 0.2s;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: transform 0.15s, box-shadow 0.2s;
            font-size: 1rem;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:hover {
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }
        .btn-small {
            padding: 8px 18px;
            font-size: 0.75rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.15s;
        }
        .btn-small:active {
            transform: scale(0.95);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* ----- HEADER ----- */
        .app-header {
            background: var(--card-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
            box-shadow: var(--shadow);
        }
        .app-header.hidden {
            display: none;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }
        .header-left h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .header-left span {
            font-size: 0.6rem;
            color: var(--text-secondary);
            display: block;
        }
        .live-clock {
            background: var(--bg);
            padding: 6px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            display: flex;
            justify-content: space-around;
            padding: 6px 12px;
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }
        .bottom-nav.hidden {
            display: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 0.6rem;
            font-weight: 500;
            border: none;
            background: none;
            flex: 1;
            max-width: 72px;
        }
        .nav-item i {
            width: 22px;
            height: 22px;
        }
        .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .nav-item:active {
            transform: scale(0.94);
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            padding: 16px 14px 100px;
            max-width: 640px;
            margin: 0 auto;
        }
        .main-content.hidden {
            display: none;
        }

        /* ----- STAT CARDS ----- */
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .hero-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.15s;
        }
        .hero-card:active {
            transform: scale(0.96);
        }
        .hero-card .icon {
            width: 34px;
            height: 34px;
            margin: 0 auto 6px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
        .hero-card .value {
            font-size: 20px;
            font-weight: 700;
        }
        .hero-card .label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .stat-card:active {
            transform: scale(0.97);
        }
        .stat-card h4 {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .stat-card .stat-number {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        /* ----- CHARTS ----- */
        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .chart-card h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-card canvas {
            max-height: 180px;
            width: 100% !important;
        }

        /* ----- TABLES ----- */
        .data-table {
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .table-header {
            padding: 14px 16px 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .table-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .table-header h3 i {
            color: var(--primary);
            width: 18px;
            height: 18px;
        }
        .table-badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
        }
        .table-container {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }
        .modern-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .modern-table th {
            text-align: left;
            padding: 10px 12px;
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--border);
        }
        .modern-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .modern-table tr:last-child td {
            border-bottom: none;
        }
        .modern-table tr:hover td {
            background: rgba(99, 102, 241, 0.02);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .status-hadir {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
        }
        .status-lewat {
            background: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
        }
        .status-teacher {
            background: rgba(99, 102, 241, 0.12);
            color: #6366f1;
        }
        .status-student {
            background: rgba(139, 92, 246, 0.12);
            color: #8b5cf6;
        }
        .status-stranger {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        .user-avatar-sm {
            width: 30px;
            height: 30px;
            border-radius: 30px;
            object-fit: cover;
            background: var(--bg);
            border: 2px solid var(--primary);
        }
        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-name {
            font-weight: 600;
        }
        .user-role {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }
        .action-btn {
            padding: 4px;
            border-radius: 30px;
            border: none;
            background: none;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }
        .action-btn:hover {
            background: var(--bg);
        }
        .action-edit {
            color: var(--primary);
        }
        .action-delete {
            color: var(--danger);
        }

        /* ----- CAMERA ----- */
        .camera-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .camera-container {
            position: relative;
            background: #0a0a0a;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        #securityVideo,
        #registerVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .face-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent;
        }
        .detection-indicator {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #fff;
            z-index: 10;
            pointer-events: none;
        }
        .camera-status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            padding: 6px;
            border-radius: 12px;
            background: var(--bg);
        }
        .camera-status.status-active {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
        }
        .camera-selector {
            margin-bottom: 12px;
        }
        .camera-selector select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* ----- EMOTION DISPLAY ----- */
        .emotion-display {
            text-align: center;
            margin: 12px 0 6px 0;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 10px;
            background: rgba(99, 102, 241, 0.06);
            border-radius: 60px;
            border: 1px solid rgba(99, 102, 241, 0.15);
            color: var(--text-primary);
            transition: 0.2s;
        }
        .emotion-display .emotion-emoji {
            font-size: 2rem;
            vertical-align: middle;
        }
        .emotion-display .emotion-label {
            font-weight: 600;
            margin-left: 6px;
        }
        .emotion-display .emotion-score {
            font-size: 1.1rem;
            color: var(--primary);
            margin-left: 6px;
        }

        /* ----- REGISTER ----- */
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            font-size: 0.9rem;
            background: var(--card-bg);
            transition: border 0.2s;
        }
        .register-form input:focus,
        .register-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 32px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .step.active .step-number {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
        }
        .step.completed .step-number {
            background: var(--success);
            color: #fff;
        }
        .step-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .face-preview {
            width: 32px;
            height: 32px;
            border-radius: 32px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--border);
        }

        /* ----- ALERTS ----- */
        .alert-card {
            background: linear-gradient(135deg, #fff5f5, #fff);
            border-left: 4px solid var(--danger);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            transition: transform 0.15s;
        }
        .alert-card:active {
            transform: scale(0.98);
        }
        .alert-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-icon {
            width: 36px;
            height: 36px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
            flex-shrink: 0;
        }
        .alert-details {
            display: flex;
            flex-direction: column;
        }
        .alert-details strong {
            font-size: 0.85rem;
        }
        .alert-time {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .info-box {
            background: rgba(99, 102, 241, 0.06);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        /* ----- FILTERS ----- */
        .class-selector {
            margin-bottom: 14px;
        }
        .class-selector select {
            width: 100%;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.8rem;
        }
        .date-filter {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .date-filter input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 0.75rem;
            min-width: 100px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px 0;
        }
        .page-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.15s;
        }
        .page-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .page-btn:active {
            transform: scale(0.93);
        }

        .select-all {
            padding: 8px 16px;
            background: var(--bg);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
        }
        .user-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .bulk-delete-bar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: #fff;
            padding: 10px 20px;
            border-radius: 60px;
            display: flex;
            gap: 14px;
            z-index: 200;
            box-shadow: var(--shadow-lg);
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .bulk-delete-bar.hidden {
            display: none;
        }

        .voice-indicator {
            position: fixed;
            bottom: 100px;
            right: 16px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 200;
            box-shadow: var(--shadow-lg);
            font-size: 11px;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .voice-indicator.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .hero-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-left h1 {
                font-size: 0.9rem;
            }
            .live-clock {
                font-size: 0.7rem;

    </div>

    <!-- ================================================================== -->
    <!-- ========================== JAVASCRIPT ============================= -->
    <!-- ================================================================== -->
    <script>
        // ================================================================
        //  1.  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ================================================================
        //  2.  STATE
        // ================================================================
        let currentUser = null;
        const validUsers = [{ username: "admin", password: "admin123", role: "admin", name: "Admin" }];

        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlerts = [];

        let selectedClass = "Semua Kelas";
        const availableClasses = ["5A", "5B", "5C", "4A", "4B", "4C", "3A", "3B", "2A", "2B", "1A", "1B"];

        let currentPage = 'dashboard';
        let currentPageNum = 1;
        const itemsPerPage = 8;
        let searchQuery = "";
        let startDate = "";
        let endDate = "";
        let selectedUsers = new Set();

        // Charts
        let weeklyChart = null,
            monthlyChart = null,
            classChart = null;

        // Camera & Face
        let modelsLoaded = false;
        let faceMatcher = null;
        let securityStream = null,
            registerStream = null;
        let securityInterval = null,
            registerInterval = null;
        let isSecurityActive = false;
        let currentCameraId = 'user';
        let registerFaceDetected = false;
        let registerDescriptor = null;
        let capturedFaceImage = null;
        let pendingRegistration = null;
        let registerStep = 1;
        let isCountingDown = false;
        let countdown = 3;
        let lastStrangerAlertTime = 0;
        let lastAttendanceTime = {};
        let audioCtx = null;
        const DETECTION_INTERVAL = 250;
        const INPUT_SIZE = 320;

        // ----- EMOTION MAP -----
        const emotionEmojiMap = {
            happy: '😊',
            sad: '😢',
            angry: '😠',
            surprised: '😲',
            fearful: '😨',
            disgusted: '🤢',
            neutral: '😐'
        };

        // ================================================================
        //  3.  HELPERS
        // ================================================================
        function getTodayDate() { return new Date().toLocaleDateString('en-CA'); }

        function getCurrentTime() { return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit',
                second: '2-digit' }); }

        function getCurrentSession() { return new Date().getHours() < 13 ? "pagi" : "petang"; }

        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m ===
                '>' ? '&gt;' : m); }

        function playBeep() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator(),
                    g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.value = 880;
                g.gain.value = 0.15;
                o.start();
                g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                setTimeout(() => o.stop(), 200);
            } catch (_) {}
        }

        function playAlertBeep() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator(),
                            g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.value = 880;
                        g.gain.value = 0.25;
                        o.start();
                        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
                        setTimeout(() => o.stop(), 150);
                    }, i * 200);
                }
            } catch (_) {}
            if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }

        function speakText(text) {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ms-MY';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            const indicator = document.getElementById('voiceIndicator');
            const textSpan = document.getElementById('voiceText');
            if (indicator && textSpan) {
                textSpan.innerText = text.length > 30 ? text.substring(0, 30) + '...' : text;
                indicator.classList.remove('hidden');
                setTimeout(() => indicator.classList.add('hidden'), 2500);
            }
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function speakAttendance(name, status) {
            speakText(`${name} is ${status === 'Hadir' ? 'present' : 'late'}`);
        }

        function speakStrangerAlert() { speakText('Warning! Stranger detected in classroom.'); }

        function speakRegistrationSuccess(name) { speakText(`${name} registration successful.`); }

        async function showSuccess(title, msg) {
            await Swal.fire({ title, text: msg, icon: 'success', confirmButtonColor: '#6366f1', borderRadius: '24px' });
        }

        async function showError(title, msg) {
            await Swal.fire({ title, text: msg, icon: 'error', confirmButtonColor: '#6366f1', borderRadius: '24px' });
        }

        function getUserById(id) { return registeredUsers.find(u => u.id === id); }

        // ================================================================
        //  4.  LOCAL STORAGE & FIREBASE SYNC
        // ================================================================
        function loadLocalData() {
            const u = localStorage.getItem('smart_users');
            if (u) registeredUsers = JSON.parse(u);
            const a = localStorage.getItem('smart_attendance');
            if (a) attendanceRecords = JSON.parse(a);
            const s = localStorage.getItem('smart_strangers');
            if (s) strangerAlerts = JSON.parse(s);
            const c = localStorage.getItem('smart_class');
            if (c) selectedClass = c;
            const desc = localStorage.getItem('smart_descriptors');
            if (desc) {
                const d = JSON.parse(desc);
                registeredUsers.forEach(user => { if (d[user.id]) user.descriptor = d[user.id]; });
            }
        }

        function saveLocalData() {
            localStorage.setItem('smart_users', JSON.stringify(registeredUsers.map(u => ({
                id: u.id,
                name: u.name,
                role: u.role,
                className: u.className,
                faceImage: u.faceImage,
                registeredAt: u.registeredAt
            }))));
            localStorage.setItem('smart_attendance', JSON.stringify(attendanceRecords));
            localStorage.setItem('smart_strangers', JSON.stringify(strangerAlerts));
            const desc = {};
            registeredUsers.forEach(u => { if (u.descriptor) desc[u.id] = u.descriptor; });
            localStorage.setItem('smart_descriptors', JSON.stringify(desc));
            localStorage.setItem('smart_class', selectedClass);
            syncToFirebase();
        }

        async function syncToFirebase() {
            try {
                for (const user of registeredUsers) {
                    const data = { ...user };
                    delete data.descriptor;
                    await db.collection('users').doc(user.id).set(data, { merge: true });
                }
                for (const att of attendanceRecords) {
                    await db.collection('attendance').doc(`${att.id}_${att.date}_${att.session}`).set(att, { merge: true });
                }
                for (const alert of strangerAlerts) {
                    await db.collection('strangers').doc(alert.id.toString()).set(alert, { merge: true });
                }
            } catch (e) { console.error('Firebase sync error:', e); }
        }

        async function loadFromFirebase() {
            try {
                const uSnap = await db.collection('users').get();
                uSnap.forEach(doc => {
                    const existing = registeredUsers.find(u => u.id === doc.id);
                    if (!existing) registeredUsers.push(doc.data());
                });
                const aSnap = await db.collection('attendance').get();
                aSnap.forEach(doc => {
                    const att = doc.data();
                    const existing = attendanceRecords.find(a => a.id === att.id && a.date === att.date && a
                    .session === att.session);
                    if (!existing) attendanceRecords.push(att);
                });
                const sSnap = await db.collection('strangers').get();
                sSnap.forEach(doc => {
                    const alert = doc.data();
                    const existing = strangerAlerts.find(s => s.id === alert.id);
                    if (!existing) strangerAlerts.push(alert);
                });
                const desc = localStorage.getItem('smart_descriptors');
                if (desc) {
                    const d = JSON.parse(desc);
                    registeredUsers.forEach(u => { if (d[u.id]) u.descriptor = d[u.id]; });
                }
                saveLocalData();
            } catch (e) { console.error('Firebase load error:', e);
                loadLocalData(); }
        }

        // ================================================================
        //  5.  FACE RECOGNITION MODELS & MATCHER (with Expression)
        // ================================================================
        async function loadFaceModels() {
            const url = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(url),
                faceapi.nets.faceLandmark68Net.loadFromUri(url),
                faceapi.nets.faceRecognitionNet.loadFromUri(url),
                faceapi.nets.faceExpressionNet.loadFromUri(url)  // <--- TAMBAH INI
            ]);
            modelsLoaded = true;
            buildMatcher();
        }

        function buildMatcher() {
            const labeled = [];
            for (const u of registeredUsers) {
                if (u.descriptor) {
                    labeled.push(new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
                }
            }
            if (labeled.length) {
                // Threshold dinaikkan ke 0.6 untuk lebih toleran
                faceMatcher = new faceapi.FaceMatcher(labeled, 0.6);
            } else {
                faceMatcher = null;
            }
        }

        // ================================================================
        //  6.  CAMERA — SECURITY (with Emotion)
        // ================================================================
        async function startSecurityCamera() {
            if (securityStream) stopSecurityCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentCameraId, width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE },
                        frameRate: { ideal: 30 } }
                });
                securityStream = stream;
                const video = document.getElementById('securityVideo');
                if (video) video.srcObject = stream;
                isSecurityActive = true;
                if (!modelsLoaded) await loadFaceModels();
                if (securityInterval) clearInterval(securityInterval);
                securityInterval = setInterval(detectFaces, DETECTION_INTERVAL);
                const status = document.getElementById('securityStatus');
                if (status) { status.innerHTML = '✅ Camera Active';
                    status.className = 'camera-status status-active'; }
            } catch (e) {
                console.error(e);
                showError('Camera Error', 'Please allow camera access');
            }
        }

        function stopSecurityCamera() {
            if (securityStream) { securityStream.getTracks().forEach(t => t.stop());
                securityStream = null; }
            if (securityInterval) { clearInterval(securityInterval);
                securityInterval = null; }
            isSecurityActive = false;
            const status = document.getElementById('securityStatus');
            if (status) { status.innerHTML = '⏸ Camera Stopped';
                status.className = 'camera-status'; }
        }

        async function detectFaces() {
            if (!isSecurityActive || !modelsLoaded) return;
            const video = document.getElementById('securityVideo');
            const canvas = document.getElementById('securityCanvas');
            if (!video || !video.videoWidth || !canvas) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Detection with expressions
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 }))
                .withFaceLandmarks()
                .withFaceDescriptors()
                .withFaceExpressions();  // <--- TAMBAH INI

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let recognized = [],
                stranger = false;
            let dominantEmotion = 'neutral';
            let dominantScore = 0;

            for (const d of detections) {
                // Extract emotion
                const expressions = d.expressions;
                let localDominant = 'neutral';
                let localScore = 0;
                for (const [emotion, score] of Object.entries(expressions)) {
                    if (score > localScore) {
                        localScore = score;
                        localDominant = emotion;
                    }
                }
                // If this face has higher score, update global dominant (for display)
                if (localScore > dominantScore) {
                    dominantScore = localScore;
                    dominantEmotion = localDominant;
                }

                // Recognition
                let best = null;
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(d.descriptor);
                    if (result.label !== 'unknown') best = registeredUsers.find(u => u.id === result.label);
                }

                const box = d.detection.box;
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.width, box.height);

                if (best) {
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText(best.name, box.x, box.y - 5);
                    // Tulis emosi di atas nama
                    ctx.font = '12px system-ui';
                    ctx.fillStyle = '#fbbf24';
                    const emoji = emotionEmojiMap[localDominant] || '😐';
                    ctx.fillText(`${emoji} ${localDominant} (${(localScore * 100).toFixed(1)}%)`, box.x, box.y - 22);
                    recognized.push(best.name);
                    await autoMarkAttendance(best);
                } else {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 14px system-ui';
                    ctx.fillText('⚠️ STRANGER', box.x, box.y - 5);
                    // Emosi stranger pun dipaparkan
                    ctx.font = '12px system-ui';
                    ctx.fillStyle = '#fbbf24';
                    const emoji = emotionEmojiMap[localDominant] || '😐';
                    ctx.fillText(`${emoji} ${localDominant} (${(localScore * 100).toFixed(1)}%)`, box.x, box.y - 22);
                    stranger = true;
                }
            }

            // Update detection counts
            const detectEl = document.getElementById('detectCount');
            if (detectEl) detectEl.innerHTML = detections.length ? `👤 ${detections.length} face(s)` : '👤 No face';
            const recogEl = document.getElementById('recognizedNames');
            if (recogEl) recogEl.innerHTML = recognized.length ? `✅ Recognized: ${recognized.join(', ')}` :
            '✅ Waiting...';

            // Update emotion display (global)
            const emotionDisplay = document.getElementById('emotionDisplay');
            if (emotionDisplay && dominantScore > 0) {
                const emoji = emotionEmojiMap[dominantEmotion] || '😐';
                emotionDisplay.innerHTML = `
                    <span class="emotion-emoji">${emoji}</span>
                    <span class="emotion-label">${dominantEmotion.charAt(0).toUpperCase() + dominantEmotion.slice(1)}</span>
                    <span class="emotion-score">(${(dominantScore * 100).toFixed(1)}%)</span>
                `;
            } else if (emotionDisplay) {
                emotionDisplay.innerHTML = `<span class="emotion-label">😐 No face</span>`;
            }

            // Stranger alert
            if (stranger && Date.now() - lastStrangerAlertTime > 8000) {
                lastStrangerAlertTime = Date.now();
                const img = await captureImageFromVideo(video);
                await reportStranger(img);
            }
        }

        async function captureImageFromVideo(video) {
            if (!video || !video.videoWidth) return null;
            const c = document.createElement('canvas');
            c.width = video.videoWidth;
            c.height = video.videoHeight;
            c.getContext('2d').drawImage(video, 0, 0);
            return c.toDataURL('image/jpeg', 0.8);
        }

        async function autoMarkAttendance(user) {
            const today = getTodayDate(),
                session = getCurrentSession(),
                key = `${user.id}_${today}_${session}`;
            if (lastAttendanceTime[key] && Date.now() - lastAttendanceTime[key] < 3000) return;
            const already = attendanceRecords.find(r => r.id === user.id && r.date === today && r.session === session);
            if (!already) {
                lastAttendanceTime[key] = Date.now();
                const minutes = new Date().getHours() * 60 + new Date().getMinutes();
                let status = "Hadir";
                if (session === 'pagi' && minutes > 510) status = "Lewat";
                if (session === 'petang' && minutes > 810) status = "Lewat";
                attendanceRecords.push({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    className: user.className,
                    status,
                    session,
                    sessionName: session === 'pagi' ? 'Morning' : 'Afternoon',
                    time: getCurrentTime(),
                    date: today,
                    timestamp: Date.now(),
                    method: 'Face Auto',
                    // Simpan emosi terkini (dari global)
                    emotion: document.getElementById('emotionDisplay')?.innerText || 'neutral',
                    emotionScore: 0 // optional
                });
                saveLocalData();
                playBeep();
                speakAttendance(user.name, status);
                updateUI();
            }
        }

        async function reportStranger(img) {
            const alert = {
                id: Date.now(),
                className: selectedClass === "Semua Kelas" ? "Unknown" : selectedClass,
                time: getCurrentTime(),
                date: getTodayDate(),
                session: getCurrentSession(),
                imageData: img
            };
            strangerAlerts.push(alert);
            saveLocalData();
            playAlertBeep();
            speakStrangerAlert();
            await Swal.fire({
                title: '⚠️ SECURITY ALERT!',
                html: `<img src="${img}" style="width:150px;border-radius:16px;margin:10px 0;"><br><strong>Stranger detected!</strong><br>Class: ${alert.className}<br>Time: ${alert.time}`,
                icon: 'warning',
                confirmButtonColor: '#ef4444',
                borderRadius: '24px'
            });
            updateUI();
        }

        // ================================================================
        //  7.  CAMERA — REGISTRATION (unchanged)
        // ================================================================
        function startRegisterCamera() {
            if (registerStream) stopRegisterCamera();
            navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: INPUT_SIZE }, height: { ideal: INPUT_SIZE } }
                })
                .then(s => {
                    registerStream = s;
                    const video = document.getElementById('registerVideo');
                    if (video) video.srcObject = s;
                    if (registerInterval) clearInterval(registerInterval);
                    registerInterval = setInterval(checkRegisterFace, 150);
                })
                .catch(e => console.error(e));
        }

        function stopRegisterCamera() {
            if (registerStream) { registerStream.getTracks().forEach(t => t.stop());
                registerStream = null; }
            if (registerInterval) { clearInterval(registerInterval);
                registerInterval = null; }
            if (captureTimer) clearTimeout(captureTimer);
            isCountingDown = false;
        }
        let captureTimer = null;

        async function checkRegisterFace() {
            const video = document.getElementById('registerVideo');
            const canvas = document.getElementById('registerCanvas');
            if (!video || !video.videoWidth || !canvas || !modelsLoaded) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 }))
                .withFaceLandmarks().withFaceDescriptor();
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 4,
                cy = canvas.height / 4,
                w = canvas.width / 2,
                h = canvas.height / 2;
            ctx.beginPath();
            ctx.rect(cx, cy, w, h);
            if (detection) {
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('✓ Face Detected!', cx, cy - 5);
                if (!registerFaceDetected) {
                    registerFaceDetected = true;
                    registerDescriptor = Array.from(detection.descriptor);
                    capturedFaceImage = await captureImageFromVideo(video);
                    startCountdown();
                }
            } else {
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 14px system-ui';
                ctx.fillText('Place your face here', cx, cy - 5);
                registerFaceDetected = false;
                if (captureTimer) clearTimeout(captureTimer);
                isCountingDown = false;
                const status = document.getElementById('regCameraStatus');
                if (status) status.innerHTML = '● Position your face';
            }
        }

        function startCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;
            countdown = 3;
            const showCount = () => {
                if (!registerFaceDetected) { isCountingDown = false; return; }
                const status = document.getElementById('regCameraStatus');
                if (status) status.innerHTML = `🎯 Capturing in ${countdown}...`;
                if (countdown === 0) {
                    isCountingDown = false;
                    autoRegister();
                } else {
                    countdown--;
                    setTimeout(showCount, 1000);
                }
            };
            showCount();
        }

        async function autoRegister() {
            if (!pendingRegistration) {
                await showError('Error', 'Please fill name and class first');
                registerStep = 1;
                renderRegisterPage();
                return;
            }
            if (!registerFaceDetected || !registerDescriptor) {
                await showError('No Face', 'Position your face in the box');
                return;
            }
            const newUser = {
                id: Date.now().toString(),
                ...pendingRegistration,
                descriptor: registerDescriptor,
                faceImage: capturedFaceImage,
                registeredAt: new Date().toISOString()
            };
            registeredUsers.push(newUser);
            saveLocalData();
            buildMatcher();
            speakRegistrationSuccess(newUser.name);
            await showSuccess('✅ Registration Successful!', `${newUser.name} - Class ${newUser.className}\nFace saved!`);
            pendingRegistration = null;
            registerStep = 1;
            if (!availableClasses.includes(newUser.className)) {
                availableClasses.push(newUser.className);
                availableClasses.sort();
            }
            renderRegisterPage();
        }

        async function saveNameAndClass() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            let className = document.getElementById('regClass').value;
            if (!name) { await showError('Error', 'Enter name'); return false; }
            if (!className) { await showError('Error', 'Select class'); return false; }
            if (registeredUsers.some(u => u.name.toLowerCase() === name.toLowerCase())) {
                await showError('Name Exists', `"${name}" already registered`);
                return false;
            }
            pendingRegistration = { name, role, className };
            registerStep = 2;
            renderRegisterStep2();
            return true;
        }

            pendingRegistration = null;
            renderRegisterPage(); }

                confirmButtonColor: '#ef4444',

                updateUI();
                await showSuccess('Deleted', 'User removed');

            updateBulkDeleteBar();
            renderUsersPage();
        }

        function updateBulkDeleteBar() {
            const bar = document.getElementById('bulkDeleteBar'),
                count = document.getElementById('selectedCount');
            if (bar && count) {
                bar.classList.toggle('hidden', selectedUsers.size === 0);
                count.innerText = `${selectedUsers.size} selected`;
            }
        }

        async function deleteSelectedUsers() {
            if (selectedUsers.size === 0) return;
            const result = await Swal.fire({
                title: 'Delete Users?',
                text: `Delete ${selectedUsers.size} user(s)?`,
                icon: 'warning',
                showCancelButton: true,

        function exportToCSV() {
            let csv = "Name,Class,Status,Session,Date,Time,Emotion\n";
            const filtered = getFilteredAttendance();
            for (const r of filtered) {
                csv +=
                    `"${r.name}","${r.className}","${r.status}","${r.sessionName}","${r.date}","${r.time}","${r.emotion || '-'}"\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `attendance_${getTodayDate()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showSuccess('Export Complete', 'CSV downloaded');
        }

        // ================================================================
        //  10. FILTERS & PAGINATION (unchanged)
        // ================================================================
        function getFilteredAttendance() {
            let filtered = [...attendanceRecords];
            if (selectedClass !== "Semua Kelas") filtered = filtered.filter(r => r.className === selectedClass);
            if (searchQuery) filtered = filtered.filter(r => r.name.toLowerCase().includes(searchQuery.toLowerCase()));
            if (startDate) filtered = filtered.filter(r => r.date >= startDate);
            if (endDate) filtered = filtered.filter(r => r.date <= endDate);
            return filtered;
        }

        function getPaginatedData(data) {
            const start = (currentPageNum - 1) * itemsPerPage;
            return data.slice(start, start + itemsPerPage);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            let html = '<div class="pagination">';
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="page-btn ${i === currentPageNum ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            html += '</div>';
            return html;
        }
        window.goToPage = (page) => { currentPageNum = page;
            renderRecordsPage(); };

        // ================================================================
        //  11. ANALYTICS DATA (unchanged)
        // ================================================================
        function getWeeklyData() {
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            const today = new Date();
            const values = days.map((_, i) => {
                const d = new Date(today);
                d.setDate(today.getDate() - (today.getDay() + 6 - i) % 7);
                const dateStr = d.toLocaleDateString('en-CA');
                return attendanceRecords.filter(r => r.date === dateStr).length;
            });
            return { labels: days, values };
        }

        function getMonthlyData() {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const values = months.map((_, i) => attendanceRecords.filter(r => new Date(r.date).getMonth() === i).length);
            return { labels: months, values };
        }

        function getClassData() {
            const classStats = {};
            availableClasses.forEach(c => { classStats[c] = attendanceRecords.filter(r => r.className === c).length; });
            return { labels: Object.keys(classStats), values: Object.values(classStats) };
        }

            const html = `
                <div class="data-table">
                    <div class="table-header"><h3><i data-lucide="users"></i> All Users</h3><div><span class="table-badge">${registeredUsers.length} total</span><button class="btn-small btn-primary" id="exportCsvBtn" style="margin-left:10px;background:var(--primary);">📊 Export CSV</button></div></div>
                    <div class="select-all"><input type="checkbox" id="selectAllCheckbox" ${selectedUsers.size === registeredUsers.length && registeredUsers.length > 0 ? 'checked' : ''}><label for="selectAllCheckbox">Select All Users</label></div>
                    <div class="table-container"><table class="modern-table"><thead><tr><th style="width:36px;"></th><th>Photo</th><th>Name</th><th>Role</th><th>Class</th><th>Registered</th><th>Action</th></tr></thead><tbody>${registeredUsers.map(u => `<tr><td><input type="checkbox" class="user-checkbox" data-id="${u.id}" ${selectedUsers.has(u.id) ? 'checked' : ''}></td><td>${u.faceImage ? `<img src="${u.faceImage}" class="face-preview" onclick="viewFaceImage('${u.faceImage}')">` : '<div class="face-preview" style="background:#ddd;"></div>'}</td><td><div class="user-name">${escapeHtml(u.name)}</div></td><td><span class="status-badge ${u.role === 'teacher' ? 'status-teacher' : 'status-student'}">${u.role === 'teacher' ? 'Teacher' : 'Student'}</span></td><td><span class="status-badge">${escapeHtml(u.className)}</span></td><td>${new Date(u.registeredAt).toLocaleDateString() || '-'}</td><td class="action-btns"><button class="action-btn action-edit" onclick="editUserById('${u.id}')"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button><button class="action-btn action-delete" onclick="deleteUserById('${u.id}')"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button></td></tr>`).join('') || '<tr><td colspan="7" style="text-align:center;padding:40px;">No users registered</td></tr>'}</tbody></table></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();

            document.querySelectorAll('.user-checkbox').forEach(cb => {
                cb.addEventListener('change', () => toggleSelectUser(cb.dataset.id));
            });
            const sa = document.getElementById('selectAllCheckbox');
            if (sa) sa.addEventListener('change', selectAllUsers);
            const exp = document.getElementById('exportCsvBtn');
            if (exp) exp.onclick = exportToCSV;
            document.getElementById('confirmBulkDelete').onclick = deleteSelectedUsers;
            document.getElementById('cancelBulkDelete').onclick = cancelBulkDelete;
            updateBulkDeleteBar();
        }

        // ================================================================
        //  13. NAVIGATION
        // ================================================================
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.toggle('active', b.dataset.page === page);
            });
            if (page !== 'camera') stopSecurityCamera();
            if (page !== 'register') stopRegisterCamera();
            updateUI();
        }

        // ================================================================
        //  14. LOGIN / LOGOUT
        // ================================================================
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = validUsers.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                localStorage.setItem('loggedInUser', JSON.stringify(currentUser));
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('appHeader').classList.remove('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                loadFromFirebase().then(() => {
                    buildMatcher();
                    renderDashboard();
                    lucide.createIcons();
                    loadFaceModels();
                });
            } else {
                showError('Login Failed', 'Invalid username or password');
            }
        }

        function logout() {
            localStorage.removeItem('loggedInUser');
            location.reload();
        }

        // ================================================================
        //  15. INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(() => {
                const el = document.getElementById('currentTime');
                if (el) el.innerText = new Date().toLocaleTimeString('en-GB');
            }, 1000);

            document.getElementById('loginBtn').onclick = login;
            document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

            document.querySelectorAll('.nav-item').forEach(b => {
                b.addEventListener('click', () => navigateTo(b.dataset.page));
            });
            window.navigateTo = navigateTo;

            const saved = localStorage.getItem('loggedInUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('appHeader').classList.remove('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                loadFromFirebase().then(() => {
                    buildMatcher();
                    renderDashboard();
                    lucide.createIcons();
                    loadFaceModels();
                });
            } else {
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
        });

        // Expose for inline onclick
        window.editUserById = (id) => { const u = getUserById(id); if (u) editUser(u); };
        window.deleteUserById = (id) => { const u = getUserById(id); if (u) deleteSingleUser(u); };
        window.viewFaceImage = (img) => {
            Swal.fire({ imageUrl: img, imageWidth: 300, confirmButtonColor: '#6366f1', borderRadius: '24px' });
        };
        window.downloadImage = (data, id) => { const a = document.createElement('a');
            a.href = data;
            a.download = `stranger_${id}.jpg`;
            a.click(); };
        window.goToPage = (page) => { currentPageNum = page;
            renderRecordsPage(); };
    </script>
</body>
</html>
