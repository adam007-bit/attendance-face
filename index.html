<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Class - Face Recognition Attendance</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
        }

        .header-left h1 {
            font-size: 18px;
            margin: 0;
        }

        .live-clock {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            font-family: monospace;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .nav-item i {
            width: 24px;
            height: 24px;
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 16px 16px 80px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-info h3 {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        /* Camera Section */
        .camera-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #globalVideoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .camera-status {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Tables & Forms */
        .data-table {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .data-table h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #E3F2FD; color: #1565C0; }
        .badge-student { background: #F3E5F5; color: #6A1B9A; }

        .register-form input, .register-form select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .btn:active { transform: scale(0.97); }

        .alert-banner {
            background: #FFE5E5;
            border-left: 4px solid var(--danger);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .success-banner {
            background: #E8F5E9;
            border-left-color: var(--success);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
        }

        canvas {
            max-height: 200px;
        }

        /* Mini preview for register page */
        .mini-camera {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            aspect-ratio: 16/9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
            <div>
                <h1>Smart Class</h1>
                <p style="font-size: 10px; color: var(--text-secondary);">Face Recognition</p>
            </div>
        </div>
        <div class="live-clock">
            <span id="currentTime">--:--:--</span>
        </div>
    </div>

    <div class="main-content" id="mainContent"></div>

    <div class="bottom-nav">
        <div class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="camera">
            <i data-lucide="camera"></i>
            <span>Kamera</span>
        </div>
        <div class="nav-item" data-page="register">
            <i data-lucide="user-plus"></i>
            <span>Daftar</span>
        </div>
        <div class="nav-item" data-page="attendance">
            <i data-lucide="clipboard-list"></i>
            <span>Rekod</span>
        </div>
        <div class="nav-item" data-page="users">
            <i data-lucide="users"></i>
            <span>Pengguna</span>
        </div>
    </div>

    <div id="alertModal" class="modal">
        <div class="modal-content">
            <i data-lucide="alert-triangle" style="width: 48px; height: 48px; color: var(--danger); margin-bottom: 12px;"></i>
            <h3>⚠️ Amaran Keselamatan</h3>
            <p id="alertMessage">Wajah asing dikesan!</p>
            <button class="btn btn-primary" id="closeAlertBtn" style="margin-top: 16px;">Tutup</button>
        </div>
    </div>

    <script>
        // Data variables
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlertCount = 0;
        let isCameraActive = false;
        let videoStream = null;
        let detectionInterval = null;
        let modelsLoaded = false;
        let currentPage = 'dashboard';
        
        let attendanceChart = null;

        // Helper Functions
        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(str) { 
            return String(str).replace(/[&<>]/g, function(m) { 
                if (m === '&') return '&amp;'; 
                if (m === '<') return '&lt;'; 
                if (m === '>') return '&gt;'; 
                return m; 
            }); 
        }

        function showNotification(message, isError = false) {
            const container = document.getElementById('notificationContainer');
            if (!container) return;
            const cls = isError ? 'alert-banner' : 'alert-banner success-banner';
            container.innerHTML = `<div class="${cls}">
                <i data-lucide="${isError ? 'alert-circle' : 'check-circle'}"></i>
                <strong>${escapeHtml(message)}</strong>
            </div>`;
            setTimeout(() => { if(container.firstChild) container.firstChild.remove(); }, 3000);
            lucide.createIcons();
        }

        // Load/Save from localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('smartclass_users');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            const savedAttendance = localStorage.getItem('smartclass_attendance');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            const savedAlerts = localStorage.getItem('smartclass_stranger_count');
            if (savedAlerts) strangerAlertCount = parseInt(savedAlerts);
            updateAllStats();
        }

        function saveUsers() {
            localStorage.setItem('smartclass_users', JSON.stringify(registeredUsers));
            updateAllStats();
        }

        function saveAttendance() {
            localStorage.setItem('smartclass_attendance', JSON.stringify(attendanceRecords));
            updateAllStats();
        }

        function saveStrangerCount() {
            localStorage.setItem('smartclass_stranger_count', strangerAlertCount);
        }

        function updateAllStats() {
            if (currentPage === 'dashboard') renderDashboard();
            if (currentPage === 'attendance') renderAttendanceTable();
            if (currentPage === 'users') renderUsersTable();
        }

        // Mark Attendance
        function markAttendance(user) {
            const today = getTodayDate();
            const alreadyLogged = attendanceRecords.find(rec => rec.id === user.id && rec.date === today);
            if (!alreadyLogged) {
                const now = new Date();
                const hour = now.getHours();
                const minute = now.getMinutes();
                const timeValue = hour * 60 + minute;
                const status = timeValue > 510 ? (timeValue > 540 ? 'Lewat' : 'Hadir') : 'Hadir';
                
                attendanceRecords.push({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    className: user.className,
                    status: status,
                    time: getCurrentTime(),
                    date: today,
                    timestamp: Date.now()
                });
                saveAttendance();
                showNotification(`✅ ${user.name} - ${status}`, false);
            }
        }

        // Stranger Alert
        function showStrangerAlert() {
            strangerAlertCount++;
            saveStrangerCount();
            
            const alertContainer = document.getElementById('alertContainer');
            if (alertContainer && currentPage === 'camera') {
                alertContainer.innerHTML = `<div class="alert-banner">
                    <i data-lucide="alert-triangle"></i>
                    <strong>⚠️ Wajah asing dikesan!</strong>
                </div>`;
                setTimeout(() => { if(alertContainer.firstChild) alertContainer.firstChild.remove(); }, 4000);
            }
            
            document.getElementById('alertMessage').innerText = 'Wajah tidak dikenali dikesan!';
            document.getElementById('alertModal').style.display = 'flex';
            
            // Beep sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.15;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.4);
                setTimeout(() => osc.stop(), 400);
            } catch(e) {}
            
            if ('vibrate' in navigator) navigator.vibrate(200);
            updateAllStats();
        }

        // ==================== GLOBAL CAMERA (Aktif di semua tab) ====================
        async function initGlobalCamera() {
            if (videoStream) return true;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                videoStream = stream;
                
                // Update all video elements that need camera
                const videos = document.querySelectorAll('.camera-video');
                videos.forEach(video => {
                    video.srcObject = stream;
                    video.play().catch(e => console.log(e));
                });
                
                isCameraActive = true;
                
                if (!modelsLoaded) await loadFaceModels();
                
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(runGlobalFaceDetection, 800);
                
                return true;
            } catch(err) {
                console.error(err);
                isCameraActive = false;
                return false;
            }
        }

        function stopGlobalCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            isCameraActive = false;
        }

        async function loadFaceModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            showNotification('Memuatkan model...', false);
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            showNotification('✅ Model sedia!', false);
        }

        async function runGlobalFaceDetection() {
            if (!isCameraActive || !modelsLoaded) return;
            
            // Get the active video element
            const video = document.getElementById('globalVideoFeed');
            if (!video || !video.videoWidth) return;
            
            // Get all canvases to draw on
            const canvases = document.querySelectorAll('.face-canvas');
            
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            let recognizedCount = 0;
            
            for (const detection of detections) {
                let bestMatch = null;
                let bestDistance = 0.55;
                
                for (const user of registeredUsers) {
                    if (user.descriptor) {
                        const distance = faceapi.euclideanDistance(detection.descriptor, user.descriptor);
                        if (distance < bestDistance) {
                            bestDistance = distance;
                            bestMatch = user;
                        }
                    }
                }
                
                // Draw on all canvases
                canvases.forEach(canvas => {
                    if (canvas && canvas.width && canvas.height) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        
                        const box = detection.detection.box;
                        ctx.beginPath();
                        ctx.rect(box.x, box.y, box.width, box.height);
                        
                        if (bestMatch) {
                            ctx.strokeStyle = '#34C759';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                            ctx.fillStyle = '#34C759';
                            ctx.font = 'bold 14px system-ui';
                            ctx.fillText(`${bestMatch.name}`, box.x, box.y - 5);
                            markAttendance(bestMatch);
                            recognizedCount++;
                        } else {
                            ctx.strokeStyle = '#FF3B30';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                            ctx.fillStyle = '#FF3B30';
                            ctx.font = 'bold 14px system-ui';
                            ctx.fillText('Asing!', box.x, box.y - 5);
                        }
                    }
                });
            }
            
            // Clear canvases if no faces
            if (detections.length === 0) {
                canvases.forEach(canvas => {
                    const ctx = canvas?.getContext('2d');
                    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
                });
            }
            
            const unknownCount = detections.length - recognizedCount;
            if (unknownCount > 0 && (!window.lastAlertTime || Date.now() - window.lastAlertTime > 10000)) {
                showStrangerAlert();
                window.lastAlertTime = Date.now();
            }
        }

        // Register Face function
        async function registerFace() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClass').value.trim();
            
            if (!name) { alert('Sila masukkan nama'); return; }
            if (!isCameraActive || !videoStream) { 
                alert('Kamera belum sedia. Sila pastikan kamera berfungsi.');
                await initGlobalCamera();
                return;
            }
            
            const video = document.getElementById('globalVideoFeed');
            if (!video || !video.videoWidth) {
                alert('Kamera belum sedia. Tunggu sebentar...');
                return;
            }
            
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptor();
            
            if (!detection) {
                alert('Tiada wajah dikesan. Pastikan muka anda jelas dalam frame kamera.');
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                name: name,
                role: role,
                className: className || '-',
                descriptor: Array.from(detection.descriptor),
                registeredAt: new Date().toISOString()
            };
            
            registeredUsers.push(newUser);
            saveUsers();
            alert(`✅ ${name} berjaya didaftarkan!`);
            document.getElementById('regName').value = '';
            document.getElementById('regClass').value = '';
            renderUsersTable();
        }

        // Clock update
        function updateClock() {
            document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==================== RENDER FUNCTIONS ====================
        function renderDashboard() {
            const today = getTodayDate();
            const todayAttendance = attendanceRecords.filter(r => r.date === today).length;
            const totalStudents = registeredUsers.filter(u => u.role === 'student').length;
            const totalTeachers = registeredUsers.filter(u => u.role === 'teacher').length;
            const presentToday = attendanceRecords.filter(r => r.date === today && r.status === 'Hadir').length;
            const lateToday = attendanceRecords.filter(r => r.date === today && r.status === 'Lewat').length;
            
            const html = `
                <div id="notificationContainer"></div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-info"><h3>Pengguna</h3><div class="stat-number">${registeredUsers.length}</div></div><div class="stat-icon"><i data-lucide="users"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir Hari Ini</h3><div class="stat-number">${todayAttendance}</div></div><div class="stat-icon"><i data-lucide="check-circle"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Pelajar</h3><div class="stat-number">${totalStudents}</div></div><div class="stat-icon"><i data-lucide="graduation-cap"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Guru</h3><div class="stat-number">${totalTeachers}</div></div><div class="stat-icon"><i data-lucide="chalkboard"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir</h3><div class="stat-number">${presentToday}</div></div><div class="stat-icon"><i data-lucide="smile"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Lewat</h3><div class="stat-number">${lateToday}</div></div><div class="stat-icon"><i data-lucide="clock"></i></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i data-lucide="pie-chart"></i> Kehadiran Hari Ini</h3><canvas id="attendanceChartCanvas"></canvas></div>
                </div>
                <div class="data-table"><h3>📋 Kehadiran Terkini</h3><div class="table-container"><table><thead><tr><th>Nama</th><th>Status</th><th>Masa</th></thead><tbody>${attendanceRecords.slice(-8).reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="3">Tiada rekod</td></tr>'}</tbody></table></div></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const ctx = document.getElementById('attendanceChartCanvas')?.getContext('2d');
            if (ctx && attendanceChart) attendanceChart.destroy();
            if (ctx) {
                attendanceChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Hadir', 'Lewat'], datasets: [{ data: [presentToday, lateToday], backgroundColor: ['#34C759', '#FF9500'] }] } });
            }
        }

        function renderCameraPage() {
            const html = `
                <div id="notificationContainer"></div>
                <div id="alertContainer"></div>
                <div class="camera-section">
                    <div class="camera-container">
                        <video id="globalVideoFeed" class="camera-video" autoplay playsinline></video>
                        <canvas id="cameraCanvas" class="face-canvas"></canvas>
                    </div>
                    <div class="camera-status" id="cameraStatus">● Kamera aktif - Mengesan wajah</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="info"></i> Maklumat</h3>
                    <p style="font-size: 13px;">✓ Wajah berdaftar akan auto rekod kehadiran<br>✓ Wajah asing akan trigger amaran<br>✓ Pastikan pencahayaan cukup</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            // Attach video to global feed
            if (videoStream) {
                const video = document.getElementById('globalVideoFeed');
                video.srcObject = videoStream;
                video.play().catch(e => console.log(e));
            }
            
            const canvas = document.getElementById('cameraCanvas');
            if (canvas && videoStream) {
                const video = document.getElementById('globalVideoFeed');
                const updateCanvasSize = () => {
                    if (video.videoWidth) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }
                };
                video.addEventListener('loadedmetadata', updateCanvasSize);
                setTimeout(updateCanvasSize, 100);
            }
        }

        function renderRegisterPage() {
            const html = `
                <div id="notificationContainer"></div>
                <div class="camera-section">
                    <h3><i data-lucide="camera"></i> Preview Kamera</h3>
                    <div class="camera-container" style="aspect-ratio: 16/9;">
                        <video id="globalVideoFeed" class="camera-video" autoplay playsinline></video>
                        <canvas id="registerCanvas" class="face-canvas"></canvas>
                    </div>
                    <div class="camera-status">● Pastikan muka jelas dalam frame</div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="user-plus"></i> Daftar Wajah Baru</h3>
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Nama Penuh">
                        <select id="regRole">
                            <option value="student">Pelajar</option>
                            <option value="teacher">Guru</option>
                        </select>
                        <input type="text" id="regClass" placeholder="Kelas">
                        <button class="btn btn-success" id="registerFaceBtn"><i data-lucide="camera"></i> Tangkap & Daftar</button>
                    </div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="users"></i> Senarai Pengguna</h3>
                    <div class="table-container" id="usersTableContainer"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            // Attach video stream
            if (videoStream) {
                const video = document.getElementById('globalVideoFeed');
                video.srcObject = videoStream;
                video.play().catch(e => console.log(e));
            }
            
            const canvas = document.getElementById('registerCanvas');
            if (canvas && videoStream) {
                const video = document.getElementById('globalVideoFeed');
                const updateSize = () => {
                    if (video.videoWidth) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }
                };
                video.addEventListener('loadedmetadata', updateSize);
                setTimeout(updateSize, 100);
            }
            
            document.getElementById('registerFaceBtn').onclick = registerFace;
            renderUsersTable();
        }

        function renderUsersTable() {
            const container = document.getElementById('usersTableContainer');
            if (!container) return;
            container.innerHTML = `<table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th></tr></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Guru' : 'Pelajar'}</span></td><td>${escapeHtml(u.className)}</td></tr>`).join('') || '<tr><td colspan="3">Tiada pengguna</td></tr>'}</tbody></table>`;
            lucide.createIcons();
        }

        function renderAttendanceTable() {
            const today = getTodayDate();
            const filtered = attendanceRecords.filter(r => r.date === today);
            const html = `
                <div id="notificationContainer"></div>
                <div class="data-table">
                    <h3>📋 Kehadiran Hari Ini (${today})</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>Status</th><th>Masa</th></tr></thead><tbody>${filtered.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.role === 'teacher' ? 'Guru' : 'Pelajar'}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="5">Tiada kehadiran</td></tr>'}</tbody></table></div>
                </div>
                <div class="data-table">
                    <h3>📜 Semua Rekod</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Status</th><th>Tarikh</th><th>Masa</th></tr></thead><tbody>${attendanceRecords.slice().reverse().slice(0, 20).map(r => `<tr><td>${escapeHtml(r.name)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="4">Tiada rekod</td></tr>'}</tbody></table></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            
            if (page === 'dashboard') renderDashboard();
            else if (page === 'camera') renderCameraPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'attendance') renderAttendanceTable();
            else if (page === 'users') renderUsersTable();
        }

        // Event Listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });
        document.getElementById('closeAlertBtn')?.addEventListener('click', () => {
            document.getElementById('alertModal').style.display = 'none';
        });
        document.getElementById('alertModal')?.addEventListener('click', (e) => {
            if (e.target === document.getElementById('alertModal')) document.getElementById('alertModal').style.display = 'none';
        });

        // Initialize - Start camera immediately
        async function init() {
            loadData();
            await initGlobalCamera();
            renderDashboard();
            lucide.createIcons();
            console.log('✅ Sistem sedia - Kamera global aktif');
        }
        
        init();
    </script>
</body>
</html>
