<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Smart Class - Face Recognition System</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --primary-dark: #005FC1;
            --success: #34C759;
            --warning: #FF9500;
            --danger: #FF3B30;
            --purple: #AF52DE;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
            --sidebar-width: 280px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header img {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: var(--primary);
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .nav-menu {
            padding: 20px 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--bg);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item.active i {
            color: white;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 24px 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-info h3 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,122,255,0.1);
            color: var(--primary);
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
        }

        .chart-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        canvas {
            max-height: 250px;
        }

        .camera-section {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 16px;
        }

        #videoFeed {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .camera-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .data-table {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-hadir { background: #E8F5E9; color: #2E7D32; }
        .badge-lewat { background: #FFF3E0; color: #E65100; }
        .badge-teacher { background: #E3F2FD; color: #1565C0; }
        .badge-student { background: #F3E5F5; color: #6A1B9A; }

        .alert-banner {
            background: #FFE5E5;
            border-left: 4px solid var(--danger);
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.01); }
        }

        .success-banner {
            background: #E8F5E9;
            border-left: 4px solid var(--success);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .register-form input, .register-form select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 201;
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 70px 16px 24px;
            }
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle">
        <i data-lucide="menu"></i>
    </button>

    <div class="dashboard">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23007AFF' rx='20'/%3E%3Cpath fill='white' d='M30 35 L45 28 L70 35 L65 68 L50 75 L35 68 L30 35Z'/%3E%3Ccircle cx='50' cy='48' r='8' fill='white'/%3E%3C/svg%3E">
                <div>
                    <h2>Smart Class</h2>
                    <p>Face Recognition System</p>
                </div>
            </div>
            <div class="nav-menu">
                <div class="nav-item active" data-page="dashboard">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </div>
                <div class="nav-item" data-page="camera">
                    <i data-lucide="camera"></i> Kamera & Kehadiran
                </div>
                <div class="nav-item" data-page="register">
                    <i data-lucide="user-plus"></i> Daftar Wajah
                </div>
                <div class="nav-item" data-page="attendance">
                    <i data-lucide="clipboard-list"></i> Rekod Kehadiran
                </div>
                <div class="nav-item" data-page="users">
                    <i data-lucide="users"></i> Senarai Pengguna
                </div>
            </div>
        </div>

        <div class="main-content" id="mainContent"></div>
    </div>

    <div id="alertModal" class="modal">
        <div class="modal-content">
            <i data-lucide="alert-triangle" style="width: 48px; height: 48px; color: var(--danger); margin-bottom: 12px;"></i>
            <h3>⚠️ Amaran Keselamatan</h3>
            <p id="alertMessage">Wajah asing dikesan!</p>
            <button class="btn btn-primary" id="closeAlertBtn" style="margin-top: 16px;">Tutup</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZYM0Fe06bb_Q67U6Pn42RSoZB-mjo3io",
            authDomain: "secuirityschool.firebaseapp.com",
            projectId: "secuirityschool",
            storageBucket: "secuirityschool.firebasestorage.app",
            messagingSenderId: "321431921421",
            appId: "1:321431921421:web:265abf74d07deb917bc644"
        };
        
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log('✅ Firebase connected');

        // Data variables
        let registeredUsers = [];
        let attendanceRecords = [];
        let strangerAlertCount = 0;
        let isCameraActive = false;
        let videoStream = null;
        let detectionInterval = null;
        let modelsLoaded = false;
        let currentPage = 'dashboard';
        
        let attendanceChart = null;
        let roleChart = null;

        // Helper Functions
        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function escapeHtml(str) { 
            return String(str).replace(/[&<>]/g, function(m) { 
                if (m === '&') return '&amp;'; 
                if (m === '<') return '&lt;'; 
                if (m === '>') return '&gt;'; 
                return m; 
            }); 
        }

        function showNotification(message, isError = false) {
            const container = document.getElementById('notificationContainer');
            if (!container) return;
            const cls = isError ? 'alert-banner' : 'alert-banner success-banner';
            container.innerHTML = `<div class="${cls}">
                <i data-lucide="${isError ? 'alert-circle' : 'check-circle'}"></i>
                <strong>${escapeHtml(message)}</strong>
            </div>`;
            setTimeout(() => { if(container.firstChild) container.firstChild.remove(); }, 3000);
            lucide.createIcons();
        }

        // Load/Save from localStorage
        function loadData() {
            const savedUsers = localStorage.getItem('smartclass_users');
            if (savedUsers) registeredUsers = JSON.parse(savedUsers);
            const savedAttendance = localStorage.getItem('smartclass_attendance');
            if (savedAttendance) attendanceRecords = JSON.parse(savedAttendance);
            const savedAlerts = localStorage.getItem('smartclass_stranger_count');
            if (savedAlerts) strangerAlertCount = parseInt(savedAlerts);
            updateAllStats();
        }

        function saveUsers() {
            localStorage.setItem('smartclass_users', JSON.stringify(registeredUsers));
            updateAllStats();
        }

        function saveAttendance() {
            localStorage.setItem('smartclass_attendance', JSON.stringify(attendanceRecords));
            updateAllStats();
        }

        function saveStrangerCount() {
            localStorage.setItem('smartclass_stranger_count', strangerAlertCount);
        }

        function updateAllStats() {
            if (currentPage === 'dashboard') renderDashboard();
            if (currentPage === 'attendance') renderAttendanceTable();
            if (currentPage === 'users') renderUsersTable();
        }

        // Mark Attendance
        function markAttendance(user) {
            const today = getTodayDate();
            const alreadyLogged = attendanceRecords.find(rec => rec.id === user.id && rec.date === today);
            if (!alreadyLogged) {
                const now = new Date();
                const hour = now.getHours();
                const minute = now.getMinutes();
                const timeValue = hour * 60 + minute;
                const status = timeValue > 510 ? (timeValue > 540 ? 'Lewat' : 'Hadir') : 'Hadir';
                
                attendanceRecords.push({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    className: user.className,
                    status: status,
                    time: getCurrentTime(),
                    date: today,
                    timestamp: Date.now()
                });
                saveAttendance();
                showNotification(`✅ ${user.name} - ${status}`, false);
            }
        }

        // Stranger Alert
        function showStrangerAlert() {
            strangerAlertCount++;
            saveStrangerCount();
            
            const alertContainer = document.getElementById('alertContainer');
            if (alertContainer) {
                alertContainer.innerHTML = `<div class="alert-banner">
                    <i data-lucide="alert-triangle"></i>
                    <strong>⚠️ AMARAN: Wajah asing dikesan!</strong>
                </div>`;
                setTimeout(() => { if(alertContainer.firstChild) alertContainer.firstChild.remove(); }, 5000);
            }
            
            document.getElementById('alertMessage').innerText = 'Wajah tidak dikenali dikesan oleh sistem keselamatan!';
            document.getElementById('alertModal').style.display = 'flex';
            
            // Beep sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                setTimeout(() => osc.stop(), 500);
            } catch(e) {}
            
            if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
            updateAllStats();
        }

        // Face Recognition Functions
        async function loadFaceModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
            showNotification('Memuatkan model face recognition...', false);
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            showNotification('✅ Model face recognition sedia!', false);
            console.log('Face models loaded');
        }

        async function startCamera() {
            if (videoStream) stopCamera();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoStream = stream;
                const video = document.getElementById('videoFeed');
                video.srcObject = stream;
                await video.play();
                isCameraActive = true;
                
                if (!modelsLoaded) await loadFaceModels();
                
                if (detectionInterval) clearInterval(detectionInterval);
                detectionInterval = setInterval(runFaceDetection, 800);
                
                const statusEl = document.getElementById('cameraStatus');
                if (statusEl) statusEl.innerHTML = '<span style="color: var(--success);">● Kamera Aktif</span>';
                showNotification('✅ Kamera berjaya dimulakan', false);
            } catch(err) {
                console.error(err);
                alert('Kamera tidak dapat diakses. Sila pastikan kebenaran kamera diberikan.');
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            isCameraActive = false;
            const statusEl = document.getElementById('cameraStatus');
            if (statusEl) statusEl.innerHTML = '<span style="color: var(--text-secondary);">● Kamera Dihentikan</span>';
        }

        async function runFaceDetection() {
            if (!isCameraActive || !modelsLoaded) return;
            const video = document.getElementById('videoFeed');
            const canvas = document.getElementById('faceCanvas');
            if (!video || !video.videoWidth) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            let recognizedCount = 0;
            
            for (const detection of detections) {
                let bestMatch = null;
                let bestDistance = 0.55;
                
                for (const user of registeredUsers) {
                    if (user.descriptor) {
                        const distance = faceapi.euclideanDistance(detection.descriptor, user.descriptor);
                        if (distance < bestDistance) {
                            bestDistance = distance;
                            bestMatch = user;
                        }
                    }
                }
                
                const box = detection.detection.box;
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.width, box.height);
                
                if (bestMatch) {
                    ctx.strokeStyle = '#34C759';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#34C759';
                    ctx.font = 'bold 16px system-ui';
                    ctx.fillText(`${bestMatch.name} (${bestMatch.role === 'teacher' ? 'Guru' : 'Pelajar'})`, box.x, box.y - 5);
                    markAttendance(bestMatch);
                    recognizedCount++;
                } else {
                    ctx.strokeStyle = '#FF3B30';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#FF3B30';
                    ctx.font = 'bold 16px system-ui';
                    ctx.fillText('Wajah Asing!', box.x, box.y - 5);
                }
            }
            
            const unknownCount = detections.length - recognizedCount;
            if (unknownCount > 0 && (!window.lastAlertTime || Date.now() - window.lastAlertTime > 8000)) {
                showStrangerAlert();
                window.lastAlertTime = Date.now();
            }
        }

        async function registerFace() {
            const name = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const className = document.getElementById('regClass').value.trim();
            
            if (!name) { alert('Sila masukkan nama'); return; }
            if (!isCameraActive) { alert('Sila hidupkan kamera dahulu (pergi ke tab Kamera & Kehadiran)'); return; }
            
            const video = document.getElementById('videoFeed');
            if (!video || !video.videoWidth) {
                alert('Kamera belum sedia. Pastikan kamera sudah dimulakan.');
                return;
            }
            
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptor();
            
            if (!detection) {
                alert('Tiada wajah dikesan. Pastikan muka anda jelas dalam frame kamera.');
                return;
            }
            
            const newUser = {
                id: Date.now().toString(),
                name: name,
                role: role,
                className: className || '-',
                descriptor: Array.from(detection.descriptor),
                registeredAt: new Date().toISOString()
            };
            
            registeredUsers.push(newUser);
            saveUsers();
            alert(`✅ ${name} berjaya didaftarkan!`);
            document.getElementById('regName').value = '';
            document.getElementById('regClass').value = '';
            renderUsersTable();
        }

        // Render Functions
        function renderDashboard() {
            const today = getTodayDate();
            const todayAttendance = attendanceRecords.filter(r => r.date === today).length;
            const totalStudents = registeredUsers.filter(u => u.role === 'student').length;
            const totalTeachers = registeredUsers.filter(u => u.role === 'teacher').length;
            const presentToday = attendanceRecords.filter(r => r.date === today && r.status === 'Hadir').length;
            const lateToday = attendanceRecords.filter(r => r.date === today && r.status === 'Lewat').length;
            
            const html = `
                <div id="notificationContainer"></div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-info"><h3>Jumlah Pengguna</h3><div class="stat-number">${registeredUsers.length}</div></div><div class="stat-icon"><i data-lucide="users"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Kehadiran Hari Ini</h3><div class="stat-number">${todayAttendance}</div></div><div class="stat-icon"><i data-lucide="check-circle"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Pelajar</h3><div class="stat-number">${totalStudents}</div></div><div class="stat-icon"><i data-lucide="graduation-cap"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Guru</h3><div class="stat-number">${totalTeachers}</div></div><div class="stat-icon"><i data-lucide="chalkboard"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Hadir Hari Ini</h3><div class="stat-number">${presentToday}</div></div><div class="stat-icon"><i data-lucide="smile"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Lewat Hari Ini</h3><div class="stat-number">${lateToday}</div></div><div class="stat-icon"><i data-lucide="clock"></i></div></div>
                    <div class="stat-card"><div class="stat-info"><h3>Wajah Asing</h3><div class="stat-number">${strangerAlertCount}</div></div><div class="stat-icon"><i data-lucide="alert-triangle"></i></div></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i data-lucide="pie-chart"></i> Statistik Kehadiran (Hari Ini)</h3><canvas id="attendanceChartCanvas"></canvas></div>
                    <div class="chart-card"><h3><i data-lucide="bar-chart"></i> Pengikut Mengikut Peranan</h3><canvas id="roleChartCanvas"></canvas></div>
                </div>
                <div class="data-table"><h3>📋 Kehadiran Terkini</h3><div class="table-container"><table><thead><tr><th>Nama</th><th>Peranan</th><th>Status</th><th>Masa</th><th>Tarikh</th></tr></thead><tbody>${attendanceRecords.slice(-10).reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.role === 'teacher' ? 'Guru' : 'Pelajar'}<td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}<td>${r.date}</tr>`).join('') || '<tr><td colspan="5">Tiada rekod kehadiran</td></tr>'}</tbody></table></div></div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            
            const ctx1 = document.getElementById('attendanceChartCanvas')?.getContext('2d');
            const ctx2 = document.getElementById('roleChartCanvas')?.getContext('2d');
            if (ctx1 && attendanceChart) attendanceChart.destroy();
            if (ctx2 && roleChart) roleChart.destroy();
            if (ctx1) {
                attendanceChart = new Chart(ctx1, { type: 'doughnut', data: { labels: ['Hadir', 'Lewat'], datasets: [{ data: [presentToday, lateToday], backgroundColor: ['#34C759', '#FF9500'] }] } });
            }
            if (ctx2) {
                roleChart = new Chart(ctx2, { type: 'bar', data: { labels: ['Pelajar', 'Guru'], datasets: [{ label: 'Bilangan', data: [totalStudents, totalTeachers], backgroundColor: ['#007AFF', '#AF52DE'] }] } });
            }
        }

        function renderCameraPage() {
            const html = `
                <div id="notificationContainer"></div>
                <div id="alertContainer"></div>
                <div class="camera-section">
                    <h3><i data-lucide="camera"></i> Kamera Keselamatan Kelas</h3>
                    <div class="camera-container">
                        <video id="videoFeed" autoplay playsinline></video>
                        <canvas id="faceCanvas" class="face-canvas"></canvas>
                    </div>
                    <div class="camera-controls">
                        <button class="btn btn-primary" id="startCameraBtn"><i data-lucide="play"></i> Mula Kamera</button>
                        <button class="btn btn-danger" id="stopCameraBtn"><i data-lucide="stop-circle"></i> Henti Kamera</button>
                    </div>
                    <p id="cameraStatus" style="margin-top: 12px; font-size: 13px;">● Kamera belum dimulakan</p>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.getElementById('startCameraBtn').onclick = () => startCamera();
            document.getElementById('stopCameraBtn').onclick = () => stopCamera();
        }

        function renderRegisterPage() {
            const html = `
                <div id="notificationContainer"></div>
                <div class="data-table">
                    <h3><i data-lucide="user-plus"></i> Daftar Wajah Baru</h3>
                    <div class="register-form">
                        <input type="text" id="regName" placeholder="Nama Penuh">
                        <select id="regRole">
                            <option value="student">Pelajar</option>
                            <option value="teacher">Guru</option>
                        </select>
                        <input type="text" id="regClass" placeholder="Kelas (cth: 5A)">
                        <button class="btn btn-success" id="registerFaceBtn"><i data-lucide="camera"></i> Tangkap & Daftar Wajah</button>
                    </div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="users"></i> Senarai Pengguna Berdaftar</h3>
                    <div class="table-container" id="usersTableContainer"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
            document.getElementById('registerFaceBtn').onclick = registerFace;
            renderUsersTable();
        }

        function renderUsersTable() {
            const container = document.getElementById('usersTableContainer');
            if (!container) return;
            container.innerHTML = `<table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>ID</th></tr></thead><tbody>${registeredUsers.map(u => `<tr><td>${escapeHtml(u.name)}</td><td><span class="badge ${u.role === 'teacher' ? 'badge-teacher' : 'badge-student'}">${u.role === 'teacher' ? 'Guru' : 'Pelajar'}</span></td><td>${escapeHtml(u.className)}<td style="font-size:11px;">${u.id.slice(-6)}</td></tr>`).join('') || '<tr><td colspan="4">Tiada pengguna berdaftar</td></tr>'}</tbody></table>`;
            lucide.createIcons();
        }

        function renderAttendanceTable() {
            const today = getTodayDate();
            const filtered = attendanceRecords.filter(r => r.date === today);
            const html = `
                <div id="notificationContainer"></div>
                <div class="data-table">
                    <h3><i data-lucide="clipboard-list"></i> Rekod Kehadiran (Hari Ini)</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Peranan</th><th>Kelas</th><th>Status</th><th>Masa</th></tr></thead><tbody>${filtered.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.role === 'teacher' ? 'Guru' : 'Pelajar'}</td><td>${escapeHtml(r.className)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="5">Tiada kehadiran hari ini</td></tr>'}</tbody></table></div>
                </div>
                <div class="data-table">
                    <h3><i data-lucide="history"></i> Semua Rekod Kehadiran</h3>
                    <div class="table-container"><table><thead><tr><th>Nama</th><th>Status</th><th>Tarikh</th><th>Masa</th></tr></thead><tbody>${attendanceRecords.slice().reverse().map(r => `<tr><td>${escapeHtml(r.name)}</td><td><span class="badge ${r.status === 'Hadir' ? 'badge-hadir' : 'badge-lewat'}">${r.status}</span></td><td>${r.date}</td><td>${r.time}</td></tr>`).join('') || '<tr><td colspan="4">Tiada rekod</td></tr>'}</tbody></table></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            lucide.createIcons();
        }

        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === page);
            });
            if (page === 'dashboard') renderDashboard();
            else if (page === 'camera') renderCameraPage();
            else if (page === 'register') renderRegisterPage();
            else if (page === 'attendance') renderAttendanceTable();
            else if (page === 'users') renderUsersTable();
        }

        // Event Listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });
        document.getElementById('menuToggle')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.getElementById('closeAlertBtn')?.addEventListener('click', () => {
            document.getElementById('alertModal').style.display = 'none';
        });
        document.getElementById('alertModal')?.addEventListener('click', (e) => {
            if (e.target === document.getElementById('alertModal')) document.getElementById('alertModal').style.display = 'none';
        });

        // Initialize
        loadData();
        loadFaceModels();
        renderDashboard();
        lucide.createIcons();
        console.log('✅ Sistem sedia digunakan');
    </script>
</body>
</html>
